server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  # Phase 3 target: the owning schema (created by V54 in the monolith).
  # Until the split is complete, point this at the monolith's `bhukkad` schema.
  datasource:
    url: ${ORDER_DB_URL:jdbc:mysql://localhost:3306/bhukkad_orders?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${ORDER_DB_USERNAME:root}
    password: ${ORDER_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 30   # cores*2+2 for a 4-core pod
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  events:
    external:
      # Redpanda/Kafka for cross-service events (ORDER_CREATED, ...).
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      platform-topic: bhukkad.platform.events
      consumer-group: order-service
