# Per-service HorizontalPodAutoscaler template (Phase 3).
#
# order-service scales horizontally (stateless, outbox-owned): many replicas.
# admin-service stays small (2-3 replicas): it reads materialized summaries and
# never sits on the hot path. payment-service is stateful: single-writer, scale
# vertically + async (see docs/scaling.md).
#
# Usage: replace NAME/SERVICE, adjust metrics, kubectl apply.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service-hpa
  namespace: bhukkad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 20            # order-service: many replicas
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # P99-latency-driven scaling requires the Prometheus Adapter
    # (k8s/overlays/custom-metrics-hpa pattern); uncomment when wired:
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_server_requests_seconds_count_orders
    #     target:
    #       type: AverageValue
    #       averageValue: "30"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
