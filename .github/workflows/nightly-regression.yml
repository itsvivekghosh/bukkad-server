name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'  # Every night at 02:00 UTC (07:30 IST) — GitHub cron is UTC-only
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run full unit + integration test suite
        # The historical com.bhukkad.regression.RegressionTestSuite was a
        # monolith artifact deleted in 49c63b4; nightly regression coverage is
        # the full reactor test run plus the API regression script below.
        run: ./mvnw -B -f services/pom.xml test

      - name: Upload regression reports
        uses: actions/upload-artifact@v5
        with:
          name: regression-reports-nightly
          path: target/surefire-reports/
          retention-days: 30

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report-nightly
          path: target/site/jacoco/
          retention-days: 30

      - name: Run API regression tests
        run: python3 scripts/test-all-apis.py --skip-bootstrap --no-report
        env:
          BASE_URL: http://${{ vars.STAGING_EC2_HOST }}:8080

      - name: Upload API test report
        uses: actions/upload-artifact@v5
        with:
          name: api-test-report-nightly
          path: scripts/reports/
          retention-days: 30
        if: always()
