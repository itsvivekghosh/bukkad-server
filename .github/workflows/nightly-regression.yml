name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'  # Every night at 2 AM IST
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  regression:
    name: Full Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run full regression suite
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

      - name: Upload regression reports
        uses: actions/upload-artifact@v5
        with:
          name: regression-reports-nightly
          path: target/surefire-reports/
          retention-days: 30

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report-nightly
          path: target/site/jacoco/
          retention-days: 30

      - name: Run API regression tests
        run: python3 scripts/test-all-apis.py --skip-bootstrap --no-report
        env:
          BASE_URL: http://localhost:8080

      - name: Upload API test report
        uses: actions/upload-artifact@v5
        with:
          name: api-test-report-nightly
          path: scripts/reports/
          retention-days: 30
        if: always()
