name: Deploy to Production

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get staging image tag
        id: image
        run: |
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA \
            | jq -r '.value')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No staging image tag found. Deploy to staging first."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Comment PR with release info
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Production Release Candidate\n\n**Image Tag:** \`${{ steps.image.outputs.tag }}\`\n**Commit SHA:** \`${sha}\`\n**Branch:** \`${{ github.event.pull_request.head.ref }}\`\n\nThis PR will deploy the exact image that passed staging validation.`
            });

  get-image-tag:
    name: Get Image Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get staging Image Tag
        id: image
        run: |
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA \
            | jq -r '.value')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "No staging image tag found. Deploy to staging first."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate, get-image-tag]
    if: |
      (github.event_name == 'pull_request' && needs.validate.result == 'success') ||
      (github.event_name == 'push')
    environment:
      name: production
      url: https://bhukkad.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate deployment script
        run: |
          cat > ./deploy/docker-deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:-${{ steps.tag.outputs.tag }}}"
          APP_IMAGE="ghcr.io/itsvivekghosh/bukkad-server:${IMAGE_TAG}"
          CONTAINER_NAME="bhukkad-app"
          CONTAINER_PORT="${SERVER_PORT:-8080}"
          HOST_PORT="${SERVER_PORT:-8080}"

          echo "Stopping existing container..."
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          echo "Pulling image..."
          docker pull "$APP_IMAGE"

          echo "Starting container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            -e SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-prod}" \
            -e SERVER_PORT="${SERVER_PORT:-8080}" \
            -e DB_HOST="${DB_HOST:-localhost}" \
            -e DB_PORT="${DB_PORT:-3306}" \
            -e DB_NAME="${DB_NAME:-bhukkad}" \
            -e DB_USERNAME="${DB_USERNAME:-}" \
            -e DB_PASSWORD="${DB_PASSWORD:-}" \
            -e DB_URL="${DB_URL:-}" \
            -e REDIS_HOST="${REDIS_HOST:-localhost}" \
            -e REDIS_PORT="${REDIS_PORT:-6379}" \
            -e REDIS_PASSWORD="${REDIS_PASSWORD:-}" \
            -e JWT_SECRET="${JWT_SECRET:-}" \
            -e JWT_EXPIRATION="${JWT_EXPIRATION:-3600000}" \
            -e JWT_REFRESH_EXPIRATION="${JWT_REFRESH_EXPIRATION:-86400000}" \
            -e RAZORPAY_ENABLED="${RAZORPAY_ENABLED:-false}" \
            -e RAZORPAY_KEY_ID="${RAZORPAY_KEY_ID:-}" \
            -e RAZORPAY_KEY_SECRET="${RAZORPAY_KEY_SECRET:-}" \
            -e RAZORPAY_WEBHOOK_SECRET="${RAZORPAY_WEBHOOK_SECRET:-}" \
            -e NOTIFICATION_EMAIL_ENABLED="${NOTIFICATION_EMAIL_ENABLED:-false}" \
            -e NOTIFICATION_EMAIL_FROM="${NOTIFICATION_EMAIL_FROM:-noreply@bhukkad.com}" \
            -e STOMP_BROKER_TYPE="${STOMP_BROKER_TYPE:-simple}" \
            -e RABBITMQ_HOST="${RABBITMQ_HOST:-localhost}" \
            -e RABBITMQ_STOMP_PORT="${RABBITMQ_STOMP_PORT:-61613}" \
            -e RABBITMQ_USERNAME="${RABBITMQ_USERNAME:-guest}" \
            -e RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD:-guest}" \
            -e LIVE_RELAY_ENABLED="${LIVE_RELAY_ENABLED:-true}" \
            -e LIVE_RELAY_CHANNEL="${LIVE_RELAY_CHANNEL:-bhukkad:live:order-updates}" \
            -e DB_REPLICA_ENABLED="${DB_REPLICA_ENABLED:-true}" \
            -e DB_REPLICA_URL="${DB_REPLICA_URL:-}" \
            -e DB_REPLICA_USERNAME="${DB_REPLICA_USERNAME:-}" \
            -e DB_REPLICA_PASSWORD="${DB_REPLICA_PASSWORD:-}" \
            -e PAYMENT_PROVIDER="${PAYMENT_PROVIDER:-simulated}" \
            -e PROMETHEUS_USERNAME="${PROMETHEUS_USERNAME:-}" \
            -e PROMETHEUS_PASSWORD="${PROMETHEUS_PASSWORD:-}" \
            "${APP_IMAGE}"

          echo "Container started: $CONTAINER_NAME with image: $APP_IMAGE"
          SCRIPT
          chmod +x ./deploy/docker-deploy.sh
          ls -la ./deploy/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=${{ needs.validate.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.get-image-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to production VM
        run: |
          echo "Deploying image tag: ${{ steps.tag.outputs.tag }}"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./deploy/docker-deploy.sh \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/docker-deploy.sh"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "chmod +x /tmp/docker-deploy.sh && \
            IMAGE_TAG=${{ steps.tag.outputs.tag }} \
            SPRING_PROFILES_ACTIVE=prod \
            DB_HOST=${{ secrets.PROD_DB_HOST }} \
            DB_PORT=${{ secrets.PROD_DB_PORT }} \
            DB_NAME=${{ secrets.PROD_DB_NAME }} \
            DB_USERNAME=${{ secrets.PROD_DB_USERNAME }} \
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
            DB_URL=${{ secrets.PROD_DB_URL }} \
            REDIS_HOST=${{ secrets.PROD_REDIS_HOST }} \
            REDIS_PORT=${{ secrets.PROD_REDIS_PORT }} \
            REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }} \
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }} \
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }} \
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }} \
            RAZORPAY_ENABLED=${{ secrets.RAZORPAY_ENABLED }} \
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }} \
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }} \
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }} \
            NOTIFICATION_EMAIL_ENABLED=${{ secrets.NOTIFICATION_EMAIL_ENABLED }} \
            NOTIFICATION_EMAIL_FROM=${{ secrets.NOTIFICATION_EMAIL_FROM }} \
            STOMP_BROKER_TYPE=${{ secrets.STOMP_BROKER_TYPE }} \
            RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }} \
            RABBITMQ_STOMP_PORT=${{ secrets.RABBITMQ_STOMP_PORT }} \
            RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }} \
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }} \
            LIVE_RELAY_ENABLED=${{ secrets.LIVE_RELAY_ENABLED }} \
            LIVE_RELAY_CHANNEL=${{ secrets.LIVE_RELAY_CHANNEL }} \
            DB_REPLICA_ENABLED=${{ secrets.DB_REPLICA_ENABLED }} \
            DB_REPLICA_URL=${{ secrets.DB_REPLICA_URL }} \
            DB_REPLICA_USERNAME=${{ secrets.DB_REPLICA_USERNAME }} \
            DB_REPLICA_PASSWORD=${{ secrets.DB_REPLICA_PASSWORD }} \
            PAYMENT_PROVIDER=${{ secrets.PAYMENT_PROVIDER }} \
            PROMETHEUS_USERNAME=${{ secrets.PROMETHEUS_USERNAME }} \
            PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }} \
            /tmp/docker-deploy.sh"

      - name: Wait for container to start
        run: |
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
              "curl -sf http://localhost:8080/api/v1/health/ping -o /dev/null"; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Attempt $i: container not ready yet..."
            sleep 5
          done
          echo "Container failed to become healthy"
          exit 1

      - name: Verify production deployment
        run: |
          echo "Verifying production deployment..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "docker ps -a --filter name=bhukkad-app --format '{{.Image}} {{.Status}}'"

      - name: Run production smoke tests
        run: |
          echo "Running production smoke tests..."
          curl -f https://bhukkad.com/api/v1/health/ping || echo "Smoke test endpoint pending"
