name: 🏭 Deploy to Production

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

env:
  APP_PORT: "8080"

jobs:
  get-image-tag:
    name: 🏷️ Get Staging Image Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: 🛠️ Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: 🏷️ Retrieve validated staging image
        id: image
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 FETCHING STAGING-VALIDATED IMAGE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
            | jq -r '.value // empty')
            
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "❌ No staging image tag found!"
            echo "🚨 Please deploy to staging first before production deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          fi
          
          echo "✅ Found validated staging image: ${TAG}"
          echo "🏷️ This image has passed staging validation"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  validate:
    name: 📋 Release Candidate Validation
    runs-on: ubuntu-latest
    needs: get-image-tag
    if: github.event_name == 'pull_request'

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📝 Comment PR with release information
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const imageTag = "${{ needs.get-image-tag.outputs.tag }}";
            
            const releaseInfo = `
            ## 🏭 Production Release Candidate
            
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            
            ### 📊 Release Details
            
            | Field | Value |
            |-------|-------|
            | 🏷️ **Image Tag** | \`${imageTag}\` |
            | 📝 **Commit SHA** | \`${sha}\` |
            | 🌿 **Source Branch** | \`${{ github.event.pull_request.head.ref }}\` |
            | 🎯 **Target Branch** | \`main\` |
            | 🏥 **Health Status** | ✅ Staging Validated |
            
            ### 🚀 Deployment Process
            
            This PR will deploy the **exact same Docker image** that has:
            - ✅ Passed all staging tests
            - ✅ Been validated in staging environment  
            - ✅ Completed health checks successfully
            
            ### 🔐 Security Note
            
            🛡️ This ensures **zero-drift deployment** - the production deployment uses the identical image that was tested in staging.
            
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            
            **Ready for production deployment** 🚀
            `;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: releaseInfo
            });

  deploy:
    name: 🏭 Production Deployment
    runs-on: ubuntu-latest
    needs: [get-image-tag]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment:
      name: production
      url: ${{ secrets.PROD_DOMAIN && format('https://{0}', secrets.PROD_DOMAIN) || format('http://{0}:8080', secrets.PROD_SSH_HOST) }}

    steps:
      # ══════════════════════════════════════════════════════════════
      # 📋 PREPARATION PHASE
      # ══════════════════════════════════════════════════════════════
      
      - name: 📦 Checkout repository
        uses: actions/checkout@v5

      - name: 🎯 Resolve production SSH target
        id: ssh
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 PRODUCTION SERVER CONFIGURATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          HOST="${{ secrets.PROD_SSH_HOST }}"
          if [ -z "${HOST}" ]; then
            echo "❌ PROD_SSH_HOST secret is required for production deployment!"
            echo "🔧 Please configure this secret in GitHub repository settings"
            exit 1
          fi
          
          USER="${{ secrets.PROD_SSH_USER }}"
          if [ -z "${USER}" ]; then
            USER="ubuntu"
            echo "ℹ️  Using default SSH user: ubuntu"
          fi
          
          echo "✅ SSH Configuration Validated:"
          echo "   📡 Host: ${HOST}"
          echo "   👤 User: ${USER}"
          echo "   🔐 Key: Configured"
          
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ══════════════════════════════════════════════════════════════
      # 🔐 SSH & SECURITY SETUP
      # ══════════════════════════════════════════════════════════════

      - name: 🔑 Setup SSH connection
        run: |
          echo "🔐 Setting up production SSH authentication..."
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "🌐 Adding production host to known hosts..."
          ssh-keyscan -H "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "✅ Production SSH setup completed"

      # ══════════════════════════════════════════════════════════════
      # 🚀 DEPLOYMENT PHASE
      # ══════════════════════════════════════════════════════════════

      - name: 🏭 Deploy to production environment
        run: |
          set -euo pipefail
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏭 BHUKKAD PRODUCTION DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ${{ needs.get-image-tag.outputs.tag }}"
          echo "🎯  Environment: Production"
          echo "📡  Host: ${{ steps.ssh.outputs.host }}"
          echo "🔐  Security: High"
          echo "⚠️   CRITICAL DEPLOYMENT - PRODUCTION SYSTEM"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Build secure production environment variables
          echo "📝 Building production environment configuration..."
          cat > /tmp/deploy-env.txt << 'EOF'
          # 🎯 Core Application Settings
          IMAGE_TAG=${{ needs.get-image-tag.outputs.tag }}
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=${{ env.APP_PORT }}
          
          # 🗄️ Database Configuration
          DB_HOST=${{ secrets.PROD_DB_HOST }}
          DB_PORT=${{ secrets.PROD_DB_PORT }}
          DB_NAME=${{ secrets.PROD_DB_NAME }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
          DB_URL=${{ secrets.PROD_DB_URL }}
          
          # 🔴 Redis Configuration
          REDIS_HOST=${{ secrets.PROD_REDIS_HOST }}
          REDIS_PORT=${{ secrets.PROD_REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }}
          REDIS_LOCAL=${{ secrets.PROD_REDIS_LOCAL }}
          
          # 🔐 Security & Authentication
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          
          # 💳 Payment Gateway (Razorpay)
          RAZORPAY_ENABLED=${{ secrets.RAZORPAY_ENABLED }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          
          # 📧 Email & Notifications
          NOTIFICATION_EMAIL_ENABLED=${{ secrets.NOTIFICATION_EMAIL_ENABLED }}
          NOTIFICATION_EMAIL_FROM=${{ secrets.NOTIFICATION_EMAIL_FROM }}
          
          # 🐰 Message Broker (RabbitMQ)
          STOMP_BROKER_TYPE=${{ secrets.STOMP_BROKER_TYPE }}
          RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_STOMP_PORT=${{ secrets.RABBITMQ_STOMP_PORT }}
          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          
          # 📡 Live Updates & WebSocket
          LIVE_RELAY_ENABLED=${{ secrets.LIVE_RELAY_ENABLED }}
          LIVE_RELAY_CHANNEL=${{ secrets.LIVE_RELAY_CHANNEL }}
          
          # 🔄 Database Replica Configuration
          DB_REPLICA_ENABLED=${{ secrets.PROD_DB_REPLICA_ENABLED }}
          DB_REPLICA_URL=${{ secrets.PROD_DB_REPLICA_URL }}
          DB_REPLICA_USERNAME=${{ secrets.PROD_DB_REPLICA_USERNAME }}
          DB_REPLICA_PASSWORD=${{ secrets.PROD_DB_REPLICA_PASSWORD }}
          
          # ⚙️ System Configuration
          PAYMENT_PROVIDER=${{ secrets.PAYMENT_PROVIDER }}
          PROMETHEUS_USERNAME=${{ secrets.PROMETHEUS_USERNAME }}
          PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
          
          # 🐳 Docker Configuration
          DOCKER_NETWORK=${{ secrets.PROD_DOCKER_NETWORK }}
          GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME=${{ github.actor }}
          EOF
          
          echo "📤 Copying deployment script to production server..."
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            docker/scripts/docker-deploy.sh \
            "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}:/tmp/docker-deploy.sh"
          
          echo "📤 Transferring production environment configuration..."
          base64 /tmp/deploy-env.txt | \
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}" \
              "base64 -d > /tmp/deploy-env.txt && chmod 600 /tmp/deploy-env.txt"
          
          echo "🔄 Executing production deployment..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}" \
            "chmod 755 /tmp/docker-deploy.sh && \
            echo '🏭 Starting production deployment execution...' && \
            ls -la /tmp/docker-deploy.sh && \
            set -a && source /tmp/deploy-env.txt && set +a && \
            bash /tmp/docker-deploy.sh"

      # ══════════════════════════════════════════════════════════════
      # 🏥 HEALTH CHECK & VERIFICATION
      # ══════════════════════════════════════════════════════════════

      - name: 🏥 Wait for production application startup
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏥 PRODUCTION HEALTH CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Enhanced health check with detailed monitoring
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}" \
            'echo "🔍 Starting production health monitoring..."
            CONSECUTIVE_SUCCESS=0
            REQUIRED_CONSECUTIVE=3
            
            for i in $(seq 1 90); do
              echo "🩺 Health check attempt $i/90..."
              
              if curl -sf http://localhost:${{ env.APP_PORT }}/api/v1/health/ping -o /dev/null 2>/dev/null; then
                CONSECUTIVE_SUCCESS=$((CONSECUTIVE_SUCCESS + 1))
                echo "✅ Health check passed ($CONSECUTIVE_SUCCESS/$REQUIRED_CONSECUTIVE consecutive)"
                
                if [ $CONSECUTIVE_SUCCESS -ge $REQUIRED_CONSECUTIVE ]; then
                  echo "🎉 Production application is stable and healthy!"
                  echo "✅ $REQUIRED_CONSECUTIVE consecutive successful health checks completed"
                  exit 0
                fi
              else
                CONSECUTIVE_SUCCESS=0
                echo "⏳ Waiting for application startup..."
              fi
              
              if [ $i -eq 1 ] || [ $((i % 15)) -eq 0 ]; then
                echo "📊 Container status check..."
                docker ps -a --filter name=bhukkad-app --format "{{.Names}}: {{.Status}}" 2>/dev/null || true
              fi
              
              sleep 5
            done
            
            echo "❌ Production health check failed after 90 attempts (7.5 minutes)"
            echo "🚨 CRITICAL: Production deployment health check failed!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Final Container Status:"
            docker ps -a --filter name=bhukkad-app --format "{{.Image}} {{.Status}}" 2>&1 || true
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Container Logs (last 150 lines):"
            docker logs bhukkad-app --tail 150 2>&1 || true
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1'

      # ══════════════════════════════════════════════════════════════
      # ✅ DEPLOYMENT VERIFICATION
      # ══════════════════════════════════════════════════════════════

      - name: ✅ Verify production deployment
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ PRODUCTION DEPLOYMENT VERIFICATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}" \
            "echo '🔍 Production container verification:'
            docker ps -a --filter name=bhukkad-app --format '{{.Image}} {{.Status}}' 2>&1
            echo '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━'
            echo '📋 Application startup logs (last 30 lines):'
            docker logs bhukkad-app --tail 30 2>&1 || true"

      # ══════════════════════════════════════════════════════════════
      # 🧪 PRODUCTION SMOKE TESTS
      # ══════════════════════════════════════════════════════════════

      - name: 🧪 Run production smoke tests
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 PRODUCTION SMOKE TESTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Internal health check
          echo "🔍 Internal health endpoint test..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ steps.ssh.outputs.user }}@${{ steps.ssh.outputs.host }}" \
            "curl -f http://localhost:${{ env.APP_PORT }}/api/v1/health/ping -m 10"
          echo "✅ Internal health check: PASSED"
          
          # External health check (if domain configured)
          PROD_DOMAIN="${{ secrets.PROD_DOMAIN }}"
          if [ -n "${PROD_DOMAIN}" ]; then
            echo "🔍 External health endpoint test..."
            EXTERNAL_URL="https://${PROD_DOMAIN}/api/v1/health/ping"
            echo "Testing: ${EXTERNAL_URL}"
            
            if curl -f "${EXTERNAL_URL}" -m 15; then
              echo "✅ External health check: PASSED"
            else
              echo "⚠️  External health check failed (may be DNS/proxy configuration)"
              echo "ℹ️  Internal health check passed - application is running correctly"
            fi
          else
            echo "ℹ️  No PROD_DOMAIN configured - skipping external health check"
          fi

      # ══════════════════════════════════════════════════════════════
      # 📊 DEPLOYMENT SUMMARY
      # ══════════════════════════════════════════════════════════════

      - name: 🎉 Production deployment success
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 PRODUCTION DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ghcr.io/itsvivekghosh/bukkad-server:${{ needs.get-image-tag.outputs.tag }}"
          echo "🏭  Environment: Production"
          echo "📡  SSH Host: ${{ steps.ssh.outputs.host }}"
          PROD_URL="${{ secrets.PROD_DOMAIN && format('https://{0}', secrets.PROD_DOMAIN) || format('http://{0}:8080', steps.ssh.outputs.host) }}"
          echo "🌐  Production URL: ${PROD_URL}"
          echo "🏥  Health Check: ✅ Passed (3 consecutive)"
          echo "🧪  Smoke Tests: ✅ Completed"
          echo "🔐  Security: ✅ Production Grade"
          echo "⏰  Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 PRODUCTION IS LIVE AND READY FOR TRAFFIC!"
          echo "👥 Notify your team that production deployment is complete"

      - name: 💥 Production deployment failure
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚨 PRODUCTION DEPLOYMENT FAILED!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ghcr.io/itsvivekghosh/bukkad-server:${{ needs.get-image-tag.outputs.tag }}"
          echo "🏭  Environment: Production"
          echo "📡  SSH Host: ${{ steps.ssh.outputs.host }}"
          echo "❌  Status: FAILED"
