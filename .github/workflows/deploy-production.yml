name: Deploy to Production

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROD_SSH_HOST_DEFAULT: ec2-13-201-21-45.ap-south-1.compute.amazonaws.com
  APP_PORT: "8080"

jobs:
  get-image-tag:
    name: Get Image Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Resolve production image tag
        id: image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
            | jq -r '.value // empty')
          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::warning::STAGING_IMAGE_SHA not set; falling back to deploy tag"
            TAG="deploy"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Production image tag: ${TAG}"

  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    needs: get-image-tag
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - name: Comment PR with release info
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Production Release Candidate\n\n**Image Tag:** \`${{ needs.get-image-tag.outputs.tag }}\`\n**Commit SHA:** \`${sha}\`\n**Branch:** \`${{ github.event.pull_request.head.ref }}\`\n\nMerge and run **Deploy to Production** manually when ready.`
            });

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [get-image-tag]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: http://ec2-13-201-21-45.ap-south-1.compute.amazonaws.com:8080

    steps:
      - uses: actions/checkout@v5

      - name: Prepare deployment script
        run: |
          mkdir -p ./deploy
          cp docker/scripts/docker-deploy.sh ./deploy/docker-deploy.sh
          chmod +x ./deploy/docker-deploy.sh

      - name: Resolve SSH target
        id: ssh
        run: |
          HOST="${{ secrets.PROD_SSH_HOST }}"
          HOST="${HOST:-${{ env.PROD_SSH_HOST_DEFAULT }}}"
          USER="${{ secrets.PROD_SSH_USER }}"
          USER="${USER:-ubuntu}"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          echo "SSH target: ${USER}@${HOST}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH authentication
        run: bash .github/scripts/ec2-verify-ssh.sh "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" ~/.ssh/id_ed25519 20

      - name: Pre-flight SSH port
        run: bash .github/scripts/ec2-preflight-ssh.sh "${{ steps.ssh.outputs.host }}" 22 15

      - name: Deploy to production VM
        run: |
          set -euo pipefail

          REDIS_LOCAL="${{ vars.PROD_REDIS_LOCAL }}"
          REDIS_LOCAL="${REDIS_LOCAL:-true}"

          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "::error::Missing GHCR_READ_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then echo "::error::Missing PROD_SSH_KEY"; exit 1; fi
          if [ -z "${{ secrets.PROD_DB_HOST }}" ]; then echo "::error::Missing PROD_DB_HOST"; exit 1; fi
          if [ -z "${{ secrets.PROD_DB_NAME }}" ]; then echo "::error::Missing PROD_DB_NAME"; exit 1; fi
          if [ -z "${{ secrets.PROD_DB_USERNAME }}" ]; then echo "::error::Missing PROD_DB_USERNAME"; exit 1; fi
          if [ -z "${{ secrets.PROD_DB_PASSWORD }}" ]; then echo "::error::Missing PROD_DB_PASSWORD"; exit 1; fi
          if [ -z "${{ secrets.PROD_JWT_SECRET }}" ]; then echo "::error::Missing PROD_JWT_SECRET"; exit 1; fi

          echo "Deploying image tag: ${{ needs.get-image-tag.outputs.tag }}"

          {
            printf 'IMAGE_TAG=%s\n' "${{ needs.get-image-tag.outputs.tag }}"
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'DOCKER_NETWORK=host\n'
            printf 'SERVER_PORT=%s\n' "${{ env.APP_PORT }}"
            printf 'DB_HOST=%s\n' "${{ secrets.PROD_DB_HOST }}"
            printf 'DB_PORT=%s\n' "${{ secrets.PROD_DB_PORT }}"
            printf 'DB_NAME=%s\n' "${{ secrets.PROD_DB_NAME }}"
            printf 'DB_USERNAME=%s\n' "${{ secrets.PROD_DB_USERNAME }}"
            printf 'DB_PASSWORD=%s\n' "${{ secrets.PROD_DB_PASSWORD }}"
            printf 'JWT_SECRET=%s\n' "${{ secrets.PROD_JWT_SECRET }}"
            printf 'JWT_EXPIRATION=%s\n' "${{ secrets.JWT_EXPIRATION }}"
            printf 'JWT_REFRESH_EXPIRATION=%s\n' "${{ secrets.JWT_REFRESH_EXPIRATION }}"
            printf 'GHCR_USERNAME=itsvivekghosh\n'
            printf 'GHCR_TOKEN=%s\n' "${{ secrets.GHCR_READ_TOKEN }}"
            printf 'REDIS_LOCAL=%s\n' "${REDIS_LOCAL}"
          } > /tmp/deploy-env.txt

          if [ "${REDIS_LOCAL}" = "true" ]; then
            printf 'REDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.PROD_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
          else
            printf 'REDIS_HOST=%s\n' "${{ secrets.PROD_REDIS_HOST }}" >> /tmp/deploy-env.txt
            REDIS_PORT="${{ secrets.PROD_REDIS_PORT }}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            printf 'REDIS_PORT=%s\n' "${REDIS_PORT}" >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.PROD_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
            chmod +x .github/scripts/ec2-redis-preflight.sh
            bash .github/scripts/ec2-redis-preflight.sh \
              "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
              ~/.ssh/id_ed25519 /tmp/deploy-env.txt
          fi

          bash .github/scripts/ec2-deploy-remote.sh \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 ./deploy/docker-deploy.sh /tmp/deploy-env.txt

      - name: Wait for healthy app
        run: |
          bash .github/scripts/wait-for-ec2-health.sh \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 60 5

      - name: Deployment summary
        if: success()
        run: |
          echo "Production deployment successful"
          echo "Image: ghcr.io/itsvivekghosh/bukkad-server:${{ needs.get-image-tag.outputs.tag }}"
          echo "Host: ${{ steps.ssh.outputs.host }}"
