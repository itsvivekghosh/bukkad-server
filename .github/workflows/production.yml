name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          GHCR_IMAGE="${{ vars.GHCR_IMAGE }}"
          GHCR_IMAGE="${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: ${GHCR_IMAGE}:${GITHUB_SHA} and :deploy"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "🏭 Production Deployment"
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    # Production approval gate: this job references the GitHub "production"
    # environment. The environment protection rules MUST be configured in the
    # repository settings (Settings → Environments → production): set
    # "Required reviewers" to 1 so every deploy to production waits for manual
    # approval before any step of this job runs.
    environment:
      name: production
      url: http://${{ vars.PROD_EC2_HOST }}:8080

    env:
      APP_PORT: ${{ vars.APP_PORT }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 📋 PHASE 1 — Checkout & configuration
      # ─────────────────────────────────────────────────────────────

      - name: "📦 Checkout repository"
        uses: actions/checkout@v5

      - name: "⚙️ Set deployment defaults"
        run: |
          {
            echo "APP_PORT=${APP_PORT:-8080}"
            echo "HEALTH_PATH=${HEALTH_PATH:-/api/v1/health/ping}"
            echo "GHCR_IMAGE=${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
            echo "GHCR_USERNAME=${GHCR_USERNAME:-itsvivekghosh}"
          } >> "$GITHUB_ENV"

      - name: "📊 Deployment overview"
        run: |
          source .github/scripts/deploy-log.sh
          deploy_pipeline_diagram "Production"
          deploy_banner "Production 🏭" "${{ github.sha }}" "${{ needs.build-and-push.outputs.tag }}" "${{ vars.PROD_EC2_HOST }}"
          log_section "🔧 Configuration check"
          check_optional_var "PROD_EC2_HOST" "${{ vars.PROD_EC2_HOST }}" "(required)"
          check_optional_var "GHCR_IMAGE" "${GHCR_IMAGE}" "ghcr.io/itsvivekghosh/bukkad-server"
          log_section_end

      - name: "📜 Prepare deployment script"
        run: |
          echo "✅ Deployment uses k8s/ manifests via kubectl"

      # ─────────────────────────────────────────────────────────────
      # 🔐 PHASE 2 — Kubernetes deployment
      # ─────────────────────────────────────────────────────────────

      - name: "🔒 Validate kubeconfig"
        run: kubectl cluster-info

      - name: "🚀 Deploy to production"
        run: |
          set -euo pipefail
          kubectl apply -k k8s/
          kubectl rollout status deployment/bhukkad-gateway -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-restaurant -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-identity -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-order -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-payment -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-delivery -n bhukkad --timeout=600s

      # ─────────────────────────────────────────────────────────────
      # 🏥 PHASE 3 — Health check & smoke test
      # ─────────────────────────────────────────────────────────────

      - name: "🏥 Wait for healthy gateway"
        run: |
          kubectl port-forward -n bhukkad svc/bhukkad-gateway 19090:8080 >/tmp/bhukkad-pf.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          sleep 3
          curl -sf http://127.0.0.1:19090/actuator/health/readiness -o /dev/null || true
          kill ${PF_PID} 2>/dev/null || true
          trap - EXIT
