name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.sha }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          GHCR_IMAGE="${{ vars.GHCR_IMAGE }}"
          GHCR_IMAGE="${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: ${GHCR_IMAGE}:${GITHUB_SHA} and :deploy"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "🏭 Production Deployment"
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    environment:
      name: production
      url: http://${{ vars.PROD_EC2_HOST }}:8080

    env:
      APP_PORT: ${{ vars.APP_PORT }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 📋 PHASE 1 — Checkout & configuration
      # ─────────────────────────────────────────────────────────────

      - name: "📦 Checkout repository"
        uses: actions/checkout@v5

      - name: "⚙️ Set deployment defaults"
        run: |
          {
            echo "APP_PORT=${APP_PORT:-8080}"
            echo "HEALTH_PATH=${HEALTH_PATH:-/api/v1/health/ping}"
            echo "CONTAINER_NAME=${CONTAINER_NAME:-bhukkad-app}"
            echo "GHCR_IMAGE=${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
            echo "GHCR_USERNAME=${GHCR_USERNAME:-itsvivekghosh}"
          } >> "$GITHUB_ENV"

      - name: "📊 Deployment overview"
        run: |
          source .github/scripts/deploy-log.sh
          deploy_pipeline_diagram "Production"
          deploy_banner "Production 🏭" "${{ github.sha }}" "${{ needs.build-and-push.outputs.tag }}" "${{ vars.PROD_EC2_HOST }}"
          log_section "🔧 Configuration check"
          check_optional_var "PROD_EC2_HOST" "${{ vars.PROD_EC2_HOST }}" "(required)"
          check_optional_var "GHCR_IMAGE" "${GHCR_IMAGE}" "ghcr.io/itsvivekghosh/bukkad-server"
          log_section_end

      - name: "📜 Prepare deployment script"
        run: |
          chmod +x .github/scripts/ec2.sh
          mkdir -p ./deploy
          cp docker/scripts/docker-deploy.sh ./deploy/docker-deploy.sh
          chmod +x ./deploy/docker-deploy.sh
          echo "✅ docker-deploy.sh ready ($(wc -l < ./deploy/docker-deploy.sh) lines)"

      # ─────────────────────────────────────────────────────────────
      # 🔐 PHASE 2 — SSH connectivity
      # ─────────────────────────────────────────────────────────────

      - name: "🎯 Resolve SSH target"
        id: ssh
        run: |
          source .github/scripts/deploy-log.sh
          HOST="${{ secrets.PROD_SSH_HOST }}"
          HOST="${HOST:-${{ vars.PROD_EC2_HOST }}}"
          if [ -z "${HOST}" ]; then
            log_error "Set PROD_SSH_HOST secret or PROD_EC2_HOST variable"
            exit 1
          fi
          USER="${{ secrets.PROD_SSH_USER }}"
          USER="${USER:-ubuntu}"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          log_ok "SSH target resolved: ${USER}@${HOST}"

      - name: "🔑 Setup SSH"
        run: |
          echo "🔐 Configuring production SSH..."
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH setup complete"

      - name: "🔍 Verify SSH authentication"
        run: bash .github/scripts/ec2.sh verify-ssh "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" ~/.ssh/id_ed25519 20

      - name: "🛡️ Pre-flight SSH port"
        run: bash .github/scripts/ec2.sh preflight-port "${{ steps.ssh.outputs.host }}" 22 15

      # ─────────────────────────────────────────────────────────────
      # 🔒 PHASE 3 — Secrets validation
      # ─────────────────────────────────────────────────────────────

      - name: "🔒 Validate secrets"
        run: |
          source .github/scripts/deploy-log.sh
          log_section "🔒 Validate required secrets"
          check_required_secret "GHCR_READ_TOKEN" "${{ secrets.GHCR_READ_TOKEN }}"
          check_required_secret "PROD_SSH_KEY" "${{ secrets.PROD_SSH_KEY }}"
          check_required_secret "PROD_DB_HOST" "${{ secrets.PROD_DB_HOST }}"
          check_required_secret "PROD_DB_NAME" "${{ secrets.PROD_DB_NAME }}"
          check_required_secret "PROD_DB_USERNAME" "${{ secrets.PROD_DB_USERNAME }}"
          check_required_secret "PROD_DB_PASSWORD" "${{ secrets.PROD_DB_PASSWORD }}"
          check_required_secret "PROD_JWT_SECRET" "${{ secrets.PROD_JWT_SECRET }}"
          log_section_end

      # ─────────────────────────────────────────────────────────────
      # 🚀 PHASE 4 — Deploy to EC2
      # ─────────────────────────────────────────────────────────────

      - name: "🚀 Deploy to production VM"
        run: |
          set -euo pipefail
          source .github/scripts/deploy-log.sh

          DB_PORT="${{ secrets.PROD_DB_PORT }}"
          DB_PORT="${DB_PORT:-3306}"
          REDIS_LOCAL="${{ vars.PROD_REDIS_LOCAL }}"
          REDIS_LOCAL="${REDIS_LOCAL:-true}"
          FLYWAY_REPAIR="${{ vars.FLYWAY_REPAIR_ON_DEPLOY }}"
          FLYWAY_REPAIR="${FLYWAY_REPAIR:-false}"

          if [ "${FLYWAY_REPAIR}" = "true" ]; then
            log_section "🗄️ Flyway repair (pre-deploy)"
            printf 'DB_HOST=%s\n' "${{ secrets.PROD_DB_HOST }}" > /tmp/flyway-env.txt
            printf 'DB_PORT=%s\n' "${DB_PORT}" >> /tmp/flyway-env.txt
            printf 'DB_NAME=%s\n' "${{ secrets.PROD_DB_NAME }}" >> /tmp/flyway-env.txt
            printf 'DB_USERNAME=%s\n' "${{ secrets.PROD_DB_USERNAME }}" >> /tmp/flyway-env.txt
            printf 'DB_PASSWORD=%s\n' "${{ secrets.PROD_DB_PASSWORD }}" >> /tmp/flyway-env.txt
            bash .github/scripts/ec2.sh flyway-repair \
              "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
              ~/.ssh/id_ed25519 "${PWD}/src/main/resources/db/migration" /tmp/flyway-env.txt
            log_section_end
          fi

          {
            printf 'IMAGE_TAG=%s\n' "${{ needs.build-and-push.outputs.tag }}"
            printf 'GHCR_IMAGE=%s\n' "${{ needs.build-and-push.outputs.image }}"
            printf 'GHCR_USERNAME=%s\n' "${GHCR_USERNAME}"
            printf 'CONTAINER_NAME=%s\n' "${CONTAINER_NAME}"
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'DOCKER_NETWORK=host\n'
            printf 'SERVER_PORT=%s\n' "${APP_PORT}"
            printf 'DB_HOST=%s\n' "${{ secrets.PROD_DB_HOST }}"
            printf 'DB_PORT=%s\n' "${DB_PORT}"
            printf 'DB_NAME=%s\n' "${{ secrets.PROD_DB_NAME }}"
            printf 'DB_USERNAME=%s\n' "${{ secrets.PROD_DB_USERNAME }}"
            printf 'DB_PASSWORD=%s\n' "${{ secrets.PROD_DB_PASSWORD }}"
            printf 'JWT_SECRET=%s\n' "${{ secrets.PROD_JWT_SECRET }}"
            printf 'JWT_EXPIRATION=%s\n' "${{ secrets.JWT_EXPIRATION }}"
            printf 'JWT_REFRESH_EXPIRATION=%s\n' "${{ secrets.JWT_REFRESH_EXPIRATION }}"
            printf 'GHCR_TOKEN=%s\n' "${{ secrets.GHCR_READ_TOKEN }}"
            printf 'REDIS_LOCAL=%s\n' "${REDIS_LOCAL}"
          } > /tmp/deploy-env.txt

          if [ "${REDIS_LOCAL}" = "true" ]; then
            printf 'REDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.PROD_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
          else
            printf 'REDIS_HOST=%s\n' "${{ secrets.PROD_REDIS_HOST }}" >> /tmp/deploy-env.txt
            REDIS_PORT="${{ secrets.PROD_REDIS_PORT }}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            printf 'REDIS_PORT=%s\n' "${REDIS_PORT}" >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.PROD_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
            bash .github/scripts/ec2.sh redis-preflight \
              "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
              ~/.ssh/id_ed25519 /tmp/deploy-env.txt
          fi

          bash .github/scripts/ec2.sh deploy \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 ./deploy/docker-deploy.sh /tmp/deploy-env.txt

      # ─────────────────────────────────────────────────────────────
      # 🏥 PHASE 5 — Health check & smoke test
      # ─────────────────────────────────────────────────────────────

      - name: "🏥 Wait for healthy app"
        run: |
          bash .github/scripts/ec2.sh wait-health \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 60 5 "${CONTAINER_NAME}" \
            "http://localhost:${APP_PORT}${HEALTH_PATH}"

      - name: "🧪 Production smoke test (external)"
        continue-on-error: true
        run: |
          source .github/scripts/deploy-log.sh
          log_section "🧪 External smoke test"
          URL="http://${{ steps.ssh.outputs.host }}:${APP_PORT}${HEALTH_PATH}"
          log_info "Testing ${URL}"
          if curl -sf "${URL}" -m 10 -o /dev/null; then
            log_ok "External health check passed"
          else
            log_warn "External check failed (SG/DNS) — internal health already passed"
          fi
          log_section_end

      # ─────────────────────────────────────────────────────────────
      # 📊 PHASE 6 — Summary
      # ─────────────────────────────────────────────────────────────

      - name: "🎉 Deployment success summary"
        if: success()
        run: |
          source .github/scripts/deploy-log.sh
          deploy_summary "Production 🏭" \
            "${{ steps.ssh.outputs.host }}" \
            "${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}" \
            "http://${{ steps.ssh.outputs.host }}:${APP_PORT}${HEALTH_PATH}"

      - name: "💥 Deployment failure summary"
        if: failure()
        run: |
          source .github/scripts/deploy-log.sh
          deploy_failure_summary "Production 🏭" \
            "${{ steps.ssh.outputs.host }}" \
            "${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
