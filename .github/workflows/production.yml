name: Production Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      tag: ${{ steps.meta.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        # Must match the service deployments in k8s/ and the services.yml matrix.
        service: [identity, restaurant, order, payment, delivery, notification, admin-analytics, gateway, search, survey, referral, supportticket]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The monolith docker/Dockerfile is retired (deleted with the monolith);
      # production deploys the k8s/ microservice manifests, so build exactly the
      # per-service images those manifests reference, via the canonical recipe
      # services/docker/Dockerfile.service (MODULE build-arg, context = reactor
      # root services/). Pushed under the immutable commit-sha tag; the deploy
      # job pins these tags into the kustomize render below (finding: CI must
      # push what k8s pulls — ghcr.io/bhukkad/<service>).
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/docker/Dockerfile.service
          push: true
          build-args: |
            MODULE=${{ matrix.service }}
          tags: ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: "🏭 Production Deployment"
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    # Production approval gate: this job references the GitHub "production"
    # environment. The environment protection rules MUST be configured in the
    # repository settings (Settings → Environments → production): set
    # "Required reviewers" to 1 so every deploy to production waits for manual
    # approval before any step of this job runs.
    environment:
      name: production
      url: http://${{ vars.PROD_EC2_HOST }}:8080

    env:
      APP_PORT: ${{ vars.APP_PORT }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 📋 PHASE 1 — Checkout & configuration
      # ─────────────────────────────────────────────────────────────

      - name: "📦 Checkout repository"
        uses: actions/checkout@v5

      - name: "⚙️ Set deployment defaults"
        run: |
          {
            echo "APP_PORT=${APP_PORT:-8080}"
            echo "HEALTH_PATH=${HEALTH_PATH:-/api/v1/health/ping}"
            echo "GHCR_IMAGE=${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
            echo "GHCR_USERNAME=${GHCR_USERNAME:-itsvivekghosh}"
          } >> "$GITHUB_ENV"

      - name: "📊 Deployment overview"
        run: |
          source .github/scripts/deploy-log.sh
          deploy_pipeline_diagram "Production"
          deploy_banner "Production 🏭" "${{ github.sha }}" "${{ needs.build-and-push.outputs.tag }}" "${{ vars.PROD_EC2_HOST }}"
          log_section "🔧 Configuration check"
          check_optional_var "PROD_EC2_HOST" "${{ vars.PROD_EC2_HOST }}" "(required)"
          check_optional_var "GHCR_IMAGE" "${GHCR_IMAGE}" "ghcr.io/itsvivekghosh/bukkad-server"
          log_section_end

      - name: "📜 Prepare deployment script"
        run: |
          echo "✅ Deployment uses k8s/ manifests via kubectl"

      # ─────────────────────────────────────────────────────────────
      # 🔐 PHASE 2 — Kubernetes deployment
      # ─────────────────────────────────────────────────────────────

      - name: "🔒 Validate kubeconfig"
        run: kubectl cluster-info

      # Wire the images this pipeline pushed into the deploy WITHOUT editing
      # the committed k8s/ manifests (CI-side resolution): the manifests pin
      # ghcr.io/bhukkad/<service>:latest as their base reference; kustomize
      # overrides name→sha at render time so the cluster runs the immutable
      # image built from exactly this commit. The checkout edit below is
      # runner-local and never committed.
      - name: "📌 Pin per-service images to pushed sha tags"
        run: |
          set -euo pipefail
          cd k8s
          for svc in identity restaurant order payment delivery notification admin-analytics gateway search survey referral supportticket; do
            kustomize edit set image "ghcr.io/bhukkad/${svc}=ghcr.io/bhukkad/${svc}:${GITHUB_SHA}"
          done
          echo "Pinned 12 service images to commit ${GITHUB_SHA}"

      - name: "🚀 Deploy to production"
        run: |
          set -euo pipefail
          kubectl apply -k k8s/
          kubectl rollout status deployment/bhukkad-gateway -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-restaurant -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-identity -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-order -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-payment -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-delivery -n bhukkad --timeout=600s

      # ─────────────────────────────────────────────────────────────
      # 🏥 PHASE 3 — Health check & smoke test
      # ─────────────────────────────────────────────────────────────

      - name: "🏥 Wait for healthy gateway"
        run: |
          kubectl port-forward -n bhukkad svc/bhukkad-gateway 19090:8080 >/tmp/bhukkad-pf.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          sleep 3
          # Smoke gate (feature #16): bounded retry, hard failure — no `|| true`.
          # Gateway readiness may lag the rollout by a few seconds while pods
          # warm; 5 attempts x 5 s caps the wait before failing the deploy.
          SMOKE_OK=0
          for attempt in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:19090/actuator/health/readiness -o /dev/null; then
              SMOKE_OK=1
              break
            fi
            echo "readiness probe attempt ${attempt}/5 failed; retrying in 5s"
            sleep 5
          done
          kill ${PF_PID} 2>/dev/null || true
          trap - EXIT
          if [ "${SMOKE_OK}" -ne 1 ]; then
            echo "::error::Gateway readiness smoke test failed after 5 attempts"
            exit 1
          fi
