name: Docker Image

on:
  workflow_run:
    workflows: ["Build Artifact"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itsvivekghosh/bukkad-server

      - name: Determine commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building image for SHA: $(grep '^sha=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Set staging image tag in repository variables
        run: |
          SHA="${{ steps.sha.outputs.sha }}"

          # Try to update existing variable with PATCH
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA \
            -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}")

          # If PATCH returns 404 (variable doesn't exist), create it with POST
          if [ "$HTTP_CODE" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/variables \
              -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/itsvivekghosh/bukkad-server:${{ steps.sha.outputs.sha }}
            ghcr.io/itsvivekghosh/bukkad-server:deploy
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/itsvivekghosh/bukkad-server:${{ steps.sha.outputs.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v5
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 14
        if: always()

      - name: Package deployment script
        run: |
          mkdir -p artifact
          cp docker/scripts/docker-deploy.sh artifact/docker-deploy.sh
          chmod +x artifact/docker-deploy.sh
          ls -la artifact/

      - name: Upload deployment script
        uses: actions/upload-artifact@v5
        with:
          name: docker-deploy-script
          path: artifact/docker-deploy.sh
          retention-days: 7
