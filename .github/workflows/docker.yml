name: Docker Image

on:
  workflow_run:
    workflows: ["Build Artifact"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'deploy') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itsvivekghosh/bukkad-server

      - name: Determine commit SHA
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> $GITHUB_OUTPUT

      - name: Set staging image tag in repository variables
        run: |
          HTTP_CODE=$(curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA \
            -d "{\"value\":\"${{ steps.sha.outputs.sha }}\"}" \
            -o /dev/null -w "%{http_code}")
          if [ "$HTTP_CODE" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/variables \
              -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${{ steps.sha.outputs.sha }}\"}"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/itsvivekghosh/bukkad-server:${{ steps.sha.outputs.sha }}
            ghcr.io/itsvivekghosh/bukkad-server:deploy
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/itsvivekghosh/bukkad-server:${{ steps.sha.outputs.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v5
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 14
        if: always()

      - name: Generate deployment script
        run: |
          cat > docker-deploy.sh << 'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          IMAGE_TAG="${IMAGE_TAG:-${{ steps.sha.outputs.sha }}}"
          APP_IMAGE="ghcr.io/itsvivekghosh/bukkad-server:${IMAGE_TAG}"
          CONTAINER_NAME="bhukkad-app"
          CONTAINER_PORT="${SERVER_PORT:-8080}"
          HOST_PORT="${SERVER_PORT:-8080}"

          echo "Stopping existing container..."
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

          echo "Pulling image..."
          docker pull "$APP_IMAGE"

          echo "Starting container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            -e SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-staging}" \
            -e SERVER_PORT="${SERVER_PORT:-8080}" \
            -e DB_HOST="${DB_HOST:-localhost}" \
            -e DB_PORT="${DB_PORT:-3306}" \
            -e DB_NAME="${DB_NAME:-bhukkad}" \
            -e DB_USERNAME="${DB_USERNAME}" \
            -e DB_PASSWORD="${DB_PASSWORD}" \
            -e DB_URL="${DB_URL}" \
            -e REDIS_HOST="${REDIS_HOST:-localhost}" \
            -e REDIS_PORT="${REDIS_PORT:-6379}" \
            -e REDIS_PASSWORD="${REDIS_PASSWORD:-}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            -e JWT_EXPIRATION="${JWT_EXPIRATION:-3600000}" \
            -e JWT_REFRESH_EXPIRATION="${JWT_REFRESH_EXPIRATION:-86400000}" \
            -e RAZORPAY_ENABLED="${RAZORPAY_ENABLED:-false}" \
            -e RAZORPAY_KEY_ID="${RAZORPAY_KEY_ID:-}" \
            -e RAZORPAY_KEY_SECRET="${RAZORPAY_KEY_SECRET:-}" \
            -e RAZORPAY_WEBHOOK_SECRET="${RAZORPAY_WEBHOOK_SECRET:-}" \
            -e NOTIFICATION_EMAIL_ENABLED="${NOTIFICATION_EMAIL_ENABLED:-false}" \
            -e NOTIFICATION_EMAIL_FROM="${NOTIFICATION_EMAIL_FROM:-noreply@bhukkad.com}" \
            -e STOMP_BROKER_TYPE="${STOMP_BROKER_TYPE:-simple}" \
            -e RABBITMQ_HOST="${RABBITMQ_HOST:-localhost}" \
            -e RABBITMQ_STOMP_PORT="${RABBITMQ_STOMP_PORT:-61613}" \
            -e RABBITMQ_USERNAME="${RABBITMQ_USERNAME:-guest}" \
            -e RABBITMQ_PASSWORD="${RABBITMQ_PASSWORD:-guest}" \
            -e LIVE_RELAY_ENABLED="${LIVE_RELAY_ENABLED:-true}" \
            -e LIVE_RELAY_CHANNEL="${LIVE_RELAY_CHANNEL:-bhukkad:live:order-updates}" \
            -e DB_REPLICA_ENABLED="${DB_REPLICA_ENABLED:-true}" \
            -e DB_REPLICA_URL="${DB_REPLICA_URL:-}" \
            -e DB_REPLICA_USERNAME="${DB_REPLICA_USERNAME:-}" \
            -e DB_REPLICA_PASSWORD="${DB_REPLICA_PASSWORD:-}" \
            -e PAYMENT_PROVIDER="${PAYMENT_PROVIDER:-simulated}" \
            -e PROMETHEUS_USERNAME="${PROMETHEUS_USERNAME:-}" \
            -e PROMETHEUS_PASSWORD="${PROMETHEUS_PASSWORD:-}" \
            "${APP_IMAGE}"

          echo "Container started: $CONTAINER_NAME with image: $APP_IMAGE"
          SCRIPT
          chmod +x docker-deploy.sh

      - name: Upload deployment script
        uses: actions/upload-artifact@v5
        with:
          name: docker-deploy-script
          path: docker-deploy.sh
          retention-days: 7
