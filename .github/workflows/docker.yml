name: Docker Image

on:
  push:
    branches: [ main, deploy ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean verify

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          GHCR_IMAGE="${{ vars.GHCR_IMAGE }}"
          GHCR_IMAGE="${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: ${GHCR_IMAGE}:${GITHUB_SHA} and :deploy"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update STAGING_IMAGE_SHA variable
        run: |
          SHA="${{ github.sha }}"
          HTTP_CODE=$(curl -s -o /tmp/var-response.txt -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
            -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}")
          if [ "$HTTP_CODE" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}"
          fi
