name: CI

# Reusable build + test pipeline.
# Called by: pull-request.yml, feature-ci.yml, staging.yml, production.yml.
# A calling job that uses this workflow completes successfully only when every
# job in this workflow succeeds, so deployment jobs can gate on it with `needs:`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B compile -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test -Dtest="*Test,!*IntegrationTest,!*RegressionTest,!*PactTest"

      - name: Run integration tests
        run: ./mvnw -B test -Dtest="*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run regression suite
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14
