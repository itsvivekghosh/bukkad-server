name: CI

# Reusable build + test pipeline.
# Called by: pull-request.yml, feature-ci.yml, staging.yml, production.yml.
# A calling job that uses this workflow completes successfully only when every
# job in this workflow succeeds, so deployment jobs can gate on it with `needs:`.

on:
  workflow_call:
    inputs:
      service:
        description: "Build only this service module (services/ reactor)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B -f services/pom.xml -pl ${{ inputs.service }} -am compile -DskipTests

  # Phase 3: per-service build + test job, driven by the service matrix input.
  service-test:
    name: Service ${{ inputs.service || 'all' }} Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.service != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test service module
        run: ./mvnw -B -f services/pom.xml -pl ${{ inputs.service }} -am test

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: service-${{ inputs.service }}-test-reports
          path: services/${{ inputs.service }}/target/surefire-reports/
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B -f services/pom.xml test -Dtest="*Test,*Tests,!*IntegrationTest,!*RegressionTest,!*PactTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run integration tests
        run: ./mvnw -B -f services/pom.xml test -Dtest="*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run regression suite
        run: ./mvnw -B -f services/pom.xml test -Dtest="com.bhukkad.regression.RegressionTestSuite"

      - name: Verify 85% code coverage (JaCoCo)
        run: ./mvnw -B -f services/pom.xml jacoco:check

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14
