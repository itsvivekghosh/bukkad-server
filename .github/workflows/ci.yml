name: CI

# Reusable build + test pipeline.
# Called by: feature-ci.yml, staging.yml, production.yml.
# A calling job that uses this workflow completes successfully only when every
# job in this workflow succeeds, so deployment jobs can gate on it with `needs:`.
#
# Microservices migration: the root monolith pom.xml and multi-module/ reactor
# are gone — the only buildable code is the services/ reactor
# (services/pom.xml), so every job builds against it.

on:
  workflow_call:
    inputs:
      service:
        description: "Build only this service module from the services reactor. Leave empty for the full reactor."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        # `-pl` with an empty module hard-fails Maven, and the deploy workflows
        # call this reusable workflow WITHOUT a service input — so only add
        # -pl/-am when a single service was requested.
        run: |
          if [ -n "${{ inputs.service }}" ]; then
            ./mvnw -B -f services/pom.xml -pl ${{ inputs.service }} -am compile -DskipTests
          else
            ./mvnw -B -f services/pom.xml compile -DskipTests
          fi

  # Phase 3: per-service build + test job, driven by the service matrix input.
  service-test:
    name: Service ${{ inputs.service || 'all' }} Tests
    runs-on: ubuntu-latest
    if: ${{ inputs.service != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test service module
        run: ./mvnw -B -f services/pom.xml -pl ${{ inputs.service }} -am test

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: service-${{ inputs.service }}-test-reports
          path: services/${{ inputs.service }}/target/surefire-reports/
          retention-days: 14

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B -f services/pom.xml test -Dtest="*Test,*Tests,!*IntegrationTest,!*RegressionTest,!*PactTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run integration tests
        run: ./mvnw -B -f services/pom.xml test -Dtest="*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false

      # NOTE: the historical com.bhukkad.regression.RegressionTestSuite was a
      # monolith artifact deleted in 49c63b4 (restructure to microservices);
      # regression coverage now = unit + integration runs above plus the
      # nightly-regression workflow (pytest API regression against staging).

      # Coverage gate matches the REAL pom thresholds (services/pom.xml:
      # 34% line / 23% branch / 35% method per-module BUNDLE floor — the
      # highest uniform floor the reactor passes, raised from measured
      # coverage as the Part IV ramp proceeds; gaps listed in the pom).
      # `jacoco:check` at the reactor root runs per module and fails the job
      # on the first module below its floor.
      - name: Verify JaCoCo coverage floor (34% line / 23% branch / 35% method)
        run: ./mvnw -B -f services/pom.xml jacoco:check

      - name: Upload JaCoCo HTML reports (per module)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: services/*/target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: services/*/target/surefire-reports/
          retention-days: 14
