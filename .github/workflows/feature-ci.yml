name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: feature-ci-${{ github.event.pull_request != null && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  services-build:
    name: Services Reactor Verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Build + verify services reactor (platform-lib + all services)
        run: ./mvnw -B -f services/pom.xml verify
      - name: Upload services test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: services-test-reports
          path: services/*/target/surefire-reports/
          retention-days: 14

  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      # P2 repair: run against the services reactor (the repo root has no
      # pom.xml). The *ArchTest pattern picks up the platform-lib base rules
      # (CommonArchTest) plus every per-service ArchTest, including the G-4
      # controller transaction-boundary rules.
      - name: Run ArchUnit
        run: ./mvnw -B -f services/pom.xml test -Dtest="*ArchTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact consumer tests (writes pact file)
        run: ./mvnw -B -f services/pom.xml test -Dtest="CuisineApiConsumerPactTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact provider tests (verifies consumer pact)
        run: ./mvnw -B -f services/pom.xml test -Dtest="CuisineApiProviderPactTest" -Dsurefire.failIfNoSpecifiedTests=false

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run Pitest
        run: ./mvnw -B -Pmutation-testing test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload Pitest report
        uses: actions/upload-artifact@v5
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 14

  dependency-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run OWASP Dependency Check
        run: ./mvnw -B -Pdependency-scan org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      # P2 repair: the repo root has NO pom.xml (the monolith was deleted) —
      # compile the services/ reactor so CodeQL has Java binaries to analyze.
      - name: Build services reactor
        run: ./mvnw -B -f services/pom.xml compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # SonarCloud analysis of the services/ reactor (sonar-project.properties
  # maps sonar.modules onto services/<module>). Requires the SONAR_TOKEN
  # secret. The scanner auto-detects the pull request context and decorates
  # the PR with the Quality Gate result.
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # P2 repair: run the reactor build (repo root has no pom.xml). This
      # leaves per-module surefire XML and JaCoCo XML under
      # services/<module>/target/ for the scanner to pick up.
      - name: Run tests with JaCoCo coverage (services reactor)
        run: ./mvnw -B -f services/pom.xml test -Dtest="*Test,*Tests,!*IntegrationTest,!*RegressionTest,!*PactTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report-sonar
          path: services/*/target/site/jacoco/
          retention-days: 14

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        if: always()
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
