name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Docker Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PORT: "8080"

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://${{ vars.STAGING_EC2_HOST }}:8080

    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v5

      - name: Prepare deployment script
        run: |
          mkdir -p ./deploy
          cp docker/scripts/docker-deploy.sh ./deploy/docker-deploy.sh
          chmod +x ./deploy/docker-deploy.sh

      - name: Resolve SSH target
        id: ssh
        run: |
          HOST="${{ secrets.STAGING_SSH_HOST }}"
          HOST="${HOST:-${{ vars.STAGING_EC2_HOST }}}"
          if [ -z "${HOST}" ]; then
            echo "::error::Set STAGING_SSH_HOST secret or STAGING_EC2_HOST repository variable"
            exit 1
          fi
          USER="${{ secrets.STAGING_SSH_USER }}"
          USER="${USER:-ubuntu}"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Verify SSH authentication
        run: bash .github/scripts/ec2-verify-ssh.sh "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" ~/.ssh/id_ed25519 20

      - name: Pre-flight SSH port
        run: bash .github/scripts/ec2-preflight-ssh.sh "${{ steps.ssh.outputs.host }}" 22 15

      - name: Determine image tag
        id: image
        run: |
          TAG="deploy"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
            VAR_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
              | jq -r '.value // empty')
            if [ -n "${VAR_TAG}" ] && [ "${#VAR_TAG}" -ge 40 ]; then
              TAG="${VAR_TAG}"
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Deploy to staging VM
        run: |
          set -euo pipefail

          REDIS_LOCAL="${{ vars.STAGING_REDIS_LOCAL }}"
          REDIS_LOCAL="${REDIS_LOCAL:-true}"
          FLYWAY_REPAIR="${{ vars.FLYWAY_REPAIR_ON_DEPLOY }}"
          FLYWAY_REPAIR="${FLYWAY_REPAIR:-false}"

          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "::error::Missing GHCR_READ_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_DB_HOST }}" ]; then echo "::error::Missing STAGING_DB_HOST"; exit 1; fi
          if [ -z "${{ secrets.STAGING_DB_NAME }}" ]; then echo "::error::Missing STAGING_DB_NAME"; exit 1; fi
          if [ -z "${{ secrets.STAGING_DB_USERNAME }}" ]; then echo "::error::Missing STAGING_DB_USERNAME"; exit 1; fi
          if [ -z "${{ secrets.STAGING_DB_PASSWORD }}" ]; then echo "::error::Missing STAGING_DB_PASSWORD"; exit 1; fi
          if [ -z "${{ secrets.STAGING_JWT_SECRET }}" ]; then echo "::error::Missing STAGING_JWT_SECRET"; exit 1; fi

          if [ "${FLYWAY_REPAIR}" = "true" ]; then
            chmod +x .github/scripts/ec2-flyway-repair.sh
            printf 'DB_HOST=%s\n' "${{ secrets.STAGING_DB_HOST }}" > /tmp/flyway-env.txt
            printf 'DB_PORT=%s\n' "${{ secrets.STAGING_DB_PORT }}" >> /tmp/flyway-env.txt
            printf 'DB_NAME=%s\n' "${{ secrets.STAGING_DB_NAME }}" >> /tmp/flyway-env.txt
            printf 'DB_USERNAME=%s\n' "${{ secrets.STAGING_DB_USERNAME }}" >> /tmp/flyway-env.txt
            printf 'DB_PASSWORD=%s\n' "${{ secrets.STAGING_DB_PASSWORD }}" >> /tmp/flyway-env.txt
            printf 'DB_URL=%s\n' "${{ secrets.STAGING_DB_URL }}" >> /tmp/flyway-env.txt
            bash .github/scripts/ec2-flyway-repair.sh \
              "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
              ~/.ssh/id_ed25519 "${PWD}/src/main/resources/db/migration" /tmp/flyway-env.txt
          fi

          {
            printf 'IMAGE_TAG=%s\n' "${{ steps.image.outputs.tag }}"
            printf 'SPRING_PROFILES_ACTIVE=staging\n'
            printf 'DOCKER_NETWORK=host\n'
            printf 'DB_HOST=%s\n' "${{ secrets.STAGING_DB_HOST }}"
            printf 'DB_PORT=%s\n' "${{ secrets.STAGING_DB_PORT }}"
            printf 'DB_NAME=%s\n' "${{ secrets.STAGING_DB_NAME }}"
            printf 'DB_USERNAME=%s\n' "${{ secrets.STAGING_DB_USERNAME }}"
            printf 'DB_PASSWORD=%s\n' "${{ secrets.STAGING_DB_PASSWORD }}"
            printf 'JWT_SECRET=%s\n' "${{ secrets.STAGING_JWT_SECRET }}"
            printf 'JWT_EXPIRATION=%s\n' "${{ secrets.JWT_EXPIRATION }}"
            printf 'JWT_REFRESH_EXPIRATION=%s\n' "${{ secrets.JWT_REFRESH_EXPIRATION }}"
            printf 'GHCR_USERNAME=itsvivekghosh\n'
            printf 'GHCR_TOKEN=%s\n' "${{ secrets.GHCR_READ_TOKEN }}"
            printf 'REDIS_LOCAL=%s\n' "${REDIS_LOCAL}"
          } > /tmp/deploy-env.txt

          if [ "${REDIS_LOCAL}" = "true" ]; then
            printf 'REDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.STAGING_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
          else
            printf 'REDIS_HOST=%s\n' "${{ secrets.STAGING_REDIS_HOST }}" >> /tmp/deploy-env.txt
            REDIS_PORT="${{ secrets.STAGING_REDIS_PORT }}"
            REDIS_PORT="${REDIS_PORT:-6379}"
            printf 'REDIS_PORT=%s\n' "${REDIS_PORT}" >> /tmp/deploy-env.txt
            printf 'REDIS_PASSWORD=%s\n' "${{ secrets.STAGING_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
            chmod +x .github/scripts/ec2-redis-preflight.sh
            bash .github/scripts/ec2-redis-preflight.sh \
              "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
              ~/.ssh/id_ed25519 /tmp/deploy-env.txt
          fi

          bash .github/scripts/ec2-deploy-remote.sh \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 ./deploy/docker-deploy.sh /tmp/deploy-env.txt

      - name: Wait for healthy app
        run: |
          bash .github/scripts/wait-for-ec2-health.sh \
            "${{ steps.ssh.outputs.user }}" "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 60 5
