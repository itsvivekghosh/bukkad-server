name: Deploy to Staging

on:
  workflow_run:
    workflows: ["Docker Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  STAGING_SSH_HOST_DEFAULT: ec2-13-204-80-247.ap-south-1.compute.amazonaws.com
  APP_PORT: "8080"

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://ec2-13-204-80-247.ap-south-1.compute.amazonaws.com:8080

    if: |
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download deployment script from Docker workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: docker-deploy-script
          path: ./deploy
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare deployment script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mkdir -p ./deploy
            cp docker/scripts/docker-deploy.sh ./deploy/docker-deploy.sh
          fi
          if [ ! -f ./deploy/docker-deploy.sh ]; then
            echo "Deployment script not found at ./deploy/docker-deploy.sh"
            ls -la ./deploy/ 2>/dev/null || echo "(deploy directory missing)"
            exit 1
          fi
          chmod +x ./deploy/docker-deploy.sh
          ls -la ./deploy/docker-deploy.sh

      - name: Resolve SSH target
        id: ssh
        run: |
          HOST="${{ secrets.STAGING_SSH_HOST }}"
          if [ -z "${HOST}" ]; then
            HOST="${{ env.STAGING_SSH_HOST_DEFAULT }}"
          fi
          USER="${{ secrets.STAGING_SSH_USER }}"
          if [ -z "${USER}" ]; then
            USER="ubuntu"
          fi
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          echo "SSH target: ${USER}@${HOST}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ steps.ssh.outputs.host }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pre-flight SSH connectivity
        run: |
          bash .github/scripts/ec2-preflight-ssh.sh "${{ steps.ssh.outputs.host }}" 22 15

      - name: Determine image tag
        id: image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          # Docker Image workflow tags images with the built SHA (STAGING_IMAGE_SHA)
          # and always pushes the floating :deploy tag. Do NOT use workflow_run.head_sha
          # here — it is the Docker workflow commit, not the image tag that was pushed.
          VAR_TAG=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
            | jq -r '.value // empty')
          if [ -n "${VAR_TAG}" ] && [ "${#VAR_TAG}" -ge 40 ]; then
            TAG="${VAR_TAG}"
            echo "Using STAGING_IMAGE_SHA: ${TAG}"
          else
            TAG="deploy"
            echo "STAGING_IMAGE_SHA missing or invalid; using floating deploy tag"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Verify GHCR PAT secret
        run: |
          if [ -z "${{ secrets.GHCR_READ_TOKEN }}" ]; then
            echo "::error::Missing GitHub secret GHCR_READ_TOKEN"
            echo "Create a PAT at https://github.com/settings/tokens with read:packages scope"
            echo "Then add it as repository secret: GHCR_READ_TOKEN"
            exit 1
          fi
          echo "GHCR_READ_TOKEN is configured"

      - name: Login to GHCR on staging VM
        run: |
          GHCR_USER="${{ secrets.GHCR_USERNAME }}"
          if [ -z "${GHCR_USER}" ]; then
            GHCR_USER="itsvivekghosh"
          fi
          bash .github/scripts/ec2-ghcr-login.sh \
            "${{ steps.ssh.outputs.user }}" \
            "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 \
            "${GHCR_USER}" \
            "${{ secrets.GHCR_READ_TOKEN }}"

      - name: Deploy to staging VM
        run: |
          set -euo pipefail
          echo "Deploying image tag: ${{ steps.image.outputs.tag }}"

          printf 'IMAGE_TAG=%s\n' "${{ steps.image.outputs.tag }}" > /tmp/deploy-env.txt
          printf 'SPRING_PROFILES_ACTIVE=%s\n' "staging" >> /tmp/deploy-env.txt
          printf 'DB_HOST=%s\n' "${{ secrets.STAGING_DB_HOST }}" >> /tmp/deploy-env.txt
          printf 'DB_PORT=%s\n' "${{ secrets.STAGING_DB_PORT }}" >> /tmp/deploy-env.txt
          printf 'DB_NAME=%s\n' "${{ secrets.STAGING_DB_NAME }}" >> /tmp/deploy-env.txt
          printf 'DB_USERNAME=%s\n' "${{ secrets.STAGING_DB_USERNAME }}" >> /tmp/deploy-env.txt
          printf 'DB_PASSWORD=%s\n' "${{ secrets.STAGING_DB_PASSWORD }}" >> /tmp/deploy-env.txt
          printf 'DB_URL=%s\n' "${{ secrets.STAGING_DB_URL }}" >> /tmp/deploy-env.txt
          printf 'REDIS_HOST=%s\n' "${{ secrets.STAGING_REDIS_HOST }}" >> /tmp/deploy-env.txt
          printf 'REDIS_PORT=%s\n' "${{ secrets.STAGING_REDIS_PORT }}" >> /tmp/deploy-env.txt
          printf 'REDIS_PASSWORD=%s\n' "${{ secrets.STAGING_REDIS_PASSWORD }}" >> /tmp/deploy-env.txt
          printf 'JWT_SECRET=%s\n' "${{ secrets.STAGING_JWT_SECRET }}" >> /tmp/deploy-env.txt
          printf 'JWT_EXPIRATION=%s\n' "${{ secrets.JWT_EXPIRATION }}" >> /tmp/deploy-env.txt
          printf 'JWT_REFRESH_EXPIRATION=%s\n' "${{ secrets.JWT_REFRESH_EXPIRATION }}" >> /tmp/deploy-env.txt
          printf 'RAZORPAY_ENABLED=%s\n' "${{ secrets.RAZORPAY_ENABLED }}" >> /tmp/deploy-env.txt
          printf 'RAZORPAY_KEY_ID=%s\n' "${{ secrets.RAZORPAY_KEY_ID }}" >> /tmp/deploy-env.txt
          printf 'RAZORPAY_KEY_SECRET=%s\n' "${{ secrets.RAZORPAY_KEY_SECRET }}" >> /tmp/deploy-env.txt
          printf 'RAZORPAY_WEBHOOK_SECRET=%s\n' "${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" >> /tmp/deploy-env.txt
          printf 'NOTIFICATION_EMAIL_ENABLED=%s\n' "${{ secrets.NOTIFICATION_EMAIL_ENABLED }}" >> /tmp/deploy-env.txt
          printf 'NOTIFICATION_EMAIL_FROM=%s\n' "${{ secrets.NOTIFICATION_EMAIL_FROM }}" >> /tmp/deploy-env.txt
          printf 'STOMP_BROKER_TYPE=%s\n' "${{ secrets.STOMP_BROKER_TYPE }}" >> /tmp/deploy-env.txt
          printf 'RABBITMQ_HOST=%s\n' "${{ secrets.RABBITMQ_HOST }}" >> /tmp/deploy-env.txt
          printf 'RABBITMQ_STOMP_PORT=%s\n' "${{ secrets.RABBITMQ_STOMP_PORT }}" >> /tmp/deploy-env.txt
          printf 'RABBITMQ_USERNAME=%s\n' "${{ secrets.RABBITMQ_USERNAME }}" >> /tmp/deploy-env.txt
          printf 'RABBITMQ_PASSWORD=%s\n' "${{ secrets.RABBITMQ_PASSWORD }}" >> /tmp/deploy-env.txt
          printf 'LIVE_RELAY_ENABLED=%s\n' "${{ secrets.LIVE_RELAY_ENABLED }}" >> /tmp/deploy-env.txt
          printf 'LIVE_RELAY_CHANNEL=%s\n' "${{ secrets.LIVE_RELAY_CHANNEL }}" >> /tmp/deploy-env.txt
          printf 'DB_REPLICA_ENABLED=%s\n' "${{ secrets.DB_REPLICA_ENABLED }}" >> /tmp/deploy-env.txt
          printf 'DB_REPLICA_URL=%s\n' "${{ secrets.DB_REPLICA_URL }}" >> /tmp/deploy-env.txt
          printf 'DB_REPLICA_USERNAME=%s\n' "${{ secrets.STAGING_DB_REPLICA_USERNAME }}" >> /tmp/deploy-env.txt
          printf 'DB_REPLICA_PASSWORD=%s\n' "${{ secrets.STAGING_DB_REPLICA_PASSWORD }}" >> /tmp/deploy-env.txt
          printf 'PAYMENT_PROVIDER=%s\n' "${{ secrets.PAYMENT_PROVIDER }}" >> /tmp/deploy-env.txt
          printf 'PROMETHEUS_USERNAME=%s\n' "${{ secrets.PROMETHEUS_USERNAME }}" >> /tmp/deploy-env.txt
          printf 'PROMETHEUS_PASSWORD=%s\n' "${{ secrets.PROMETHEUS_PASSWORD }}" >> /tmp/deploy-env.txt
          printf 'GHCR_USERNAME=%s\n' "itsvivekghosh" >> /tmp/deploy-env.txt
          printf 'GHCR_TOKEN=%s\n' "${{ secrets.GHCR_READ_TOKEN }}" >> /tmp/deploy-env.txt

          bash .github/scripts/ec2-deploy-remote.sh \
            "${{ steps.ssh.outputs.user }}" \
            "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 \
            ./deploy/docker-deploy.sh \
            /tmp/deploy-env.txt

      - name: Wait for container to start
        run: |
          bash .github/scripts/wait-for-ec2-health.sh \
            "${{ steps.ssh.outputs.user }}" \
            "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 \
            60 5

      - name: Run smoke tests
        run: |
          bash .github/scripts/ec2-smoke-test.sh \
            "${{ steps.ssh.outputs.user }}" \
            "${{ steps.ssh.outputs.host }}" \
            ~/.ssh/id_ed25519 \
            /api/v1/health/ping \
            "${{ env.APP_PORT }}"
