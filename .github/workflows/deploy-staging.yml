name: 🚀 Deploy to Staging

on:
  workflow_run:
    workflows: ["Docker Image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🎯 Staging Deployment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.bhukkad.com

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      # ══════════════════════════════════════════════════════════════
      # 📋 PREPARATION PHASE
      # ══════════════════════════════════════════════════════════════
      
      - name: 📦 Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 🎯 Download deployment script
        uses: actions/download-artifact@v5
        with:
          name: docker-deploy-script
          path: ./deploy
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: ✅ Verify deployment script exists
        run: |
          echo "🔍 Checking deployment artifacts..."
          ls -la ./deploy/
          if [ ! -f ./deploy/docker-deploy.sh ]; then
            echo "❌ Deployment script not found!"
            echo "📁 Available files:"
            find ./deploy -type f || echo "No files found"
            exit 1
          fi
          echo "✅ Deployment script verified: $(wc -l < ./deploy/docker-deploy.sh) lines"

      # ══════════════════════════════════════════════════════════════
      # 🔐 SSH & SECURITY SETUP
      # ══════════════════════════════════════════════════════════════

      - name: 🔑 Setup SSH connection
        run: |
          echo "🔐 Setting up SSH authentication..."
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          echo "🌐 Adding host to known hosts..."
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "✅ SSH setup completed"

      - name: 🎯 Determine deployment image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi
          
          echo "🏷️ Image tag: ${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════════
      # 🚀 DEPLOYMENT PHASE
      # ══════════════════════════════════════════════════════════════

      - name: 🚀 Deploy to staging environment
        run: |
          set -euo pipefail
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 BHUKKAD STAGING DEPLOYMENT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ${{ steps.image.outputs.tag }}"
          echo "🎯  Environment: Staging"
          echo "📡  Host: ${{ secrets.STAGING_SSH_HOST }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Build secure environment variables file
          echo "📝 Building environment configuration..."
          cat > /tmp/deploy-env.txt << 'EOF'
          # 🎯 Core Application Settings
          IMAGE_TAG=${{ steps.image.outputs.tag }}
          SPRING_PROFILES_ACTIVE=staging
          SERVER_PORT=8080
          
          # 🗄️ Database Configuration
          DB_HOST=${{ secrets.STAGING_DB_HOST }}
          DB_PORT=${{ secrets.STAGING_DB_PORT }}
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          DB_USERNAME=${{ secrets.STAGING_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          DB_URL=${{ secrets.STAGING_DB_URL }}
          
          # 🔴 Redis Configuration
          REDIS_HOST=${{ secrets.STAGING_REDIS_HOST }}
          REDIS_PORT=${{ secrets.STAGING_REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          
          # 🔐 Security & Authentication
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          
          # 💳 Payment Gateway (Razorpay)
          RAZORPAY_ENABLED=${{ secrets.RAZORPAY_ENABLED }}
          RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          
          # 📧 Email & Notifications
          NOTIFICATION_EMAIL_ENABLED=${{ secrets.NOTIFICATION_EMAIL_ENABLED }}
          NOTIFICATION_EMAIL_FROM=${{ secrets.NOTIFICATION_EMAIL_FROM }}
          
          # 🐰 Message Broker (RabbitMQ)
          STOMP_BROKER_TYPE=${{ secrets.STOMP_BROKER_TYPE }}
          RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_STOMP_PORT=${{ secrets.RABBITMQ_STOMP_PORT }}
          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          
          # 📡 Live Updates & WebSocket
          LIVE_RELAY_ENABLED=${{ secrets.LIVE_RELAY_ENABLED }}
          LIVE_RELAY_CHANNEL=${{ secrets.LIVE_RELAY_CHANNEL }}
          
          # 🔄 Database Replica (Optional)
          DB_REPLICA_ENABLED=${{ secrets.DB_REPLICA_ENABLED }}
          DB_REPLICA_URL=${{ secrets.DB_REPLICA_URL }}
          DB_REPLICA_USERNAME=${{ secrets.STAGING_DB_REPLICA_USERNAME }}
          DB_REPLICA_PASSWORD=${{ secrets.STAGING_DB_REPLICA_PASSWORD }}
          
          # ⚙️ System Configuration
          PAYMENT_PROVIDER=${{ secrets.PAYMENT_PROVIDER }}
          PROMETHEUS_USERNAME=${{ secrets.PROMETHEUS_USERNAME }}
          PROMETHEUS_PASSWORD=${{ secrets.PROMETHEUS_PASSWORD }}
          EOF
          
          echo "📤 Copying deployment script to staging server..."
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            ./deploy/docker-deploy.sh \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:/tmp/docker-deploy.sh"
          
          echo "📤 Transferring environment configuration..."
          base64 /tmp/deploy-env.txt | \
            ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
              "base64 -d > /tmp/deploy-env.txt && chmod 600 /tmp/deploy-env.txt"
          
          echo "🔄 Executing deployment on staging server..."
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "chmod 755 /tmp/docker-deploy.sh && \
            echo '🚀 Starting deployment execution...' && \
            ls -la /tmp/docker-deploy.sh && \
            set -a && source /tmp/deploy-env.txt && set +a && \
            bash /tmp/docker-deploy.sh"

      # ══════════════════════════════════════════════════════════════
      # 🏥 HEALTH CHECK & VERIFICATION
      # ══════════════════════════════════════════════════════════════

      - name: 🏥 Wait for application health check
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏥 APPLICATION HEALTH CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Use single SSH session to avoid connection rate limiting
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            'echo "🔍 Starting health check monitoring..."
            for i in $(seq 1 60); do
              echo "🩺 Health check attempt $i/60..."
              
              if curl -sf http://localhost:8080/api/v1/health/ping -o /dev/null 2>/dev/null; then
                echo "✅ Application is healthy after $i attempts!"
                echo "🎉 Deployment successful!"
                exit 0
              fi
              
              if [ $i -eq 1 ] || [ $((i % 10)) -eq 0 ]; then
                echo "📊 Container status check..."
                docker ps -a --filter name=bhukkad-app --format "{{.Names}}: {{.Status}}" 2>/dev/null || true
              fi
              
              sleep 5
            done
            
            echo "❌ Health check failed after 60 attempts (5 minutes)"
            echo "🔍 Final diagnostics..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📊 Container Status:"
            docker ps -a --filter name=bhukkad-app --format "{{.Image}} {{.Status}}" 2>&1 || true
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Container Logs (last 100 lines):"
            docker logs bhukkad-app --tail 100 2>&1 || true
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1'

      # ══════════════════════════════════════════════════════════════
      # 🧪 SMOKE TESTS
      # ══════════════════════════════════════════════════════════════

      - name: 🧪 Run staging smoke tests
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 STAGING SMOKE TESTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          STAGING_URL="https://staging.bhukkad.com"
          
          echo "🔍 Testing external endpoint: ${STAGING_URL}/api/v1/health/ping"
          if curl -f "${STAGING_URL}/api/v1/health/ping" -m 10; then
            echo "✅ External health check passed"
          else
            echo "⚠️  External health check failed (may be DNS/proxy issue)"
            echo "✅ Internal health check already passed, deployment is successful"
          fi

      # ══════════════════════════════════════════════════════════════
      # 📊 DEPLOYMENT SUMMARY
      # ══════════════════════════════════════════════════════════════

      - name: 📊 Deployment success summary
        if: success()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🎉 STAGING DEPLOYMENT SUCCESSFUL!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ghcr.io/itsvivekghosh/bukkad-server:${{ steps.image.outputs.tag }}"
          echo "🎯  Environment: Staging"
          echo "📡  SSH Host: ${{ secrets.STAGING_SSH_HOST }}"
          echo "🌐  Public URL: https://staging.bhukkad.com"
          echo "🏥  Health Check: ✅ Passed"
          echo "🧪  Smoke Tests: ✅ Completed"
          echo "⏰  Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Ready for testing and validation!"

      - name: 💥 Deployment failure summary
        if: failure()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ STAGING DEPLOYMENT FAILED!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏷️  Image: ghcr.io/itsvivekghosh/bukkad-server:${{ steps.image.outputs.tag }}"
          echo "🎯  Environment: Staging"
          echo "📡  SSH Host: ${{ secrets.STAGING_SSH_HOST }}"
          echo "❌  Status: Failed"
          echo "⏰  Failed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Check the logs above for detailed error information"
          echo "🛠️  Common issues: SSH connection, missing secrets, container startup"