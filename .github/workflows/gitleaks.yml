name: Secret Scanning (gitleaks)

# P0 hardening: detect committed secrets on every PR and on pushes to the
# long-lived branches. Uses the default gitleaks rule set; add a .gitleaks.toml
# at the repo root to tune allowlists (e.g. postman fixtures) if false
# positives appear.
#
# Note: gitleaks-action scans the full commit history on push events, hence
# fetch-depth: 0 below. Feature branches are covered via their PRs.

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
