name: Services CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'k8s/**'
      - 'scripts/ci/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'k8s/**'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  pool-budget:
    name: Connection pool budget guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Enforce §4.2 pool arithmetic (hpa x pool <= 0.8 x pgbouncer)
        run: python3 scripts/ci/pool-budget-check.py

  build-service:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, restaurant, order, payment, delivery, notification, admin-analytics, gateway, search, survey, referral, supportticket]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test service module
        run: ./mvnw -B -f services/pom.xml -pl ${{ matrix.service }} -am verify

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: service-${{ matrix.service }}-test-reports
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 14

      - name: Build Docker image
        if: github.event_name == 'push'
        run: >
          docker build
          --build-arg SERVICE=${{ matrix.service }}
          -f services/${{ matrix.service }}/Dockerfile
          -t ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          services/

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}

      - name: Deploy to Kubernetes
        if: github.event_name == 'push'
        run: |
          kubectl set image deployment/bhukkad-${{ matrix.service }} bhukkad-${{ matrix.service }}=ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }} -n bhukkad
          kubectl rollout status deployment/bhukkad-${{ matrix.service }} -n bhukkad --timeout=300s
