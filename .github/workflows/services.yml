name: Services CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'k8s/**'
      - 'scripts/ci/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'k8s/**'
      - 'scripts/ci/**'

permissions:
  contents: read

jobs:
  pool-budget:
    name: Connection pool budget guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Enforce §4.2 pool arithmetic (hpa x pool <= 0.8 x pgbouncer)
        run: python3 scripts/ci/pool-budget-check.py

  http-client-guard:
    name: G-13 HTTP client guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce G-13 (no hand-built WebClient/RestTemplate outside platform factory)
        run: python3 scripts/ci/check-http-clients.py

  full-scan-guard:
    name: G-6 unbounded scan guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce G-6 (every .findAll()/findAllBy*() call-site carries @AllowFullScan(reason))
        run: python3 scripts/ci/full-scan-guard.py

  kustomize-gate:
    name: Kustomize build gate (G-12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install kustomize
        uses: azure/setup-kustomize@v4

      # Fail the gate on any kustomize error (missing file, bad patch, cycle).
      # The minikube overlay reaches ../../ base files by design (see its
      # header), so it builds with the relaxed loader; the base and the
      # custom-metrics-hpa add-on build with default restrictions.
      - name: Build base kustomization
        run: kustomize build k8s > /tmp/k8s-base-rendered.yaml

      - name: Build custom-metrics-hpa overlay
        run: kustomize build k8s/overlays/custom-metrics-hpa > /tmp/k8s-hpa-rendered.yaml

      - name: Build minikube overlay
        run: kustomize build --load-restrictor LoadRestrictionsNone k8s/overlays/minikube > /tmp/k8s-minikube-rendered.yaml

  build-service:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [pool-budget, http-client-guard, full-scan-guard, kustomize-gate]
    strategy:
      matrix:
        service: [identity, restaurant, order, payment, delivery, notification, admin-analytics, gateway, search, survey, referral, supportticket]
    env:
      # Scan/sign/deploy knobs (feature #16): severities that fail the build,
      # and whether deploys consume the pushed digest instead of the sha tag.
      # Digest pinning is the DEFAULT (P2): staging/production kustomize-renders
      # ghcr.io/bhukkad/<svc>@sha256:<digest> so the cluster can only run the
      # exact bits CI built, scanned and signed. Flip the repo variable
      # DEPLOY_BY_DIGEST to 'false' only for incident rollback drillwork.
      # The committed k8s/ manifests keep ghcr.io/bhukkad/<svc>:latest as the
      # DEV/MINIKUBE fallback only — :latest must never reach staging or prod.
      TRIVY_SEVERITY: HIGH,CRITICAL
      DEPLOY_BY_DIGEST: 'true'
    # NOTE: with a matrix, job outputs are last-writer-wins across the 12
    # services. They are a convenience for single-service reuse (workflow_call
    # / workflow_dispatch consumers); the multi-service deploy workflows
    # (staging.yml / production.yml) capture one digest per matrix leg
    # themselves via the build-push-action digest output.
    outputs:
      digest: ${{ steps.capture-digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test service module
        run: ./mvnw -B -f services/pom.xml -pl ${{ matrix.service }} -am verify

      - name: Upload service test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: service-${{ matrix.service }}-test-reports
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 14

      - name: Build Docker image
        if: github.event_name == 'push'
        # Canonical image path (audit G-13 / R-02): services/docker/Dockerfile.service
        # is the ONLY service image recipe — the per-service Dockerfiles were
        # deleted. Build from the reactor root services/ (context must contain
        # pom.xml, platform-lib/ and the module sources) and select the module
        # via the Dockerfile's MODULE build-arg.
        run: >
          docker build
          --build-arg MODULE=${{ matrix.service }}
          -f services/docker/Dockerfile.service
          -t ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          services/

      - name: Trivy image scan (fail on HIGH/CRITICAL)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: ${{ env.TRIVY_SEVERITY }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}

      - name: Capture pushed image digest
        id: capture-digest
        if: github.event_name == 'push'
        # The pushed digest (what cosign signs below) is the ONLY deployable
        # reference: job output for reuse, GITHUB_ENV for the dev-cluster
        # deploy step at the bottom of this job.
        run: |
          DIGEST=$(docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }})
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${DIGEST}"

      - name: Syft SBOM (SPDX JSON)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      # Signing is gated on the COSIGN_KEY secret: without it (local forks,
      # PRs) the job passes without signing instead of failing.
      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (key-gated)
        if: github.event_name == 'push'
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "${COSIGN_KEY}" ]; then
            echo "COSIGN_KEY not set — skipping image signing (expected on forks/PRs)"
            exit 0
          fi
          cosign sign --yes --key env://COSIGN_KEY "${IMAGE_DIGEST}"

      - name: Deploy to Kubernetes
        if: github.event_name == 'push'
        run: |
          REF="ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}"
          if [ "${DEPLOY_BY_DIGEST}" = "true" ] && [ -n "${IMAGE_DIGEST}" ]; then
            REF="${IMAGE_DIGEST}"
          fi
          echo "Deploying ${REF}"
          kubectl set image deployment/bhukkad-${{ matrix.service }} bhukkad-${{ matrix.service }}="${REF}" -n bhukkad
          kubectl rollout status deployment/bhukkad-${{ matrix.service }} -n bhukkad --timeout=300s
