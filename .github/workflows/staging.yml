name: Staging Deploy

on:
  push:
    branches: [ deploy ]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push ${{ matrix.service }} Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      tag: ${{ steps.meta.outputs.sha }}
    strategy:
      fail-fast: false
      matrix:
        # Must match the service deployments in k8s/ and the services.yml matrix.
        service: [identity, restaurant, order, payment, delivery, notification, admin-analytics, gateway, search, survey, referral, supportticket]
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The monolith docker/Dockerfile is retired (deleted with the monolith);
      # staging deploys the k8s/ microservice manifests, so build exactly the
      # per-service images those manifests reference, via the canonical recipe
      # services/docker/Dockerfile.service (MODULE build-arg, context = reactor
      # root services/). Pushed under the immutable commit-sha tag; the deploy
      # job pins these tags into the kustomize render below.
      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/docker/Dockerfile.service
          push: true
          build-args: |
            MODULE=${{ matrix.service }}
          tags: ghcr.io/bhukkad/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Update STAGING_IMAGE_SHA variable
        if: github.ref == 'refs/heads/deploy'
        run: |
          SHA="${{ github.sha }}"
          HTTP_CODE=$(curl -s -o /tmp/var-response.txt -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STAGING_IMAGE_SHA" \
            -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}")
          if [ "$HTTP_CODE" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"STAGING_IMAGE_SHA\",\"value\":\"${SHA}\"}"
          fi

  deploy:
    name: "🎯 Staging Deployment"
    runs-on: ubuntu-latest
    needs: [ci, build-and-push]
    environment:
      name: staging
      url: http://${{ vars.STAGING_EC2_HOST }}:8080

    env:
      APP_PORT: ${{ vars.APP_PORT }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # 🧹 PHASE 0 — Disk Space Optimization (CRITICAL for GitHub runners)
      # ─────────────────────────────────────────────────────────────
      - name: "🧹 Disk Space Optimization"
        run: |
          set -euo pipefail
          log() { echo "🔧 $*"; }
          log "🔍 Checking disk usage before cleanup..."
          df -h /
          LOG_SIZE=$(df -h / | awk 'NR==2 {print $5}' | tr -d '%' || echo "0")
          if [ "${LOG_SIZE}" -gt 80 ]; then
            log "⚠️ Disk usage above 80%, proceeding with aggressive cleanup"
          else
            log "✅ Disk usage at ${LOG_SIZE}%, proceeding with standard cleanup"
          fi

          # Remove unused packages and caches that GitHub runners accumulate
          apt-get purge -y --auto-remove openjdk-21* 2>/dev/null || true
          apt-get clean 2>/dev/null || true
          rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          rm -rf /tmp/* 2>/dev/null || true
          rm -rf /var/tmp/* 2>/dev/null || true

          # Remove large default GitHub runner directories that are rarely used
          rm -rf /usr/share/dotnet 2>/dev/null || true
          rm -rf /usr/local/lib/android 2>/dev/null || true
          rm -rf /opt/ghc 2>/dev/null || true
          rm -rf /snap/*/core 2>/dev/null || true

          # Docker-specific cleanup
          docker image prune -f 2>/dev/null || true
          docker system prune -f 2>/dev/null || true

          # Clean Maven local repository cache partially
          rm -rf /root/.m2/repository/*-sources 2>/dev/null || true
          rm -rf /root/.m2/repository/*-javadoc 2>/dev/null || true

          df -h /
          LOG_SIZE_NEW=$(df -h / | awk 'NR==2 {print $5}' | tr -d '%' || echo "0")
          log "📉 Disk usage reduced from ${LOG_SIZE}% to ${LOG_SIZE_NEW}%"

      # ─────────────────────────────────────────────────────────────
      # 📋 PHASE 1 — Checkout & configuration
      # ─────────────────────────────────────────────────────────────
      - name: "📦 Checkout repository"
        uses: actions/checkout@v5

      - name: "⚙️ Set deployment defaults"
        run: |
          {
            echo "APP_PORT=${APP_PORT:-8080}"
            echo "HEALTH_PATH=${HEALTH_PATH:-/api/v1/health/ping}"
            echo "GHCR_IMAGE=${GHCR_IMAGE:-ghcr.io/itsvivekghosh/bukkad-server}"
            echo "GHCR_USERNAME=${GHCR_USERNAME:-itsvivekghosh}"
          } >> "$GITHUB_ENV"

      - name: "📊 Deployment overview"
        run: |
          source .github/scripts/deploy-log.sh
          deploy_pipeline_diagram "Staging"
          deploy_banner "Staging 🧪" "${{ github.sha }}" "${{ needs.build-and-push.outputs.tag }}" "${{ vars.STAGING_EC2_HOST }}"
          log_section "🔧 Configuration check"
          check_optional_var "STAGING_EC2_HOST" "${{ vars.STAGING_EC2_HOST }}" "(required)"
          check_optional_var "GHCR_IMAGE" "${GHCR_IMAGE}" "ghcr.io/itsvivekghosh/bukkad-server"
          check_optional_var "APP_PORT" "${APP_PORT}" "8080"
          log_section_end

      - name: "📜 Prepare deployment script"
        run: |
          echo "✅ Deployment uses k8s/ manifests via kubectl"

      # ─────────────────────────────────────────────────────────────
      # 🔐 PHASE 2 — Kubernetes deployment
      # ─────────────────────────────────────────────────────────────

      - name: "🔒 Validate kubeconfig"
        run: kubectl cluster-info

      # Wire the images this pipeline pushed into the deploy WITHOUT editing
      # the committed k8s/ manifests (CI-side resolution): the manifests pin
      # ghcr.io/bhukkad/<service>:latest as their base reference; kustomize
      # overrides name→sha at render time so the cluster runs the immutable
      # image built from exactly this commit. The checkout edit below is
      # runner-local and never committed.
      - name: "📌 Pin per-service images to pushed sha tags"
        run: |
          set -euo pipefail
          cd k8s
          for svc in identity restaurant order payment delivery notification admin-analytics gateway search survey referral supportticket; do
            kustomize edit set image "ghcr.io/bhukkad/${svc}=ghcr.io/bhukkad/${svc}:${GITHUB_SHA}"
          done
          echo "Pinned 12 service images to commit ${GITHUB_SHA}"

      - name: "🚀 Deploy to staging"
        run: |
          set -euo pipefail
          kubectl apply -k k8s/
          kubectl rollout status deployment/bhukkad-gateway -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-restaurant -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-identity -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-order -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-payment -n bhukkad --timeout=600s
          kubectl rollout status deployment/bhukkad-delivery -n bhukkad --timeout=600s

      # ─────────────────────────────────────────────────────────────
      # 🏥 PHASE 3 — Health check & smoke test
      # ─────────────────────────────────────────────────────────────

      - name: "🏥 Wait for healthy gateway"
        run: |
          kubectl port-forward -n bhukkad svc/bhukkad-gateway 19090:8080 >/tmp/bhukkad-pf.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          sleep 3
          # Smoke gate (feature #16): bounded retry, hard failure — no `|| true`.
          SMOKE_OK=0
          for attempt in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:19090/actuator/health/readiness -o /dev/null; then
              SMOKE_OK=1
              break
            fi
            echo "readiness probe attempt ${attempt}/5 failed; retrying in 5s"
            sleep 5
          done
          kill ${PF_PID} 2>/dev/null || true
          trap - EXIT
          if [ "${SMOKE_OK}" -ne 1 ]; then
            echo "::error::Gateway readiness smoke test failed after 5 attempts"
            exit 1
          fi
