name: Pull Request CI

on:
  pull_request:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  ci:
    name: Build & Test
    uses: ./.github/workflows/ci.yml

  regression:
    name: Regression Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run regression suite
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run ArchUnit
        run: ./mvnw -B test -Dtest="ArchitectureTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact consumer tests (writes pact file)
        run: ./mvnw -B test -Dtest="CuisineApiConsumerPactTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact provider tests (verifies consumer pact)
        run: ./mvnw -B test -Dtest="CuisineApiProviderPactTest" -Dsurefire.failIfNoSpecifiedTests=false

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run Pitest
        run: ./mvnw -B -Pmutation-testing test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload Pitest report
        uses: actions/upload-artifact@v5
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 14

  dependency-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run OWASP Dependency Check
        run: ./mvnw -B -Pdependency-scan org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build
        run: ./mvnw -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
