name: Pull Request CI

on:
  pull_request:
    branches: [ deploy ]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  compile-and-test:
    name: Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B compile -DskipTests

      - name: Run unit tests
        run: ./mvnw -B test -Dtest="*Test,!*IntegrationTest,!*RegressionTest"

      - name: Run integration tests
        run: ./mvnw -B test -Dtest="*IntegrationTest"

      - name: Run regression tests
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report-pr
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-pr
          path: target/surefire-reports/
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build
        run: ./mvnw -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
