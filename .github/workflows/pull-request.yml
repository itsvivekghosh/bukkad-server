name: Pull Request CI

on:
  pull_request:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile
        run: ./mvnw -B compile -DskipTests

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test -Dtest="*Test,*Tests,!*IntegrationTest,!*RegressionTest,!*PactTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run integration tests
        run: ./mvnw -B test -Dtest="*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run regression suite
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

      - name: Verify 85% code coverage (JaCoCo)
        run: ./mvnw -B jacoco:check

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test reports
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14

  regression:
    name: Regression Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run regression suite
        run: ./mvnw -B test -Dtest="com.bhukkad.regression.RegressionTestSuite"

  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run ArchUnit
        run: ./mvnw -B test -Dtest="ArchitectureTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact consumer tests (writes pact file)
        run: ./mvnw -B test -Dtest="CuisineApiConsumerPactTest" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run Pact provider tests (verifies consumer pact)
        run: ./mvnw -B test -Dtest="CuisineApiProviderPactTest" -Dsurefire.failIfNoSpecifiedTests=false

  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run Pitest
        run: ./mvnw -B -Pmutation-testing test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Upload Pitest report
        uses: actions/upload-artifact@v5
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 14

  dependency-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Run OWASP Dependency Check
        run: ./mvnw -B -Pdependency-scan org.owasp:dependency-check-maven:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - name: Upload OWASP report
        uses: actions/upload-artifact@v5
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      - name: Build
        run: ./mvnw -B compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # SonarCloud analysis (sonar-project.properties). Requires the SONAR_TOKEN
  # secret (Settings → Secrets → Actions). The scanner auto-detects the pull
  # request context and decorates the PR with the Quality Gate result. The job
  # is skipped entirely when the secret is not configured (e.g. forks) so CI
  # stays green instead of failing on a missing token.
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history so Sonar can attribute new code against the target branch
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests with JaCoCo coverage
        run: ./mvnw -B test -Dtest="*Test,*Tests,!*IntegrationTest,!*RegressionTest,!*PactTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report-sonar
          path: target/site/jacoco/
          retention-days: 14

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        if: always()
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
