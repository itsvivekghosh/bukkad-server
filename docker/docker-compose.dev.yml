services:

  postgres:
    image: postgres:16-alpine
    container_name: bhukkad-postgres-dev
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: bhukkad
      POSTGRES_USER: bhukkad
      POSTGRES_PASSWORD: bhukkad_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhukkad -d bhukkad"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis-dev
    restart: unless-stopped
    init: true
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    command: ["redis-server", "/etc/redis/redis.conf"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.2
    container_name: bhukkad-redpanda-dev
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bhukkad-app-dev
    restart: on-failure
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: dev
      WAIT_FOR_SERVICES: "false"
      HEALTH_PATH: /api/v1/health/ping
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bhukkad
      DB_USERNAME: bhukkad
      DB_PASSWORD: bhukkad_pass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      APP_EVENTS_EXTERNAL_ENABLED: "true"
      APP_EVENTS_EXTERNAL_TYPE: kafka
      SERVER_PORT: "8080"
      JWT_SECRET: "SYWYJMIn1nll7QKTf7jHdW+93p7xJ1RfXGtK35mgeV8w9I5oFshm9OhEJJoLn2T0ZpYPlY8auXHyxjLbofSIOA"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+UseStringDeduplication"
    ports:
      - "8080:8080"
    volumes:
      - app_logs_dev:/tmp/logs/bhukkad
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis-commander:
    profiles: ["tools"]
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: bhukkad-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bhukkad-network

  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    container_name: bhukkad-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bhukkad.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bhukkad-network

volumes:
  postgres_data_dev:
    name: bhukkad_postgres_dev
  redis_data_dev:
    name: bhukkad_redis_dev
  app_logs_dev:
    name: bhukkad_logs_dev

networks:
  bhukkad-network:
    name: bhukkad_network
    driver: bridge
