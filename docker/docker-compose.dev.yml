services:

  mysql:
    image: mysql:8.0
    container_name: bhukkad-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bhukkad
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: bhukkad_user
      MYSQL_PASSWORD: bhukkad_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=root", "--connect-timeout=10"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bhukkad-app-dev
    restart: on-failure
    environment:
      # These override the defaults in application-dev.yml
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: bhukkad
      DB_USERNAME: bhukkad_user
      DB_PASSWORD: bhukkad_pass
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+UseContainerSupport"
    ports:
      - "8080:8080"
    volumes:
      - app_logs_dev:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bhukkad-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: bhukkad-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bhukkad-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bhukkad-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bhukkad-network

volumes:
  mysql_data_dev:
    name: bhukkad_mysql_dev
  redis_data_dev:
    name: bhukkad_redis_dev
  app_logs_dev:
    name: bhukkad_logs_dev

networks:
  bhukkad-network:
    name: bhukkad_network
    driver: bridge