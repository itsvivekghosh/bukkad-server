# ============================================
# Redis Configuration - PROD
# ============================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300
protected-mode yes

# General
daemonize no
supervised no
loglevel notice
logfile ""
databases 16

# Password set via command line --requirepass

# Persistence - AOF
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes

# Persistence - RDB
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10
active-expire-enabled yes

# Performance
hz 15
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 256

# Latency Monitor
latency-monitor-threshold 100
latency-tracking yes