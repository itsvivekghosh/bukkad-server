# ============================================
# Bhukkad API Server Configuration
# ============================================
# HTTP/2 + TLS front door. Certificates are mounted from docker/nginx/ssl
# (generate with docker/scripts/generate-ssl-certs.sh, or mount real ones from
# a secret in production). The HTTP listener below remains for health checks /
# internal traffic and redirects everything else to HTTPS.
server {
    listen 443 ssl http2;
    server_name api.bhukkad.com localhost;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Connection limit
    limit_conn conn_per_ip 50;

    # ==================== Auth Endpoints ====================
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== Order Endpoints ====================
    location /api/orders/ {
        limit_req zone=api_order burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== SSE Live Streams ====================
    location ~ ^/api/v1/orders/stream/ {
        limit_req zone=api_order burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    # ==================== WebSocket Handshake ====================
    location /ws/ {
        limit_req zone=api_order burst=20 nodelay;
        limit_req_status 429;
        limit_conn conn_per_ip 20;
        proxy_pass http://bhukkad_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================== Health Endpoints ====================
    location /api/v1/health {
        access_log off;
        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== General API Endpoints ====================
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ==================== Block Swagger in Prod ====================
    location /swagger-ui {
        return 404 '{"success":false,"message":"Not Found"}';
        add_header Content-Type application/json;
    }

    location /v3/api-docs {
        return 404 '{"success":false,"message":"Not Found"}';
        add_header Content-Type application/json;
    }

    # ==================== Default ====================
    location / {
        return 200 '{"status":"UP","service":"Bhukkad API","version":"1.0.0"}';
        add_header Content-Type application/json;
    }

    # ==================== Error Pages ====================
    error_page 404 = @not_found;
    error_page 429 = @rate_limited;
    error_page 500 502 503 504 = @server_error;

    location @not_found {
        return 404 '{"success":false,"message":"Endpoint not found"}';
        add_header Content-Type application/json;
    }

    location @rate_limited {
        return 429 '{"success":false,"message":"Too many requests. Please slow down."}';
        add_header Content-Type application/json;
        add_header Retry-After 60;
    }

    location @server_error {
        return 500 '{"success":false,"message":"Internal server error"}';
        add_header Content-Type application/json;
    }
}

# HTTP listener — health checks and internal traffic; redirect everything else
# to HTTPS so API clients are always on TLS.
server {
    listen 80;
    server_name api.bhukkad.com localhost;

    # Health endpoint stays on HTTP for load balancer probes (no TLS needed).
    location /api/v1/health {
        access_log off;
        proxy_pass http://bhukkad_app;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
