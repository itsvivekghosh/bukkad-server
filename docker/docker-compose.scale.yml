# =============================================================================
# Docker Compose scale overlay: runs N app replicas behind nginx.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.scale.yml up -d --build
#
# Add --scale app=n before the compose file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.scale.yml up -d --scale app=3
# =============================================================================
version: "3.8"
services:
  app:
    # When scaling, copies of the app service share the same image, env, and
    # network; each copy is an independent JVM with its own HikariCP pool.
    ports: []                         # upstream nginx proxies to the internal
    expose: ["8080"]                  # port; no host port conflict.
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ping"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  nginx:
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy