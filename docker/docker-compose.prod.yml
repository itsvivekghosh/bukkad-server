services:
  mysql:
    image: mysql:8.0
    container_name: bhukkad-mysql-prod
    restart: always
    init: true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./mysql/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/99-bhukkad.cnf:ro
    networks:
      - bhukkad-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}", "--connect-timeout=5"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis-prod
    restart: always
    init: true
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
      - ./redis/redis-prod.conf:/etc/redis/redis.conf:ro
    networks:
      - bhukkad-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bhukkad-app-prod
    restart: always
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WAIT_FOR_SERVICES: "false"
      HEALTH_PATH: /api/v1/health/ping
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200"
    expose:
      - "8080"
    volumes:
      - app_logs_prod:/tmp/logs/bhukkad
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bhukkad-prod-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.75"
          memory: 1G

  nginx:
    image: nginx:1.25-alpine
    container_name: bhukkad-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/bhukkad.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - bhukkad-prod-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mysql_data_prod:
    name: bhukkad_mysql_prod
  redis_data_prod:
    name: bhukkad_redis_prod
  app_logs_prod:
    name: bhukkad_logs_prod

networks:
  bhukkad-prod-network:
    name: bhukkad_prod_network
    driver: bridge
