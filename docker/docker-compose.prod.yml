services:
  postgres:
    image: postgres:16-alpine
    container_name: bhukkad-postgres-prod
    restart: always
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:core}
      POSTGRES_USER: ${POSTGRES_USER:bhukkad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bhukkad-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:bhukkad} -d ${POSTGRES_DB:core}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 768M

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis-prod
    restart: always
    init: true
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
      - ./redis/redis-prod.conf:/etc/redis/redis.conf:ro
    networks:
      - bhukkad-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  # Daily automated backups (PostgreSQL dump + Redis snapshot) into a named volume.
  # Off-site copy can be added by setting S3_BUCKET + AWS_* env vars.
  backup:
    image: alpine:3.19
    container_name: bhukkad-backup-prod
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache postgresql-client redis >/dev/null 2>&1
        while true; do
          echo "[$$(date)] Running scheduled backup"
          sh /scripts/backup-postgres.sh || echo "[$$(date)] PostgreSQL backup FAILED"
          sh /scripts/backup-redis.sh || echo "[$$(date)] Redis backup FAILED"
          sleep $${BACKUP_INTERVAL_HOURS:-24}h
        done
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:bhukkad}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:core}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      BACKUP_DIR: /backup
      REDIS_DATA_DIR: /redis-data
      RETENTION_DAYS: "30"
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
    volumes:
      - backup_data_prod:/backup
      - redis_data_prod:/redis-data:ro
      - ./scripts/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./scripts/backup-redis.sh:/scripts/backup-redis.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bhukkad-prod-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  postgres_data_prod:
    name: bhukkad_postgres_prod
  redis_data_prod:
    name: bhukkad_redis_prod
  backup_data_prod:
    name: bhukkad_backups_prod

networks:
  bhukkad-prod-network:
    name: bhukkad_prod_network
    driver: bridge
