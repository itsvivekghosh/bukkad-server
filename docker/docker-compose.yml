# ============================================
# Base Docker Compose Configuration
# Shared by dev and prod
# ============================================
version: '3.8'

x-common-app: &common-app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  networks:
    - bhukkad-network

x-common-postgres: &common-postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks:
    - bhukkad-network
  command: >
    -c shared_buffers=256MB
    -c max_connections=200
    -c log_statement=all
    -c log_duration=on
    -c log_min_duration_statement=2000

x-common-redis: &common-redis
  image: redis:7-alpine
  restart: unless-stopped
  networks:
    - bhukkad-network

networks:
  bhukkad-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_logs:
