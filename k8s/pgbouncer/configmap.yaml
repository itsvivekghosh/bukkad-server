apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    * = host=bhukkad-postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 2000
    default_pool_size = 40
    min_pool_size = 5
    reserve_pool_size = 5
    server_idle_timeout = 600
    server_lifetime = 3600
    # P8 scale-out: transaction pooling lets every per-service app share the
    # postgres primary's connection budget (Hikari per-pod keeps its own pool,
    # but pgbouncer caps total sockets and protects the primary from churn).
    log_connections = 1
    log_disconnections = 1
    stats_period = 60
  userlist.txt: |
    "bhukkad" "CHANGE_ME_DB_PASSWORD"
