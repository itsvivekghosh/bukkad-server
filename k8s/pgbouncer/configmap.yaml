apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    # PERF-0: per-DB pool_size caps per the perf-guide §4.2 budget table, kept
    # consistent with the enforced CI arithmetic (scripts/ci/pool-budget-check.py):
    #   Σ(hpa-max × DB_POOL_SIZE) ≤ 0.8 × min(per-DB pool_size, PG max_connections)
    # with the maxReplicas actually declared in k8s/*/hpa.yaml (12 for every DB
    # service), the §4.2 starting values (280/140/280/100/80) under-size the hot
    # DBs — e.g. orders 12×20=240 > 0.8×280 — so each entry is raised to the
    # smallest value that satisfies the rule (240→300, identity 12×15=180→225,
    # small DBs via default_pool_size 12×10=120→150). Pool sizes are caps, not
    # reservations: transaction pooling + server_idle_timeout keep the number of
    # REAL server sockets opened on the primary far below the summed caps during
    # normal operation.
    # PostgreSQL server budget: max_connections ≈ 320 (§4.2) on the primary —
    # summed per-DB caps must never be simultaneously saturated against it without
    # re-running the §4.2 arithmetic (the CI guard enforces the per-DB rule only).
    orders = host=bhukkad-postgresql port=5432 dbname=orders pool_size=300
    payments = host=bhukkad-postgresql port=5432 dbname=payments pool_size=300
    restaurants = host=bhukkad-postgresql port=5432 dbname=restaurants pool_size=300
    identity = host=bhukkad-postgresql port=5432 dbname=identity pool_size=225
    # P2 fleet completion: realtime/personalization/growth ship hpa.yaml
    # (maxReplicas 12) with DB_POOL_SIZE 20 → demand 12×20=240 per DB, so each
    # gets the smallest pool_size satisfying the §4.2 rule (240 ≤ 0.8×300),
    # same tier as orders/payments/restaurants.
    realtime = host=bhukkad-postgresql port=5432 dbname=realtime pool_size=300
    personalization = host=bhukkad-postgresql port=5432 dbname=personalization pool_size=300
    growth = host=bhukkad-postgresql port=5432 dbname=growth pool_size=300
    * = host=bhukkad-postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 2000
    # §4.2 "others (small)" tier: sized so 12 HPA-pods × 10-pool small services
    # (120) stay under 0.8 of this default (table start value 80 → raised, see above).
    default_pool_size = 150
    min_pool_size = 5
    reserve_pool_size = 5
    server_idle_timeout = 600
    server_lifetime = 3600
    # P8 scale-out: transaction pooling lets every per-service app share the
    # postgres primary's connection budget (Hikari per-pod keeps its own pool,
    # but pgbouncer caps total sockets and protects the primary from churn).
    log_connections = 1
    log_disconnections = 1
    stats_period = 60
  # ---------------------------------------------------------------------------
  # userlist.txt (auth_file) — DELIBERATELY NOT SHIPPED AS A CONFIGMAP VALUE
  # (P2 fix: it used to carry a hardcoded "CHANGE_ME_DB_PASSWORD" line).
  #
  # The pgbouncer Deployment (k8s/pgbouncer/deployment.yaml) does not mount
  # this ConfigMap at all: the edoburu/pgbouncer image entrypoint generates
  # userlist.txt at container start from the DB_USER / DB_PASSWORD environment
  # variables, which the deployment already injects via the standard
  # secretKeyRef pattern (bhukkad-secrets, Vault-owned via external-secret.yaml
  # — creationPolicy: Owner). There is no credential in any manifest.
  #
  # Rotation note: rotate by (1) updating the Postgres role password
  # (ALTER ROLE ... PASSWORD) in the DB, (2) updating bhukkad/prod/database in
  # Vault (property password) — the ExternalSecret refreshes bhukkad-secrets
  # within refreshInterval 1h, (3) `kubectl -n bhukkad rollout restart
  # deployment/pgbouncer` plus every per-service deployment, so containers
  # regenerate their userlist / Hikari connections with the new secret.
  # pgbouncer accepts the plain or md5-hashed form; the entrypoint writes the
  # md5 form (md5<md5(password+user)>).
  # ---------------------------------------------------------------------------
