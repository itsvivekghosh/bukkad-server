apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    orders            = host=bhukkad-postgresql port=5432 dbname=orders            pool_size=2000
    payments          = host=bhukkad-postgresql port=5432 dbname=payments          pool_size=2000
    restaurants       = host=bhukkad-postgresql port=5432 dbname=restaurants       pool_size=2000
    identity          = host=bhukkad-postgresql port=5432 dbname=identity          pool_size=1000
    realtime          = host=bhukkad-postgresql port=5432 dbname=realtime          pool_size=1000
    notification      = host=bhukkad-postgresql port=5432 dbname=notification      pool_size=1000
    delivery          = host=bhukkad-postgresql port=5432 dbname=delivery          pool_size=2000
    admin-analytics   = host=bhukkad-postgresql port=5432 dbname=admin-analytics   pool_size=1000
    search            = host=bhukkad-postgresql port=5432 dbname=search            pool_size=1000
    referral          = host=bhukkad-postgresql port=5432 dbname=referral          pool_size=1000
    survey            = host=bhukkad-postgresql port=5432 dbname=survey            pool_size=1000
    supportticket     = host=bhukkad-postgresql port=5432 dbname=supportticket     pool_size=1000
    growth            = host=bhukkad-postgresql port=5432 dbname=growth            pool_size=1000
    personalization   = host=bhukkad-postgresql port=5432 dbname=personalization   pool_size=1000
    social            = host=bhukkad-postgresql port=5432 dbname=social            pool_size=2500
    * = host=bhukkad-postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 17500
    default_pool_size = 150
    min_pool_size = 5
    reserve_pool_size = 5
    server_idle_timeout = 600
    server_lifetime = 3600
    server_reset_query_always = DISCARD ALL
    log_connections = 1
    log_disconnections = 1
    stats_period = 60
  # ---------------------------------------------------------------------------
  # userlist.txt (auth_file) — DELIBERATELY NOT SHIPPED AS A CONFIGMAP VALUE
  # (P2 fix: it used to carry a hardcoded "CHANGE_ME_DB_PASSWORD" line).
  #
  # The pgbouncer Deployment (k8s/pgbouncer/deployment.yaml) does not mount
  # this ConfigMap at all: the edoburu/pgbouncer image entrypoint generates
  # userlist.txt at container start from the DB_USER / DB_PASSWORD environment
  # variables, which the deployment already injects via the standard
  # secretKeyRef pattern (bhukkad-secrets, Vault-owned via external-secret.yaml
  # — creationPolicy: Owner). There is no credential in any manifest.
  #
  # Rotation note: rotate by (1) updating the Postgres role password
  # (ALTER ROLE ... PASSWORD) in the DB, (2) updating bhukkad/prod/database in
  # Vault (property password) — the ExternalSecret refreshes bhukkad-secrets
  # within refreshInterval 1h, (3) `kubectl -n bhukkad rollout restart
  # deployment/pgbouncer` plus every per-service deployment, so containers
  # regenerate their userlist / Hikari connections with the new secret.
  # pgbouncer accepts the plain or md5-hashed form; the entrypoint writes the
  # md5 form (md5<md5(password+user)>).
  # ---------------------------------------------------------------------------
