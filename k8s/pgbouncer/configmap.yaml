apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    ; One database per CONSOLIDATED service (post 16→5 merge). The pre-merge
    ; entries (orders, payments, restaurants, realtime, notification, delivery,
    ; admin-analytics, search, referral, survey, supportticket, growth,
    ; personalization, social) name databases that NO LONGER EXIST, so the four
    ; services other than identity had no pool at all and fell through to the
    ; catch-all below — which carries default_pool_size and bypassed the
    ; per-DB budget entirely.
    ;
    ; Pool sizes tuned for Postgres max_connections=1000 with 2 pgbouncer replicas
    ; Each pgbouncer instance gets ~475 server connections (950 total / 2)
    ; Sum of pool_size across all DBs <= 475 per instance
    ;
    ; Budget rule enforced by scripts/ci/pool-budget-check.py:
    ;     hpa_max x hikari_pool <= 0.8 x pool_size
    ; identity: hpa_max 8 x pool 20 = 160 <= 0.8 x 210 = 168
    ; sum = 475
    identity          = host=bhukkad-postgresql port=5432 dbname=identity          pool_size=210
    commerce          = host=bhukkad-postgresql port=5432 dbname=commerce          pool_size=90
    catalog           = host=bhukkad-postgresql port=5432 dbname=catalog           pool_size=70
    engagement        = host=bhukkad-postgresql port=5432 dbname=engagement        pool_size=60
    admin             = host=bhukkad-postgresql port=5432 dbname=admin             pool_size=45
    * = host=bhukkad-postgresql port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 10000
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 10
    server_idle_timeout = 600
    server_lifetime = 3600
    server_reset_query_always = DISCARD ALL
    log_connections = 1
    log_disconnections = 1
    stats_period = 60
  # ---------------------------------------------------------------------------
  # userlist.txt (auth_file) — DELIBERATELY NOT SHIPPED AS A CONFIGMAP VALUE
  # (P2 fix: it used to carry a hardcoded "CHANGE_ME_DB_PASSWORD" line).
  #
  # The pgbouncer Deployment (k8s/pgbouncer/deployment.yaml) does not mount
  # this ConfigMap at all: the edoburu/pgbouncer image entrypoint generates
  # userlist.txt at container start from the DB_USER / DB_PASSWORD environment
  # variables, which the deployment already injects via the standard
  # secretKeyRef pattern (bhukkad-secrets, Vault-owned via external-secret.yaml
  # — creationPolicy: Owner). There is no credential in any manifest.
  #
  # Rotation note: rotate by (1) updating the Postgres role password
  # (ALTER ROLE ... PASSWORD) in the DB, (2) updating bhukkad/prod/database in
  # Vault (property password) — the ExternalSecret refreshes bhukkad-secrets
  # within refreshInterval 1h, (3) `kubectl -n bhukkad rollout restart
  # deployment/pgbouncer` plus every per-service deployment, so containers
  # regenerate their userlist / Hikari connections with the new secret.
  # pgbouncer accepts the plain or md5-hashed form; the entrypoint writes the
  # md5 form (md5<md5(password+user)>).
  # ---------------------------------------------------------------------------