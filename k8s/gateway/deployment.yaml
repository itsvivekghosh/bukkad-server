apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-gateway
  namespace: bhukkad
  labels:
    app: bhukkad
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: gateway
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: gateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: gateway
      serviceAccountName: bhukkad-app
      terminationGracePeriodSeconds: 90  # G-16: SSE + in-flight requests need the full drain window (was 45)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: bhukkad-gateway
          image: ghcr.io/bhukkad/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: bhukkad-config
          env:
            - name: SERVER_PORT
              value: "8080"
            # Service-mesh (inter-service) HMAC secret
            # (app.auth.service.jwt-secret) — provisioned in
            # k8s/external-secret.yaml (Vault bhukkad/prod/auth); without the
            # mapping it would vanish on ExternalSecret sync.
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: SERVICE_JWT_SECRET
            # RS256 verification: identity's JWKS via the ClusterIP Service
            # (Service port 80 → targetPort 8081, k8s/identity/service.yaml).
            - name: JWKS_URL
              value: http://bhukkad-identity/.well-known/jwks.json
            # P-09 JVM<->container contract. Value mirrors the image's JAVA_OPTS
            # ENV default verbatim (services/gateway/Dockerfile) plus the
            # canonical §4.1 flag set — merge, not clobber. Memory
            # requests==limits below, CPU has a request and no limit so GC
            # threads are never throttled.
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+ExitOnOutOfMemoryError
                -XX:+UseStringDeduplication
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: 750m
              memory: 512Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: gateway-logs
              mountPath: /tmp/logs/bhukkad
      volumes:
        - name: gateway-logs
          emptyDir: {}
