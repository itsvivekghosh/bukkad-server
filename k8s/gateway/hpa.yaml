apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhukkad-gateway
  namespace: bhukkad
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhukkad-gateway
  minReplicas: 10
  maxReplicas: 50
  metrics:
    # CPU/memory baseline for JVM heap pressure
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metrics overlay for reactive gateway scaling on request rate
    # and event-loop queue depth (requires prometheus-adapter or KEDA).
    - type: Pods
      pods:
        metric:
          name: http_server_requests_seconds_count
        target:
          type: AverageValue
          averageValue: 1000
    - type: External
      external:
        metric:
          name: reactor_netty_io_worker_pending_tasks
        target:
          type: AverageValue
          averageValue: 50
