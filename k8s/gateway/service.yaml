apiVersion: v1
kind: Service
metadata:
  name: bhukkad-gateway
  namespace: bhukkad
  labels:
    app: bhukkad
    component: gateway
  annotations:
    cloud.google.com/load-balancer-type: "External"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: bhukkad
    component: gateway
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
