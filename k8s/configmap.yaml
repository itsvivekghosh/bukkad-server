apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-config
  namespace: bhukkad
  labels:
    app: bhukkad
data:
  # Application Config
  SPRING_PROFILES_ACTIVE: "dev"
  SERVER_PORT: "8080"
  DB_HOST: "bhukkad-mysql"
  DB_PORT: "3306"
  DB_NAME: "bhukkad"
  DB_REPLICA_HOST: "bhukkad-mysql-replica"
  DB_REPLICA_PORT: "3306"
  DB_REPLICA_ENABLED: "true"
  DB_REPLICA_URL: "jdbc:mysql://bhukkad-mysql-replica:3306/bhukkad?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  REDIS_HOST: "bhukkad-redis"
  REDIS_PORT: "6379"
  APP_ENVIRONMENT: "production"
  APP_DEBUG: "false"
  TZ: "Asia/Kolkata"
  MYSQL_DATABASE: "bhukkad"

  # MySQL Init SQL
  init.sql: |
    SET NAMES utf8mb4;
    SET CHARACTER SET utf8mb4;

    CREATE DATABASE IF NOT EXISTS bhukkad
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    USE bhukkad;

    GRANT ALL PRIVILEGES ON bhukkad.* TO 'bhukkad_user'@'%';
    FLUSH PRIVILEGES;

    SELECT 'Database initialized!' AS status;