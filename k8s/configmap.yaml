apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-config
  namespace: bhukkad
  labels:
    app: bhukkad
data:
  # ---------------------------------------------------------------------------
  # Application Config
  #
  # This ConfigMap is consumed by the app Deployment via `envFrom`, so EVERY key
  # here must be a valid environment variable name (C_IDENTIFIER). Do not add
  # file-style keys such as `init.sql` -- kubelet silently skips them and emits
  # an InvalidVariableNames event. File payloads live in their own ConfigMaps
  # (see k8s/postgres/configmap.yaml).
  # ---------------------------------------------------------------------------

  # `prod` matches APP_ENVIRONMENT below. The prod profile reads DB_URL directly
  # (application-prod.yml), unlike the dev profile which composes the URL from
  # DB_HOST/DB_PORT/DB_NAME -- so DB_URL MUST be supplied here.
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

  # Primary datasource. DB_URL is what application-prod.yml actually reads;
  # DB_HOST/DB_PORT/DB_NAME are kept for the dev profile and for tooling.
  DB_URL: "jdbc:postgresql://bhukkad-postgresql:5432/bhukkad?currentSchema=public&ssl=false"
  DB_HOST: "bhukkad-postgresql"
  DB_PORT: "5432"
  DB_NAME: "core"

  # Read replica is ENABLED: the replica StatefulSet is a fully configured
  # PostgreSQL instance with persistent volume and streaming replication.
  # Read-only transactions are load-balanced across the replica pool; writes
  # always go to the primary.
  DB_REPLICA_ENABLED: "true"
  DB_REPLICA_HOST: "bhukkad-postgresql-replica"
  DB_REPLICA_PORT: "5432"
  DB_REPLICA_URL: "jdbc:postgresql://bhukkad-postgresql-replica:5432/bhukkad?currentSchema=public&ssl=false"

  REDIS_HOST: "bhukkad-redis"
  REDIS_PORT: "6379"

  APP_ENVIRONMENT: "production"
  APP_DEBUG: "false"
  TZ: "Asia/Kolkata"

  # STOMP relay defaults to the in-memory broker. The RabbitMQ relay was
  # retired with the monolith (k8s/rabbitmq deleted, W3-RESTRUCTURE); leave
  # "simple" — live order tracking flows through the realtime service + SSE.
  STOMP_BROKER_TYPE: "simple"

  # Kafka/Redpanda events. The 3-broker Redpanda cluster ships with the base
  # build via the kustomize component k8s/components/redpanda (SPOF #8); topics
  # are seeded by its topics-init Job from docs/event-catalog.md. Consumers
  # stay disabled until ops flips this flag per service; KAFKA_BOOTSTRAP_SERVERS
  # targets the brokers' headless Service so the flip needs no re-render.
  # ENABLED fleet-wide (P0 config audit): EventBackbonePreflight refuses a prod
  # boot when this is "false" (outbox rows would accumulate silently), so the
  # off state is unbootable in prod, not a safe default.
  # DEPENDENCY (coordination): a concurrent batch is fixing the publisher
  # topic alignment to match docs/event-catalog.md + the topics-init Job
  # seeding — the outbox relay will publish misaligned topic names until that
  # lands; DLT/Consumer-lag alerts (bhukkad.events group) are the tripwire.
  APP_EVENTS_EXTERNAL_ENABLED: "true"
  APP_EVENTS_EXTERNAL_TYPE: "kafka"
  KAFKA_BOOTSTRAP_SERVERS: >-
    redpanda-0.redpanda-headless.bhukkad.svc.cluster.local:9092,
    redpanda-1.redpanda-headless.bhukkad.svc.cluster.local:9092,
    redpanda-2.redpanda-headless.bhukkad.svc.cluster.local:9092

  # Razorpay payment gateway. The simulated gateway (default) is rejected by
  # SecretValidationConfig in the prod profile because it cannot validate webhook
  # signatures. Set APP_PAYMENT_RAZORPAY_ENABLED=true and provide the
  # corresponding secrets (RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET,
  # RAZORPAY_WEBHOOK_SECRET) in bhukkad-secrets to enable the real gateway.
  APP_PAYMENT_RAZORPAY_ENABLED: "true"

  # ---------------------------------------------------------------------------
  # Backup off-site copy (roadmap #15): the bhukkad-backup CronJob's s3-sync
  # container reads these. S3_BUCKET is REQUIRED — the in-cluster PVC alone was
  # the audited single-point-of-failure. AWS keys come from bhukkad-secrets
  # (Vault path bhukkad/prod/backup); the bucket lifecycle rule must enforce
  # 30-day retention (docs/backup-and-restore-runbook.md).
  # ---------------------------------------------------------------------------
  S3_BUCKET: "CHANGE_ME_BACKUP_BUCKET"
  AWS_REGION: "ap-south-1"

  # Loki endpoint for the FluentBit DaemonSet (k8s/logging/). Unset/empty ⇒
  # the log shipper idles (tail-only); set to e.g. "loki.observability.svc"
  # or an external Loki host to enable shipping.
  LOKI_HOST: ""

  # ---------------------------------------------------------------------------
  # Distributed tracing (P0 config audit): services read these via
  # ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:...} / ${TRACING_SAMPLE_PROBABILITY:...}
  # in their application.yml (management.zipkin.tracing.endpoint /
  # management.tracing.sampling.probability).
  #
  # Zipkin/OTLP span export endpoint. EMPTY default keeps current behavior
  # (spans are built but not exported; the app-local default localhost:9411 is
  # a no-op in-cluster). Set to an in-cluster Zipkin/OTLP collector to enable
  # export, e.g. "http://zipkin.observability.svc.cluster.local:9411/api/v2/spans"
  # or an OTLP-endpoint-compatible collector.
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: ""
  # Head-based sampling probability. The code default is 1.0 (100% of requests
  # traced) which is prohibitive at fleet traffic levels; 0.1 = 10% sampling
  # for prod. Raise temporarily when chasing a specific incident.
  TRACING_SAMPLE_PROBABILITY: "0.1"