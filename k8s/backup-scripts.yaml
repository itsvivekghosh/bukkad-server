apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-backup-scripts
  namespace: bhukkad
  labels:
    app: bhukkad
    component: backup
binaryData: {}
data:
  # ---------------------------------------------------------------------------
  # Roadmap #15 rewrite: the platform is database-per-service (15+ Postgres
  # DBs, docs/ARCHITECTURE.md service catalog) — the old script dumped the
  # single legacy `bhukkad` DB, leaving 14/15 databases with NO backup.
  #
  # This script loops over ALL service DBs (DB_LIST) and pg_dumps each into its
  # own gzipped file, so a single corrupt dump cannot poison the whole set and
  # per-service restore granularity is natural. Credentials come from
  # bhukkad-secrets; the backup runs as the POSTGRES superuser so one login
  # suffices for all DBs (per-service roles are intentionally least-privilege
  # and cannot read each other's databases — R-08/G-14).
  #
  # Off-site copy: the sibling `s3-sync` container (backup-cronjob.yaml, pinned
  # amazon/aws-cli image) waits for the .backup_done marker this script writes
  # and mirrors /backup to s3://$S3_BUCKET — neither postgres nor redis images
  # ship an `aws` binary, and only s3-sync holds cloud credentials.
  #
  # Failure semantics: exits non-zero on any DB failure so the CronJob records
  # a failed job (alert rule BackupJobFailing); partial dumps are deleted, the
  # previous good dump stays intact.
  # ---------------------------------------------------------------------------
  backup-postgres.sh: |
    #!/bin/bash
    set -uo pipefail
    # NOT `set -e`: one failing DB must not skip the remaining databases — the
    # loop collects failures and reports the full set at the end.
    DB_HOST="${DB_HOST:-bhukkad-postgresql}"
    DB_PORT="${DB_PORT:-5432}"
    DB_USERNAME="${DB_USERNAME:?DB_USERNAME (backup superuser) is required}"
    DB_PASSWORD="${DB_PASSWORD:?DB_PASSWORD is required}"
    # Space-separated list of service databases. Default: AUTO-DISCOVER every
    # non-template database on the cluster, so a newly added service is backed
    # up with no manifest change (must match initdb/00-create-databases.sql:
    # identity restaurants orders payments delivery notification admin search
    # survey referral support realtime personalization growth).
    DB_LIST="${DB_LIST:-}"
    BACKUP_DIR="${BACKUP_DIR:-/backup/postgres}"
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    STAMP=$(date +%s)
    LOG_PREFIX="[$(date '+%Y-%m-%dT%H:%M:%S%z')]"
    mkdir -p "${BACKUP_DIR}"
    FAILED=()
    SUCCEEDED=0
    export PGPASSWORD="${DB_PASSWORD}"
    if [ -z "${DB_LIST}" ]; then
      DB_LIST=$(psql --host="${DB_HOST}" --port="${DB_PORT}" \
        --username="${DB_USERNAME}" --dbname=postgres --tuples-only --no-align \
        --command="SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate AND datname <> 'postgres';")
    fi
    echo "${LOG_PREFIX} Starting per-service PostgreSQL backup: ${DB_LIST} @ ${DB_HOST}:${DB_PORT}"
    for DB in ${DB_LIST}; do
      FILENAME="bhukkad_${DB}_${TIMESTAMP}.sql.gz"
      if pg_dump --host="${DB_HOST}" --port="${DB_PORT}" \
                 --username="${DB_USERNAME}" --dbname="${DB}" \
                 --format=plain --no-owner --no-acl \
          | gzip > "${BACKUP_DIR}/${FILENAME}.partial"; then
        # gzip success is not dump success (pipefail is on, but verify the
        # artifact is a real, non-empty, gzip-valid file before promoting it).
        if [ -s "${BACKUP_DIR}/${FILENAME}.partial" ] && gzip -t "${BACKUP_DIR}/${FILENAME}.partial" 2>/dev/null; then
          mv "${BACKUP_DIR}/${FILENAME}.partial" "${BACKUP_DIR}/${FILENAME}"
          SUCCEEDED=$((SUCCEEDED + 1))
          echo "${LOG_PREFIX} dumped ${DB} -> ${FILENAME} ($(du -h "${BACKUP_DIR}/${FILENAME}" | cut -f1))"
        else
          rm -f "${BACKUP_DIR}/${FILENAME}.partial"
          FAILED+=("${DB}:artifact-invalid")
        fi
      else
        rm -f "${BACKUP_DIR}/${FILENAME}.partial"
        FAILED+=("${DB}:pg_dump")
      fi
    done
    # Retention: prune local dumps past RETENTION_DAYS (remote retention is a
    # bucket lifecycle rule — see docs/backup-and-restore-runbook.md).
    find "${BACKUP_DIR}" -name "bhukkad_*_*.sql.gz" -mtime +"${RETENTION_DAYS}" -delete
    rm -f "${BACKUP_DIR}/.backup_done" "${BACKUP_DIR}/.backup_failed"
    if [ ${#FAILED[@]} -eq 0 ]; then
      # Success marker consumed by the s3-sync container and by the freshness
      # check in scripts/ci/restore-drill.sh.
      printf '%s\n' "${STAMP}" > "${BACKUP_DIR}/.last_success_epoch"
      printf '%s\n' "${SUCCEEDED}" > "${BACKUP_DIR}/.backup_done"
      echo "${LOG_PREFIX} PostgreSQL backup finished successfully for ${SUCCEEDED} databases"
      exit 0
    fi
    printf '%s\n' "${FAILED[*]}" > "${BACKUP_DIR}/.backup_failed"
    echo "${LOG_PREFIX} BACKUP FAILED for: ${FAILED[*]}"
    exit 1

  verify-wal.sh: |
    #!/bin/sh
    # ---------------------------------------------------------------------------
    # PITR WAL-freshness gate (k8s/README-PITR.md). Runs in the bhukkad-backup
    # CronJob's s3-sync container (the only container holding `aws` + cloud
    # credentials) AFTER the dump sync: fails the job when the newest wal-g WAL
    # segment under the PITR prefix is older than WAL_MAX_AGE_SECONDS (default
    # 30m; archive_timeout=60s + a 10s sidecar poll make 30m generous), so a
    # broken archive pipeline trips BackupJobFailed instead of silently
    # shrinking the point-in-time recovery window.
    #
    # wal-g stores WAL under <prefix>/wal_<pg-version>*/ segments (e.g.
    # wal_005/...); the check is version-agnostic by matching any wal_*/ key.
    # Disable with PITR_WAL_VERIFY=false (only when the wal-g sidecar is not
    # deployed or S3_BUCKET points at a bucket without the pitr prefix).
    # ---------------------------------------------------------------------------
    set -eu
    S3_BUCKET="${S3_BUCKET:?S3_BUCKET is required}"
    PITR_WAL_VERIFY="${PITR_WAL_VERIFY:-true}"
    if [ "${PITR_WAL_VERIFY}" != "true" ]; then
      echo "[verify-wal] PITR_WAL_VERIFY=false — skipping WAL freshness check"
      exit 0
    fi
    WAL_PREFIX="${WAL_PREFIX:-s3://${S3_BUCKET}/pitr}"
    WAL_MAX_AGE_SECONDS="${WAL_MAX_AGE_SECONDS:-1800}"
    NOW=$(date +%s)
    # `aws s3 ls --recursive` rows: "YYYY-MM-DD HH:MM:SS <size> <key>".
    # Keys under any wal_*/ subdir; take the newest by (date, time).
    LATEST=$(aws s3 ls "${WAL_PREFIX}/" --recursive 2>/dev/null \
      | awk '$4 ~ /(^|\/)wal_.*\// {print $1, $2}' | sort | tail -1 || true)
    if [ -z "${LATEST}" ]; then
      echo "[verify-wal] FAIL: no WAL segments found under ${WAL_PREFIX}/ (wal-g sidecar not uploading?)" >&2
      exit 1
    fi
    TS=$(echo "${LATEST}" | cut -d' ' -f1-2)
    # amazon/aws-cli image is amazonlinux:2023 — GNU date parses the timestamp.
    LAST_EPOCH=$(date -u -d "${TS}" +%s)
    AGE=$((NOW - LAST_EPOCH))
    echo "[verify-wal] newest WAL segment uploaded ${AGE}s ago (max ${WAL_MAX_AGE_SECONDS}s)"
    if [ "${AGE}" -gt "${WAL_MAX_AGE_SECONDS}" ]; then
      echo "[verify-wal] FAIL: WAL upload stale (${AGE}s > ${WAL_MAX_AGE_SECONDS}s) — PITR window is shrinking" >&2
      exit 1
    fi
    echo "[verify-wal] OK: WAL uploads are fresh"

  backup-redis.sh: |
    #!/bin/sh
    set -euo pipefail
    REDIS_HOST="${REDIS_HOST:-bhukkad-redis}"
    REDIS_PORT="${REDIS_PORT:-6379}"
    REDIS_PASSWORD="${REDIS_PASSWORD:-}"
    REDIS_DATA_DIR="${REDIS_DATA_DIR:-/redis-data}"
    BACKUP_DIR="${BACKUP_DIR:-/backup/redis}"
    RETENTION_DAYS="${RETENTION_DAYS:-7}"
    STAMP=$(date +%s)
    mkdir -p "${BACKUP_DIR}"
    echo "[$(date)] Starting Redis backup: ${REDIS_HOST}:${REDIS_PORT}"
    AUTH_ARGS=""
    if [ -n "${REDIS_PASSWORD}" ]; then
      AUTH_ARGS="-a ${REDIS_PASSWORD}"
    fi
    # shellcheck disable=SC2086
    redis-cli ${AUTH_ARGS} -h "${REDIS_HOST}" -p "${REDIS_PORT}" BGSAVE >/dev/null
    echo "[$(date)] BGSAVE triggered, waiting..."
    BEFORE=$(redis-cli ${AUTH_ARGS} -h "${REDIS_HOST}" -p "${REDIS_PORT}" LASTSAVE)
    for _ in $(seq 1 60); do
      AFTER=$(redis-cli ${AUTH_ARGS} -h "${REDIS_HOST}" -p "${REDIS_PORT}" LASTSAVE)
      if [ -n "${AFTER}" ] && [ "${AFTER}" -gt "${BEFORE}" ]; then
        break
      fi
      sleep 1
    done
    RDB_FILE="${REDIS_DATA_DIR}/dump.rdb"
    if [ -f "${RDB_FILE}" ]; then
      cp "${RDB_FILE}" "${BACKUP_DIR}/bhukkad_redis_$(date +%Y%m%d_%H%M%S).rdb"
      echo "[$(date)] RDB archived"
    fi
    find "${BACKUP_DIR}" \( -name "bhukkad_redis_*.rdb" -o -name "bhukkad_redis_*.aof" \) -mtime +${RETENTION_DAYS} -delete
    printf '%s\n' "${STAMP}" > "${BACKUP_DIR}/.last_success_epoch"
    printf 'ok\n' > "${BACKUP_DIR}/.backup_done"
    echo "[$(date)] Redis backup finished successfully"

  # ---------------------------------------------------------------------------
  # PITR base backups (k8s/docs/RUNBOOK-PITR.md). The nightly dump set gives a
  # T-1 logical restore; THIS closes the gap to point-in-time: a wal-g FULL
  # base backup streamed over the BASE_BACKUP protocol (remote mode — NO PGDATA
  # directory argument; the wal-g docs specify `PGHOST=... wal-g backup-push`
  # for exactly this Kubernetes-CronJob pattern) so the WAL segments archived
  # continuously by the postgres pod's walg-archive sidecar always have a base
  # to replay FROM. Connection is via the standard PG* libpq env vars like
  # backup-postgres.sh (superuser has the required replication rights).
  #
  # Retention: `wal-g delete retain FULL 7 --use-sentinel-time --confirm`
  # keeps the 7 newest FULL backups plus the WAL each still needs (docs-
  # specified sentinel-time ordering avoids the post-major-upgrade name-order
  # pitfall). ~1 week PITR window floor; the S3 dump lifecycle stays 30d.
  #
  # Guard: with WALG_S3_PREFIX unset/placeholder the script SKIP-SUCCEEDS so
  # an unconfigured cluster doesn't page BackupJobFailed (PITR opt-in is then
  # explicit, matching the sidecar's discard-mode WARN posture).
  # ---------------------------------------------------------------------------
  backup-walg.sh: |
    #!/bin/sh
    set -eu
    case "${WALG_S3_PREFIX:-}" in
      ""|*CHANGE_ME*)
        echo "[$(date)] WALG_S3_PREFIX unset/placeholder — skipping wal-g base backup (PITR not configured; see k8s/docs/RUNBOOK-PITR.md)"
        exit 0
        ;;
    esac
    : "${PGHOST:?PGHOST required (postgres host)}"
    : "${PGUSER:?PGUSER required (backup superuser)}"
    : "${PGPASSWORD:?PGPASSWORD required}"
    PGPORT="${PGPORT:-5432}"
    export PGHOST PGPORT PGUSER PGPASSWORD
    echo "[$(date)] wal-g base backup via ${PGHOST}:${PGPORT} -> ${WALG_S3_PREFIX}"
    # Remote streaming mode: backup-push WITHOUT a data directory.
    wal-g backup-push
    echo "[$(date)] base backup pushed; retaining ${WALG_RETAIN_COUNT:-7} FULL"
    wal-g delete retain FULL "${WALG_RETAIN_COUNT:-7}" --use-sentinel-time --confirm
    wal-g backup-list
    echo "[$(date)] wal-g base backup finished successfully"
