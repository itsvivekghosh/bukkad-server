apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bhukkad-secrets
  namespace: bhukkad
  labels:
    app: bhukkad
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bhukkad-vault-store
    kind: SecretStore
  target:
    name: bhukkad-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: bhukkad/prod/redis
        property: password
    - secretKey: RABBITMQ_USERNAME
      remoteRef:
        key: bhukkad/prod/rabbitmq
        property: username
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: bhukkad/prod/rabbitmq
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: bhukkad/prod/auth
        property: jwt_secret
    - secretKey: JWT_EXPIRATION
      remoteRef:
        key: bhukkad/prod/auth
        property: jwt_expiration
    - secretKey: JWT_REFRESH_EXPIRATION
      remoteRef:
        key: bhukkad/prod/auth
        property: jwt_refresh_expiration
    # Service-mesh (inter-service) HMAC secret — referenced by every service
    # deployment via SERVICE_JWT_SECRET secretKeyRef. Without this mapping it
    # would vanish on first sync (creationPolicy: Owner replaces the target).
    - secretKey: SERVICE_JWT_SECRET
      remoteRef:
        key: bhukkad/prod/auth
        property: service_jwt_secret
    # Identity RS256 signing key (ADR-004): PKCS#8 PEM, mounted into the
    # identity pods as a Secret volume and read via JWT_PRIVATE_KEY_PATH.
    # Must be one shared key across replicas so JWKS verification stays
    # fleet-consistent.
    - secretKey: JWT_PRIVATE_KEY_PEM
      remoteRef:
        key: bhukkad/prod/auth
        property: jwt_private_key_pem
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: bhukkad/prod/payments
        property: razorpay_key_id
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: bhukkad/prod/payments
        property: razorpay_key_secret
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: bhukkad/prod/payments
        property: razorpay_webhook_secret
    # -------------------------------------------------------------------------
    # Per-service database credentials (database-per-service ownership).
    # Each deployment references these via secretKeyRef. All properties live in
    # the single bhukkad/prod/database Vault entry as <service>_* keys.
    # NOTE: ExternalSecret uses creationPolicy: Owner, which REPLACES the
    # target secret — every key referenced by any deployment must be mapped
    # here or it will vanish on sync (see k8s/secrets.yaml for the full list).
    # -------------------------------------------------------------------------
    - secretKey: RESTAURANT_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: restaurant_db_url
    - secretKey: RESTAURANT_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: restaurant_db_username
    - secretKey: RESTAURANT_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: restaurant_db_password
    - secretKey: ORDER_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: order_db_url
    - secretKey: ORDER_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: order_db_username
    - secretKey: ORDER_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: order_db_password
    - secretKey: PAYMENT_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: payment_db_url
    - secretKey: PAYMENT_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: payment_db_username
    - secretKey: PAYMENT_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: payment_db_password
    - secretKey: DELIVERY_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: delivery_db_url
    - secretKey: DELIVERY_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: delivery_db_username
    - secretKey: DELIVERY_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: delivery_db_password
    - secretKey: NOTIFICATION_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: notification_db_url
    - secretKey: NOTIFICATION_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: notification_db_username
    - secretKey: NOTIFICATION_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: notification_db_password
    - secretKey: ADMIN_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: admin_db_url
    - secretKey: ADMIN_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: admin_db_username
    - secretKey: ADMIN_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: admin_db_password
    - secretKey: SURVEY_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: survey_db_url
    - secretKey: SURVEY_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: survey_db_username
    - secretKey: SURVEY_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: survey_db_password
    - secretKey: REFERRAL_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: referral_db_url
    - secretKey: REFERRAL_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: referral_db_username
    - secretKey: REFERRAL_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: referral_db_password
    - secretKey: SUPPORT_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: support_db_url
    - secretKey: SUPPORT_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: support_db_username
    - secretKey: SUPPORT_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: support_db_password
    # Fleet completion (P2): realtime / personalization / growth. Their
    # deployments consume the credentials via POSTGRES_USER/POSTGRES_PASSWORD
    # (the three compose the JDBC URL from generic POSTGRES_* vars in
    # application.yml); the *_DB_URL counterparts complete the per-service
    # triple so a later switch to URL wiring is a deployment edit only, and so
    # creationPolicy: Owner does not strip them.
    - secretKey: REALTIME_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_url
    - secretKey: REALTIME_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_username
    - secretKey: REALTIME_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_password
    - secretKey: PERSONALIZATION_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_url
    - secretKey: PERSONALIZATION_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_username
    - secretKey: PERSONALIZATION_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_password
    - secretKey: GROWTH_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_url
    - secretKey: GROWTH_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_username
    - secretKey: GROWTH_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_password
    # -------------------------------------------------------------------------
    # P2 fleet completion (realtime/personalization/growth): per-service DB
    # credentials. The deployments read them via POSTGRES_USER/
    # POSTGRES_PASSWORD secretKeyRef — without these mappings they would
    # vanish on first sync (creationPolicy: Owner replaces the target).
    # -------------------------------------------------------------------------
    - secretKey: REALTIME_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_username
    - secretKey: REALTIME_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_password
    - secretKey: PERSONALIZATION_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_username
    - secretKey: PERSONALIZATION_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_password
    - secretKey: GROWTH_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_username
    - secretKey: GROWTH_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_password
    # -------------------------------------------------------------------------
    # P2 in-cluster TLS: Redpanda SASL superuser (k8s/components/tls-internal
    # bootstrap Job; see k8s/README-TLS.md for the flip order). New Vault
    # path — provision bhukkad/prod/redpanda before including the component.
    # -------------------------------------------------------------------------
    - secretKey: REDPANDA_SUPERUSER_USERNAME
      remoteRef:
        key: bhukkad/prod/redpanda
        property: superuser_username
    - secretKey: REDPANDA_SUPERUSER_PASSWORD
      remoteRef:
        key: bhukkad/prod/redpanda
        property: superuser_password
    # -------------------------------------------------------------------------
    # W3-RESTRUCTURE completion pass (R-01): with the static secrets.yaml dropped
    # from the base build, this ExternalSecret is the SINGLE owner of
    # bhukkad-secrets. The entries below close the gaps that would otherwise
    # break on first sync (creationPolicy: Owner replaces the whole target):
    #   * IDENTITY_DB_* / SEARCH_DB_* — referenced by k8s/identity and k8s/search
    #     deployments but previously defined in NO manifest (latent boot bug);
    #   * POSTGRES_REPLICATION_PASSWORD — consumed by the primary/replica
    #     StatefulSet pair for WAL streaming.
    # Every key referenced by any deployment via secretKeyRef must appear above
    # or below, or it will vanish on sync.
    # -------------------------------------------------------------------------
    - secretKey: IDENTITY_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: identity_db_url
    - secretKey: IDENTITY_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: identity_db_username
    - secretKey: IDENTITY_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: identity_db_password
    - secretKey: SEARCH_DB_URL
      remoteRef:
        key: bhukkad/prod/database
        property: search_db_url
    - secretKey: SEARCH_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: search_db_username
    - secretKey: SEARCH_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: search_db_password
    - secretKey: POSTGRES_REPLICATION_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: postgres_replication_password
    # -------------------------------------------------------------------------
    # P2 fleet completion: realtime/personalization/growth per-service DB
    # credentials — consumed by k8s/realtime, k8s/personalization and
    # k8s/growth deployments as POSTGRES_USER / POSTGRES_PASSWORD (those
    # services compose the JDBC URL from POSTGRES_HOST/PORT/DB themselves).
    # -------------------------------------------------------------------------
    - secretKey: REALTIME_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_username
    - secretKey: REALTIME_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: realtime_db_password
    - secretKey: PERSONALIZATION_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_username
    - secretKey: PERSONALIZATION_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: personalization_db_password
    - secretKey: GROWTH_DB_USERNAME
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_username
    - secretKey: GROWTH_DB_PASSWORD
      remoteRef:
        key: bhukkad/prod/database
        property: growth_db_password
    # Redpanda SASL superuser password — components/tls SASL bootstrap
    # (rpk acl user create) and the commented-ready kafka-exporter client
    # auth. Referenced via secretKeyRef only after the TLS flip.
    - secretKey: REDPANDA_SUPERUSER_PASSWORD
      remoteRef:
        key: bhukkad/prod/redpanda
        property: superuser_password
    # -------------------------------------------------------------------------
    # Off-site backup (roadmap #15): S3 object-store credentials for the
    # bhukkad-backup CronJob's `aws s3 cp` uploads. S3_BUCKET itself is
    # non-secret and lives in bhukkad-config (see k8s/backup-cronjob.yaml).
    # -------------------------------------------------------------------------
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: bhukkad/prod/backup
        property: aws_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: bhukkad/prod/backup
        property: aws_secret_access_key
    # WAL-G object-store target for PITR (walg-archive sidecar + nightly base
    # backup; k8s/docs/RUNBOOK-PITR.md). Same bhukkad/prod/backup Vault entry
    # as the AWS pair above.
    - secretKey: WALG_S3_PREFIX
      remoteRef:
        key: bhukkad/prod/backup
        property: walg_s3_prefix
