apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bhukkad

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - mysql/pv.yaml
  - mysql/pvc.yaml
  - mysql/deployment.yaml
  - mysql/service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/hpa.yaml
  - nginx/configmap.yaml
  - nginx/deployment.yaml
  - nginx/service.yaml
  - ingress.yaml

commonLabels:
  managed-by: kustomize
  project: bhukkad