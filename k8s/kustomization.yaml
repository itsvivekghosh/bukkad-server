apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bhukkad

resources:
  - namespace.yaml
  - configmap.yaml
  # ---------------------------------------------------------------------------
  # R-01 secret race resolution (audit G-12/R-01): `secrets.yaml` is DELIBERATELY
  # not part of the base. It declared a static `bhukkad-secrets` Secret while
  # `external-secret.yaml` syncs the SAME secret name with `creationPolicy:
  # Owner`, so every ExternalSecret reconcile deleted/replaced the static keys —
  # two owners for one secret = guaranteed drift. The Vault-backed ExternalSecret
  # is now the SINGLE owner of bhukkad-secrets; every key referenced by any
  # deployment is mapped in external-secret.yaml (including the previously
  # missing IDENTITY_DB_*/SEARCH_DB_* keys the deployments already referenced).
  # The placeholder secrets.yaml stays on disk for the Vault-less minikube
  # overlay (k8s/overlays/minikube) only — never apply it to a shared cluster.
  # ---------------------------------------------------------------------------
  - secret-store.yaml
  - external-secret.yaml
  - postgres/pvc.yaml
  - postgres/configmap.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  # P8 read scale-out: read-replica StatefulSet + Service (streams from the
  # primary via the `repl` role; read-only workloads route here).
  - postgres/read-replica.yaml
  # P8 connection pooler: pgbouncer caps per-app Hikari sockets to the primary.
  - pgbouncer/deployment.yaml
  - pgbouncer/service.yaml
  - redis/configmap.yaml
  - redis/pvc.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  # Redis Sentinel — enabled: the sentinel manifest now supports password auth
  # (sentinel auth-pass via REDIS_PASSWORD secret) so the three-replica sentinel
  # deployment can monitor the password-protected master. Requires the
  # bhukkad-redis service and redis-sentinel ConfigMap/deployment to be present.
  - redis/redis-sentinel.yaml
  # RabbitMQ removed (W3-RESTRUCTURE, SPOF #8): the STOMP relay was retired with
  # the monolith — services publish over the transactional outbox to Kafka/
  # Redpanda (docs/event-catalog.md) and stream via the realtime service + SSE.
  # k8s/rabbitmq/ was deleted; STOMP_BROKER_TYPE stays "simple" in configmap.yaml.
  # Survey service (P2).
  - survey/deployment.yaml
  - survey/service.yaml
  - survey/pdb.yaml
  - survey/hpa.yaml
  - referral/deployment.yaml
  - referral/service.yaml
  - referral/pdb.yaml
  - referral/hpa.yaml
  - supportticket/deployment.yaml
  - supportticket/service.yaml
  - supportticket/pdb.yaml
  - supportticket/hpa.yaml
  - restaurant/deployment.yaml
  - restaurant/service.yaml
  - restaurant/pdb.yaml
  - restaurant/hpa.yaml
  - identity/deployment.yaml
  - identity/service.yaml
  - identity/pdb.yaml
  - identity/hpa.yaml
  - order/deployment.yaml
  - order/service.yaml
  - order/pdb.yaml
  - order/hpa.yaml
  - payment/deployment.yaml
  - payment/service.yaml
  - payment/pdb.yaml
  - payment/hpa.yaml
  - delivery/deployment.yaml
  - delivery/service.yaml
  - delivery/pdb.yaml
  - delivery/hpa.yaml
  - notification/deployment.yaml
  - notification/service.yaml
  - notification/pdb.yaml
  - notification/hpa.yaml
  - search/deployment.yaml
  - search/service.yaml
  - search/pdb.yaml
  - search/hpa.yaml
  - admin-analytics/deployment.yaml
  - admin-analytics/service.yaml
  - admin-analytics/pdb.yaml
  - admin-analytics/hpa.yaml
  # P2 fleet completion: realtime (SSE relay, port 8077), personalization
  # (8088) and growth (8089) — modeled on the survey base.
  - realtime/deployment.yaml
  - realtime/service.yaml
  - realtime/pdb.yaml
  - realtime/hpa.yaml
  - personalization/deployment.yaml
  - personalization/service.yaml
  - personalization/pdb.yaml
  - personalization/hpa.yaml
  - growth/deployment.yaml
  - growth/service.yaml
  - growth/pdb.yaml
  - growth/hpa.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  - gateway/pdb.yaml
  - gateway/hpa.yaml
  # Logging: FluentBit DaemonSet tails /var/log/containers and ships to Loki at
  # ${LOKI_HOST} (wired via the DaemonSet env; k8s/logging/).
  - logging/fluent-bit-configmap.yaml
  - logging/fluent-bit-rbac.yaml
  - logging/fluent-bit-daemonset.yaml
  - nginx/configmap.yaml
  - nginx/deployment.yaml
  - nginx/service.yaml
  - ingress.yaml
  - backup-scripts.yaml
  - backup-pvc.yaml
  - backup-cronjob.yaml
  # Roadmap #14 observability: fleet ServiceMonitor (scrapes every service's
  # /actuator/prometheus) + the actionable PrometheusRule alert set. Both are
  # Prometheus-Operator CRDs — they only take effect where the operator (and
  # the release: bhukkad-prometheus rule selector) is present.
  - monitoring/service-monitors.yaml
  - monitoring/prometheus-rules.yaml
  # P2 Kafka consumer-lag: DLT + consumer-group lag alerts. Metric source is
  # the kafka-exporter component below — remove BOTH together (G-2: no inert
  # safety devices). The exporter also makes MoneyTopicDltLag /
  # KafkaConsumerLagHigh (above) live.
  - monitoring/kafka-lag-rules.yaml

# ---------------------------------------------------------------------------
# FLAG: in-cluster TLS (P2) — OFF by default. To enable, add the line below
# to the `components:` list at the bottom of this file (next to the redpanda
# component). The TLS stack builds: cert-manager internal CA + leaf certs for
# postgres/redpanda/redis/nginx, a TLS Kafka listener on redpanda:9095
# (plaintext :9092 stays up), the nginx 443 secondary router, and the
# client-side flip (DB_SSL_ENABLED=true + sslmode JDBC URLs). Breaking steps
# (redis TLS-only, SASL enforcement, 80→443 redirect) are sequenced in
# k8s/README-TLS.md. PREREQUISITES: cert-manager installed; Vault
# bhukkad/prod/redpanda provisioned (superuser); follow README-TLS in order.
#
#   components:
#     - components/redpanda
#     - components/tls-internal     # ← uncomment this line to enable TLS
#
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Feature flag: Redpanda (Kafka API) cluster — SPOF #8 bring-up.
#
# k8s/components/redpanda is a kustomize COMPONENT (not a base resource), so it
# is toggled by exactly one line: present here = the 3-broker cluster + headless
# Service + topics-init Job (seeded from docs/event-catalog.md, including the
# .dlt dead-letter topics) ships with every base build; remove the line to build
# a Kafka-free stack. The dev docker-compose stack (services/docker/
# docker-compose.dev.yml) is unchanged and remains the default local path — it
# runs its own single-node redpanda container behind EVENTS_EXTERNAL_ENABLED.
#
# NOTE: consumers stay off until ops flips APP_EVENTS_EXTERNAL_ENABLED=true in
# configmap.yaml per service (KAFKA_BOOTSTRAP_SERVERS below already points at
# the headless Service). Deploying the broker first is safe: an unused broker
# produces no alerts and no consumer lag.
# ---------------------------------------------------------------------------
components:
  - components/redpanda
  # P2 Kafka consumer-lag exporter + ServiceMonitor (alerts live in
  # monitoring/kafka-lag-rules.yaml, registered above). Toggle TOGETHER with
  # that rules file. Connects to PLAINTEXT :9092 — unchanged when the
  # tls-internal component is enabled.
  - components/kafka-exporter

labels:
  - includeSelectors: true
    pairs:
      managed-by: kustomize
      project: bhukkad
