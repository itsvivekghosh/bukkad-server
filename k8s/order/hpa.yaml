apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhukkad-order-hpa
  namespace: bhukkad
  labels:
    app: bhukkad
    component: order
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhukkad-order
  minReplicas: 10
  maxReplicas: 50
  metrics:
    # CPU only in base HPA — memory is unreliable for JVM heap (heap ≠ RSS).
    # Custom metrics overlay adds request-rate and DB connection queue depth.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Pods
      pods:
        metric:
          name: http_server_requests_seconds_count
        target:
          type: AverageValue
          averageValue: 800
    - type: External
      external:
        metric:
          name: hikaricp_connections_pending
        target:
          type: AverageValue
          averageValue: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
