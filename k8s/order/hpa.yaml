apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhukkad-order-hpa
  namespace: bhukkad
  labels:
    app: bhukkad
    component: order
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhukkad-order
  minReplicas: 3
  maxReplicas: 12
  metrics:
    # CPU only in base HPA — memory is unreliable for JVM heap (heap ≠ RSS).
    # Custom metrics overlay (k8s/overlays/custom-metrics-hpa) adds request-rate
    # and token-verify throughput via prometheus-adapter.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
