apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: bhukkad
spec:
  selector:
    matchLabels:
      app: bhukkad
      component: fluent-bit
  template:
    metadata:
      labels:
        app: bhukkad
        component: fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1.5
          ports:
            - containerPort: 2020
              name: metrics
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
