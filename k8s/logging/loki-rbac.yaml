apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-rbac
  namespace: bhukkad
  labels:
    app: bhukkad
    component: logging
data:
  rbac.yaml: |
    # Loki RBAC configuration
    # Maps service accounts to log query permissions per namespace/service
    roles:
      - name: service-reader
        permissions:
          - actions:
              - "logs:read"
            resources:
              - type: "service"
                pattern: "{service=~\"social|order|payment|restaurant|delivery|notification|search|supportticket|survey|referral|realtime|personalization|growth|identity|admin-analytics|gateway\"}"
      - name: admin
        permissions:
          - actions:
              - "logs:read"
              - "logs:write"
              - "rules:read"
              - "rules:write"
            resources:
              - type: "namespace"
                pattern: "bhukkad"

    role_bindings:
      - name: service-accounts
        role: service-reader
        subjects:
          - kind: ServiceAccount
            name: default
            namespace: bhukkad
      - name: admins
        role: admin
        subjects:
          - kind: ServiceAccount
            name: admin
            namespace: bhukkad
