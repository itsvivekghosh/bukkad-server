apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: bhukkad
  labels:
    app: bhukkad
    component: logging
data:
  alerting-rules.yaml: |
    groups:
      - name: bhukkad-logs
        rules:
          - alert: HighErrorRate
            expr: sum(rate({service=~"social|order|payment"} |= "ERROR" [5m])) > 10
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High error rate in {{ $labels.service }}"
              description: "{{ $labels.service }} is producing more than 10 errors per minute"

          - alert: CircuitBreakerOpen
            expr: {service=~".+"} |~ "CIRCUIT_BREAKER.*to=OPEN"
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Circuit breaker OPEN in {{ $labels.service }}"
              description: "Circuit breaker in {{ $labels.service }} has been OPEN for more than 1 minute"

          - alert: ServiceDown
            expr: absent({service=~".+"} |~ "SERVICE_STARTED")
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.service }} not reporting"
              description: "No SERVICE_STARTED logs from {{ $labels.service }} for more than 5 minutes"

          - alert: DatabaseDown
            expr: {service=~".+"} |~ "HEALTH_CHECK.*database=FAIL"
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Database health check failing in {{ $labels.service }}"
              description: "Database probe failed in {{ $labels.service }}"

          - alert: RedisDown
            expr: {service=~".+"} |~ "HEALTH_CHECK.*redis=FAIL"
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Redis health check failing in {{ $labels.service }}"

          - alert: KafkaDown
            expr: {service=~".+"} |~ "HEALTH_CHECK.*kafka=FAIL"
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Kafka health check failing in {{ $labels.service }}"

          - alert: HighLatency
            expr: sum(rate({service=~".+"} |~ "HTTP \\| status=200 .* durationMs=[5-9][0-9]{2,}" [5m])) > 20
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High latency detected in {{ $labels.service }}"
              description: "More than 20 requests per minute with latency >500ms"

          - alert: PaymentFailureSpike
            expr: sum(rate({service=~"order|payment"} |~ "AUDIT.*type=PAYMENT.*status=FAILED" [5m])) > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Payment failure spike in {{ $labels.service }}"

          - alert: TrafficDrop
            expr: sum(rate({service=~".+"} |~ "HTTP \\|" [5m])) < 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Traffic drop in {{ $labels.service }}"
              description: "{{ $labels.service }} has less than 1 request per minute for 5 minutes"

          - alert: High5xxRate
            expr: sum(rate({service=~".+"} |~ "HTTP \\| status=5[0-9]{2}" [5m])) > 5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx rate in {{ $labels.service }}"
              description: "{{ $labels.service }} is returning more than 5 server errors per minute"

          - alert: KafkaConsumerLag
            expr: sum(rate({service=~".+"} |~ "KAFKA_LAG .* lag=[1-9][0-9]{3,}" [5m])) > 0
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag detected"
              description: "Consumer lag exceeds 1000 messages for more than 3 minutes"

          - alert: NovelErrorPattern
            expr: count_over_time({service=~".+"} |~ "UNHANDLED_EXCEPTION" [1h]) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Novel error pattern detected in {{ $labels.service }}"
              description: "{{ $labels.service }} has more than 10 unhandled exceptions in the last hour"
