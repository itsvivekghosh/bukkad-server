apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: logging
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    ingester:
      lifecycler:
        address: 127.0.0.1:7946
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 1h
      max_chunk_age: 1h

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage:
      filesystem:
        directory: /loki

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_query_series: 1000
      max_query_lookback: 30d
      per_series_retention:
        - selector: '{namespace_name="bhukkad", service=~"social|order|payment"}'
          retention_period: 720h  # 30 days for core services
        - selector: '{namespace_name="bhukkad"}'
          retention_period: 168h  # 7 days for all other services

    ruler:
      storage:
        type: local
        local:
          directory: /etc/loki/alerting-rules
      rule_path: /etc/loki/alerting-rules
      ring:
        kvstore:
          store: inmemory
      api_url: http://localhost:3100

    # RBAC/multi-tenancy configuration
    auth:
      enabled: false  # Set to true with proper TLS in production
      type: oidc  # OIDC for production identity provider integration
      oidc:
        issuer_url: ${LOKI_OIDC_ISSUER_URL:-}
        client_id: ${LOKI_OIDC_CLIENT_ID:-}
        client_secret: ${LOKI_OIDC_CLIENT_SECRET:-}
        scopes:
          - openid
          - profile
          - email
        redirect_url: https://loki.bhukkad.com/oauth2/callback
        tls:
          ca_file: /etc/loki/tls/ca.crt
          cert_file: /etc/loki/tls/tls.crt
          key_file: /etc/loki/tls/tls.key
        # Map OIDC claims to Loki roles
        claim_mapping:
          groups: groups
          user: email
      tls:
        min_version: TLS13
        cipher_suites:
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    rbac:
      enabled: false  # Set to true with proper identity provider in production
      config_file: /etc/loki/rbac/rbac.yaml
