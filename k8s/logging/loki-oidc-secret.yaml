apiVersion: v1
kind: Secret
metadata:
  name: loki-oidc-secret
  namespace: bhukkad
  labels:
    app: bhukkad
    component: logging
type: Opaque
stringData:
  issuer_url: "https://auth.bhukkad.com"
  client_id: "loki"
  client_secret: "REPLACE_WITH_REAL_SECRET"
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_TLS_CERT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_REAL_TLS_KEY
    -----END PRIVATE KEY-----
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_CA_CERT
    -----END CERTIFICATE-----
