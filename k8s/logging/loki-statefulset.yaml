apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: bhukkad
spec:
  replicas: 3
  serviceName: loki-headless
  selector:
    matchLabels:
      app: bhukkad
      component: loki
  template:
    metadata:
      labels:
        app: bhukkad
        component: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.2.1
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9095
              name: grpc
          env:
            - name: LOKI_OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: loki-oidc-secret
                  key: issuer_url
            - name: LOKI_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: loki-oidc-secret
                  key: client_id
            - name: LOKI_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: loki-oidc-secret
                  key: client_secret
          volumeMounts:
            - name: loki-data
              mountPath: /loki
            - name: loki-alerting-rules
              mountPath: /etc/loki/alerting-rules
            - name: loki-rbac
              mountPath: /etc/loki/rbac
            - name: loki-tls
              mountPath: /etc/loki/tls
              readOnly: true
          args:
            - -config.file=/etc/loki/config.yaml
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-alerting-rules
          configMap:
            name: loki-alerting-rules
        - name: loki-rbac
          configMap:
            name: loki-rbac
        - name: loki-tls
          secret:
            secretName: loki-oidc-secret
  volumeClaimTemplates:
    - metadata:
        name: loki-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
