apiVersion: v1
kind: ServiceAccount
metadata:
  name: bhukkad-fluent-bit
  namespace: bhukkad
  labels:
    app: bhukkad
    component: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bhukkad-fluent-bit-read
  labels:
    app: bhukkad
    component: logging
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bhukkad-fluent-bit-read
  labels:
    app: bhukkad
    component: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bhukkad-fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: bhukkad-fluent-bit
    namespace: bhukkad
