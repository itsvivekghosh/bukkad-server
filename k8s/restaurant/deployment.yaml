apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-restaurant
  namespace: bhukkad
  labels:
    app: bhukkad
    component: restaurant
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: restaurant
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: restaurant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8091"
    spec:
      serviceAccountName: bhukkad-app
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: bhukkad-restaurant
          image: ghcr.io/bhukkad/restaurant:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
              name: http
          envFrom:
            - configMapRef:
                name: bhukkad-config
          env:
            - name: WAIT_FOR_SERVICES
              value: "false"
            - name: HEALTH_PATH
              value: /api/v1/health/ping
            - name: RESTAURANT_DB_URL
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: RESTAURANT_DB_URL
            - name: RESTAURANT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: RESTAURANT_DB_USERNAME
            - name: RESTAURANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: RESTAURANT_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_SECRET
            # P-09 JVM<->container contract: Guaranteed QoS (memory
            # requests==limits), CPU requests with NO limit (a limit throttles
            # GC threads), and the canonical -XX flag set (perf guide §4.1).
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+ExitOnOutOfMemoryError
                -XX:+UseStringDeduplication
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: 750m
              memory: 1024Mi
            limits:
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
