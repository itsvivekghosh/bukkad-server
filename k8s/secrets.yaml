apiVersion: v1
kind: Secret
metadata:
  name: bhukkad-secrets
  namespace: bhukkad
  labels:
    app: bhukkad
type: Opaque
# ---------------------------------------------------------------------------
# SECRETS PLACEHOLDERS — DO NOT PUT REAL SECRETS IN THIS FILE.
#
# This manifest is committed to version control, so every value below is a
# non-functional placeholder. A cluster provisioned from this file is NOT
# production-safe: the app's SecretValidationConfig (prod/staging profiles)
# rejects the placeholder JWT_SECRET and refuses to boot, and any downstream
# service that connects with a placeholder password will fail to authenticate.
#
# Provision real secrets OUT-OF-BAND before applying this stack:
#
#   kubectl create secret generic bhukkad-secrets --namespace bhukkad \
#     --from-literal=DB_USERNAME=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=JWT_SECRET=<base64, >=512 bits> \
#     ...
#
# Or use the ExternalSecrets operator path (k8s/external-secret.yaml, backed by
# Vault) which is the intended production mechanism. Never edit the values
# below and commit real credentials.
# ---------------------------------------------------------------------------
stringData:
  DB_USERNAME: "CHANGE_ME_DB_USERNAME"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  JWT_EXPIRATION: "3600000"
  JWT_REFRESH_EXPIRATION: "86400000"

  # RabbitMQ credentials.
  # Consumed by k8s/rabbitmq/deployment.yaml (RABBITMQ_DEFAULT_USER/PASS) so the
  # broker's default user matches what the app uses for the STOMP relay.
  # RabbitMQ is NOT used as an AMQP broker here (RabbitAutoConfiguration is
  # excluded in application.yml); it only backs the STOMP relay on port 61613.
  RABBITMQ_USERNAME: "CHANGE_ME_RABBITMQ_USERNAME"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"

  # PostgreSQL replication credentials — the replica StatefulSet uses these to
  # authenticate with the primary for WAL streaming.
  POSTGRES_REPLICATION_PASSWORD: "CHANGE_ME_POSTGRES_REPLICATION_PASSWORD"
