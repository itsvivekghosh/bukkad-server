apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-realtime
  namespace: bhukkad
  labels:
    app: bhukkad
    component: realtime
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: realtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: realtime
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8077"
    spec:
      serviceAccountName: bhukkad-app
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: bhukkad-realtime
          image: ghcr.io/bhukkad/realtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8077
              name: http
          envFrom:
            - configMapRef:
                name: bhukkad-config
          env:
            - name: SERVER_PORT
              value: "8077"
            - name: WAIT_FOR_SERVICES
              value: "false"
            - name: HEALTH_PATH
              value: /api/v1/health/ping
            # realtime/personalization/growth compose their datasource from the
            # generic POSTGRES_* env vars (application.yml), unlike the older
            # services that read a single <SVC>_DB_URL — so the host/db name
            # are inline non-secret and only the credentials come from
            # bhukkad-secrets. The realtime database itself is provisioned
            # out-of-band like every other service DB (initdb/
            # 00-create-databases.sql lists it for the compose stack).
            - name: POSTGRES_HOST
              value: "bhukkad-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "realtime"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REALTIME_DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REALTIME_DB_PASSWORD
            # The in-cluster Redis runs with requirepass (k8s/redis/
            # deployment.yaml); application.yml maps spring.data.redis
            # WITHOUT a password placeholder, so bind it via relaxed env.
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_SECRET
            # Service-mesh (inter-service) HMAC secret
            # (app.auth.service.jwt-secret) — provisioned in
            # k8s/external-secret.yaml (Vault bhukkad/prod/auth); without the
            # mapping it would vanish on ExternalSecret sync.
            - name: SERVICE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: SERVICE_JWT_SECRET
            # RS256 verification: identity's JWKS via the ClusterIP Service
            # (Service port 80 → targetPort 8081, k8s/identity/service.yaml).
            - name: JWKS_URL
              value: http://bhukkad-identity/.well-known/jwks.json
            # Order-ownership oracle for SSE stream authz (yml default is the
            # compose host:port; k8s Service is port 80 → targetPort 8092).
            - name: ORDER_SERVICE_URL
              value: http://bhukkad-order.bhukkad.svc.cluster.local
            # Events: the Kafka consumer (order.events.v1 → SSE fan-out) is
            # driven by APP_EVENTS_EXTERNAL_ENABLED/_TYPE +
            # KAFKA_BOOTSTRAP_SERVERS from bhukkad-config (enabled fleet-wide
            # since the P0 config audit). order.events.v1(.dlt) are already
            # seeded by the redpanda topics-init Job — no new topics needed.
            # P-09 JVM<->container contract: Guaranteed QoS (memory
            # requests==limits), CPU requests with NO limit (a limit throttles
            # GC threads), and the canonical -XX flag set (perf guide §4.1).
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                -XX:+ExitOnOutOfMemoryError
                -XX:+UseStringDeduplication
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: 750m
              memory: 1024Mi
            limits:
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
