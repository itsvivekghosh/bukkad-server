apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bhukkad-allow-services-to-infra
  namespace: bhukkad
  labels:
    app: bhukkad
spec:
  podSelector:
    matchLabels:
      app: bhukkad
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL via PgBouncer
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bhukkad
          podSelector:
            matchLabels:
              app: bhukkad
              component: pgbouncer
      ports:
        - protocol: TCP
          port: 6432
    # Allow Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bhukkad
          podSelector:
            matchLabels:
              app: bhukkad
              component: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Allow Kafka/Redpanda
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bhukkad
          podSelector:
            matchLabels:
              app: bhukkad
              component: redpanda
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095
    # Allow Prometheus scraping
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # Allow inter-service communication for JWKS, health checks, etc.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bhukkad
          podSelector:
            matchLabels:
              app: bhukkad
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091
        - protocol: TCP
          port: 8092
        - protocol: TCP
          port: 8093
        - protocol: TCP
          port: 8094
        - protocol: TCP
          port: 8077
        - protocol: TCP
          port: 8095
---
