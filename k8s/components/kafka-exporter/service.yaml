apiVersion: v1
kind: Service
metadata:
  name: bhukkad-kafka-exporter
  namespace: bhukkad
  labels:
    app: bhukkad
    component: kafka-exporter
spec:
  type: ClusterIP
  ports:
    - port: 9308
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: bhukkad
    component: kafka-exporter
