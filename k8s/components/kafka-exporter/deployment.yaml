apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-kafka-exporter
  namespace: bhukkad
  labels:
    app: bhukkad
    component: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: kafka-exporter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: kafka-exporter
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # danielqsj/kafka-exporter image runs the binary as nobody (65534).
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: kafka-exporter
          # Canonical kafka_exporter image (source: github.com/danielqsj/kafka_exporter,
          # the repo prometheus-community points at). Pinned to minor.
          image: danielqsj/kafka-exporter:v1.10.0
          imagePullPolicy: IfNotPresent
          args:
            # Same bootstrap set as KAFKA_BOOTSTRAP_SERVERS in configmap.yaml:
            # stable per-broker headless DNS.
            - --kafka.server=redpanda-0.redpanda-headless.bhukkad.svc.cluster.local:9092
            - --kafka.server=redpanda-1.redpanda-headless.bhukkad.svc.cluster.local:9092
            - --kafka.server=redpanda-2.redpanda-headless.bhukkad.svc.cluster.local:9092
            - --web.listen-address=:9308
            # Explicit all-topics/all-groups (defaults, pinned for clarity) —
            # alerts filter by topic regex on the Prometheus side.
            - --topic.filter=.*
            - --group.filter=.*
            # --- TLS/SASL (uncomment during the components/tls flip, see
            # k8s/README-TLS.md; platform must also expose the secret mounts):
            # - --tls.enabled
            # - --tls.ca-file=/etc/kafka-tls/ca.crt
            # - --sasl.enabled
            # - --sasl.mechanism=scram-sha256
            # - --sasl.username=bhukkad-admin
            # password comes via env KAFKA_EXPORTER_SASL_PASSWORD (a --sasl.password
            # flag would leak the secret in `ps`); wire the secretKeyRef below when
            # uncommenting:
            #   env:
            #     - name: KAFKA_EXPORTER_SASL_PASSWORD
            #       valueFrom:
            #         secretKeyRef:
            #           name: bhukkad-secrets
            #           key: REDPANDA_SUPERUSER_PASSWORD
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
