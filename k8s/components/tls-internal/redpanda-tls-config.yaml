# Redpanda TLS listener configuration (applied by the tls-internal component).
# The statefulset patch copies this file into a WRITABLE emptyDir and passes
# it via --config: rpk persists broker config updates to its config file, so
# it must not be mounted read-only straight from the ConfigMap.
#
# Listener semantics: `tls` (lowercase) is the listener NAME — it must match
# the name rpk derives from the TLS:// scheme in --kafka-addr/
# --advertise-kafka-addr (patch-redpanda-statefulset-tls.yaml). The PLAINTEXT
# :9092 listener is kept so the un-migrated fleet keeps working; SASL
# enforcement (enable_sasl) is deliberately NOT set here — it is the final,
# breaking step of the flip order in k8s/README-TLS.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-tls-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redpanda
data:
  redpanda.yaml: |
    redpanda:
      kafka_api:
        - name: plaintext
          address: 0.0.0.0
          port: 9092
        - name: tls
          address: 0.0.0.0
          port: 9095
          tls:
            enabled: true
            require_client_auth: false
            cert_file: /etc/redpanda/certs/tls.crt
            key_file: /etc/redpanda/certs/tls.key
            truststore_file: /etc/redpanda/certs/ca.crt
