# In-cluster TLS (P2, k8s/components/tls): nginx secondary router. Mounted by
# the nginx-deployment patch at /etc/nginx/conf.d/tls-server.conf and pulled
# into the main http{} block via the `include /etc/nginx/conf.d/*.conf;`
# drop-in in k8s/nginx/configmap.yaml.
#
# Port 443 terminates TLS with the cert-manager bhukkad-nginx-tls secret and
# proxies to the SAME upstreams as the 80 server block (shared rate-limit
# zones). The 80 listener is NOT removed here — the 80→443 redirect is flip
# step 6 in k8s/README-TLS.md (change the base server to `return 301
# https://$host$request_uri;` only after clients are confirmed on 443).
apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-nginx-tls-conf
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
data:
  tls-server.conf: |
    # HTTPS secondary router (components/tls) — mirrors the routing of the
    # base 80 server; rate-limit zones are shared from the main http context.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        limit_conn conn_per_ip 50;

        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/v1/health {
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location /api/auth/ {
            limit_req zone=api_auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/orders/ {
            limit_req zone=api_order burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /graphql {
            limit_req zone=api_graphql burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/graphql {
            limit_req zone=api_graphql burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/payments/webhooks/ {
            limit_req zone=api_webhook burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            limit_req zone=ws burst=20 nodelay;
            limit_req_status 429;
            limit_conn conn_per_ip 20;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/ {
            limit_req zone=actuator burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE live streams — no buffering, long timeout (mirrors :80).
        location ~ ^/api/v1/orders/stream/ {
            limit_req zone=api_order burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
            proxy_connect_timeout 30s;
        }

        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;
            proxy_pass http://bhukkad_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        location /swagger-ui {
            return 404 '{"success":false,"message":"Not Found"}';
            add_header Content-Type application/json;
        }

        location /v3/api-docs {
            return 404 '{"success":false,"message":"Not Found"}';
            add_header Content-Type application/json;
        }

        location / {
            return 200 '{"status":"UP","service":"Bhukkad API","version":"1.0.0"}';
            add_header Content-Type application/json;
        }

        error_page 404 = @tls_not_found;
        error_page 429 = @tls_rate_limited;
        error_page 500 502 503 504 = @tls_server_error;

        location @tls_not_found {
            return 404 '{"success":false,"message":"Endpoint not found"}';
            add_header Content-Type application/json;
        }

        location @tls_rate_limited {
            return 429 '{"success":false,"message":"Too many requests. Please slow down."}';
            add_header Content-Type application/json;
            add_header Retry-After 60;
        }

        location @tls_server_error {
            return 503 '{"success":false,"message":"Service temporarily unavailable. Please try again later."}';
            add_header Content-Type application/json;
        }
    }
