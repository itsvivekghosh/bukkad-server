apiVersion: v1
kind: Service
metadata:
  name: bhukkad-kafka-lag-exporter
  namespace: bhukkad
  labels:
    app: bhukkad
    component: kafka-lag-exporter
spec:
  type: ClusterIP
  ports:
    # Port NAME `metrics` matches the bhukkad-infra ServiceMonitor convention
    # (k8s/monitoring/service-monitors.yaml); the fleet monitor (port http)
    # deliberately does NOT pick this exporter up — it is not a Spring app.
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: metrics
  selector:
    app: bhukkad
    component: kafka-lag-exporter
