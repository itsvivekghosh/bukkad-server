apiVersion: monitoring.coreos.com/v1
kind: AlertmanagerConfig
metadata:
  name: bhukkad-alertmanager-config
  namespace: monitoring
spec:
  route:
    group_by: ['alertname', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    receiver: 'default'
    routes:
      - match:
          severity: page
        receiver: 'pagerduty'
        continue: true
      - match:
          severity: warn
        receiver: 'slack'
        continue: false
  receivers:
    - name: 'default'
      emailConfigs:
        - to: 'oncall@bhukkad.com'
          sendResolved: true
    - name: 'pagerduty'
      pagerdutyConfigs:
        - serviceKey: '{{ .Env.PAGERDUTY_KEY }}'
          severity: '{{ .Labels.severity }}'
          details:
            firing: '{{ .CommonAnnotations.summary }}'
            runbook: 'https://runbooks.bhukkad.com/{{ .Labels.alertname }}'
    - name: 'slack'
      slackConfigs:
        - apiURL: '{{ .Env.SLACK_WEBHOOK_URL }}'
          channel: '#bhukkad-alerts'
          sendResolved: true
          title: '{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
          text: '{{ .CommonAnnotations.summary }}'