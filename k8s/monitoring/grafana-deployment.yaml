apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: bhukkad
  labels:
    app: bhukkad
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: monitoring
  template:
    metadata:
      labels:
        app: bhukkad
        component: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: ${GRAFANA_ADMIN_PASSWORD:-admin}
            - name: GF_LOGGING_LEVEL
              value: info
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-dashboards
              mountPath: /etc/grafana/provisioning/dashboards/bhukkad.yaml
              subPath: bhukkad.yaml
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources/loki.yaml
              subPath: loki.yaml
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
