apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bhukkad-slo-alerts
  namespace: bhukkad
spec:
  groups:
    - name: bhukkad.outbox
      rules:
        - alert: OutboxQueueDepth
          expr: sum(outbox_events{status="PENDING"}) > 1000
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Outbox backlog > 1000"

    - name: bhukkad.kafka
      rules:
        - alert: KafkaConsumerLag
          expr: kafka_consumergroup_lag > 1000
          for: 5m
          labels:
            severity: page

    - name: bhukkad.gateway
      rules:
        - alert: GatewayRPS
          expr: rate(gateway_request_total[5m]) > 100000
          for: 5m
          labels:
            severity: info
        - alert: GatewayRouteUnmatched
          expr: rate(gateway_route_unmatched[5m]) > 0
          for: 2m
          labels:
            severity: warn

    - name: bhukkad.db
      rules:
        - alert: HikariConnectionsPending
          expr: hikaricp_connections_pending > 0
          for: 5m
          labels:
            severity: page
        - alert: PgbouncerClientWait
          expr: pgbouncer_client_wait > 10
          for: 5m
          labels:
            severity: warn

    - name: bhukkad.sse
      rules:
        - alert: SSECapacityRejected
          expr: rate(sse_capacity_rejected_total[5m]) > 0
          for: 2m
          labels:
            severity: warn

    - name: bhukkad.circuit
      rules:
        - alert: CircuitBreakerOpen
          expr: circuit_breaker_open == 1
          for: 1m
          labels:
            severity: page
