apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bhukkad-slo-alerts
  namespace: bhukkad
  labels:
    release: bhukkad-prometheus
spec:
  groups:
    - name: bhukkad.outbox
      rules:
        - alert: OutboxQueueDepth
          expr: sum(outbox_events{status="PENDING"}) > 1000
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Outbox backlog > 1000"

    - name: bhukkad.kafka
      rules:
        - alert: KafkaConsumerLag
          expr: kafka_consumergroup_lag > 1000
          for: 5m
          labels:
            severity: page

    - name: bhukkad.gateway
      rules:
        - alert: GatewayRPS
          expr: rate(gateway_request_total[5m]) > 100000
          for: 5m
          labels:
            severity: info
        - alert: GatewayRouteUnmatched
          expr: rate(gateway_route_unmatched[5m]) > 0
          for: 2m
          labels:
            severity: warn

    - name: bhukkad.db
      rules:
        - alert: HikariConnectionsPending
          expr: hikaricp_connections_pending > 0
          for: 5m
          labels:
            severity: page
        - alert: PgbouncerClientWait
          expr: pgbouncer_client_wait > 10
          for: 5m
          labels:
            severity: warn

    - name: bhukkad.sse
      rules:
        - alert: SSECapacityRejected
          expr: rate(sse_capacity_rejected_total[5m]) > 0
          for: 2m
          labels:
            severity: warn

    - name: bhukkad.social.feed
      rules:
        - record: job:feed_requests:rate5m
          expr: rate(social_feed_requests_total[5m])
        - record: job:feed_latency:p95
          expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket[5m])) by (le))
        - record: job:feed_latency:p99
          expr: histogram_quantile(0.99, sum(rate(social_feed_latency_seconds_bucket[5m])) by (le))
        - record: job:feed_errors:rate5m
          expr: rate(social_feed_errors_total[5m])
        - alert: HighFeedLatency
          expr: histogram_quantile(0.95, sum(rate(social_feed_latency_seconds_bucket[5m])) by (le)) > 0.2
          for: 3m
          labels:
            severity: warn
          annotations:
            summary: "Feed p95 latency > 200ms"
        - alert: LowRedisHitRatio
          expr: (rate(social_feed_requests_total[5m]) - rate(social_feed_errors_total[5m])) / rate(social_feed_requests_total[5m]) < 0.8
          for: 5m
          labels:
            severity: warn
          annotations:
            summary: "Feed cache hit ratio < 80%"

    - name: bhukkad.social.like
      rules:
        - record: job:like_requests:rate5m
          expr: rate(social_like_requests_total[5m])
        - record: job:like_latency:p95
          expr: histogram_quantile(0.95, sum(rate(social_like_latency_seconds_bucket[5m])) by (le))

    - name: bhukkad.social.order
      rules:
        - record: job:order_requests:rate5m
          expr: rate(social_order_requests_total[5m])
        - record: job:order_latency:p95
          expr: histogram_quantile(0.95, sum(rate(social_order_latency_seconds_bucket[5m])) by (le))
        - alert: HighOrderErrorRate
          expr: rate(social_order_errors_total[5m]) / rate(social_order_requests_total[5m]) > 0.01
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Order-from-post error rate > 1%"

    - name: bhukkad.circuit
      rules:
        - alert: CircuitBreakerOpen
          expr: circuit_breaker_open == 1
          for: 1m
          labels:
            severity: page

    # Platform-level saturation/latency alerts
    - name: bhukkad.platform.saturation
      rules:
        - alert: PodCPUUsageHigh
          expr: sum(rate(container_cpu_usage_seconds_total{namespace="bhukkad", container!="", container!="POD"}[5m])) by (pod) / sum(container_spec_cpu_quota{namespace="bhukkad", container!="", container!="POD"} / container_spec_cpu_period{namespace="bhukkad", container!="", container!="POD"}) by (pod) > 0.85
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Pod {{ $labels.pod }} CPU usage > 85%"

        - alert: PodMemoryUsageHigh
          expr: (container_memory_working_set_bytes{namespace="bhukkad", container!="", container!="POD"} / container_spec_memory_limit_bytes{namespace="bhukkad", container!="", container!="POD"}) > 0.85
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Pod {{ $labels.pod }} memory usage > 85%"

        - alert: PodRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="bhukkad"}[15m]) > 3
          for: 2m
          labels:
            severity: page
          annotations:
            summary: "Pod {{ $labels.pod }} restarting frequently"

        - alert: HPAAtMaxReplicas
          expr: kube_horizontalpodautoscaler_status_desired_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 10m
          labels:
            severity: warn
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} at max replicas"

    - name: bhukkad.platform.latency
      rules:
        - alert: HighRequestLatency
          expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace="bhukkad"}[5m])) by (le, handler)) > 2
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "p99 latency > 2s for {{ $labels.handler }}"

        - alert: HighErrorRate
          expr: sum(rate(http_server_requests_seconds_count{namespace="bhukkad", status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count{namespace="bhukkad"}[5m])) by (service) > 0.05
          for: 3m
          labels:
            severity: page
          annotations:
            summary: "Error rate > 5% for {{ $labels.service }}"

    # Resource pool saturation alerts (P3-04)
    - name: bhukkad.platform.resources
      rules:
        - alert: HikariPoolExhaustion
          expr: hikaricp_connections_active / hikaricp_connections_max > 0.85
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "HikariCP pool > 85% utilization on {{ $labels.service }}"

        - alert: RedisPoolExhaustion
          expr: lettuce_connections_active / lettuce_connections_max > 0.85
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Redis Lettuce pool > 85% utilization on {{ $labels.service }}"

        - alert: RateLimitRedisBypass
          expr: rate(ratelimit_bypass_redis_error_total[5m]) > 0
          for: 2m
          labels:
            severity: warn
          annotations:
            summary: "Rate limiting falling open due to Redis errors on {{ $labels.bucket }}"

        - alert: JWKSRefreshFailure
          expr: jwks_refresh_outcome{outcome="failure"} == 1
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "JWKS refresh failing — JWT verification may use stale keys"

        - alert: CircuitBreakerOpenExtended
          expr: circuit_breaker_open == 1
          for: 10m
          labels:
            severity: page
          annotations:
            summary: "Circuit breaker OPEN for >10m on {{ $labels.name }}"

        - alert: DLQDepthGrowing
          expr: sum(kafka_consumergroup_lag{topic=~".*dlt.*"}) > 100
          for: 5m
          labels:
            severity: warn
          annotations:
            summary: "Dead letter queue depth growing — poison events accumulating"

        - alert: OutboxPublishingLag
          expr: sum(outbox_events{status="PENDING"} and (outbox_events{status="PENDING"} - outbox_events{status="PENDING"} offset 5m) > 0)
          for: 10m
          labels:
            severity: warn
          annotations:
            summary: "Outbox PENDING events not being published — relay may be stuck"

    # Service-level SLO alerts (P3-04)
    - name: bhukkad.service.slo
      rules:
        - alert: ServiceP99LatencyHigh
          expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace="bhukkad"}[5m])) by (le, service)) > 2
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "p99 latency > 2s for {{ $labels.service }}"

        - alert: ServiceErrorRateHigh
          expr: sum(rate(http_server_requests_seconds_count{namespace="bhukkad", status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count{namespace="bhukkad"}[5m])) by (service) > 0.01
          for: 3m
          labels:
            severity: page
          annotations:
            summary: "Error rate > 1% for {{ $labels.service }}"

        - alert: ServiceAvailabilityLow
          expr: sum(rate(http_server_requests_seconds_count{namespace="bhukkad", status=~"2.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count{namespace="bhukkad"}[5m])) by (service) < 0.99
          for: 5m
          labels:
            severity: page
          annotations:
            summary: "Availability < 99% for {{ $labels.service }}"

    # Cost attribution & capacity planning (architecture-audit.md §3.4).
    # All cost metrics are namespaced under cost_usd{tenant,service,endpoint}
    # and emitted by CostAggregationService (platform-lib).
    - name: bhukkad.cost
      rules:
        # Per-tenant spend per rolling 24h window. Recording rule so the
        # anomaly alert below stays readable and can reuse it.
        - record: cost_usd_per_tenant_day
          expr: sum by (tenant) (increase(cost_usd{namespace="bhukkad"}[1d]))

        - alert: CostUsdPerTenantDayAnomaly
          expr: cost_usd_per_tenant_day > 2 * avg_over_time(cost_usd_per_tenant_day[7d])
          for: 15m
          labels:
            severity: warn
          annotations:
            summary: "Tenant {{ $labels.tenant }} daily cost {{ $value }} USD exceeds 2x its 7d average (cost_usd_per_tenant_day)"
            description: "Rolling 24h cost for tenant {{ $labels.tenant }} is more than twice its 7-day average — possible runaway workload or misattribution. See the 'Bhukkad Cost Attribution & Capacity' Grafana dashboard."

        - alert: TenantCostSpike
          expr: sum by (tenant) (increase(cost_usd{namespace="bhukkad"}[1h])) > 10
          for: 10m
          labels:
            severity: warn
          annotations:
            summary: "Tenant {{ $labels.tenant }} spent more than 10 USD in the last hour ({{ $value }} USD)"