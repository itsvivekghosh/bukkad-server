apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: bhukkad
  labels:
    app: bhukkad
    component: monitoring
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        editable: true
        jsonData:
          maxLines: 1000
