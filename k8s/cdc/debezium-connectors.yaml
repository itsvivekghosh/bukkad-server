apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: debezium-postgres-identity
  namespace: bhukkad
  labels:
    app: bhukkad
    component: cdc
    debezium: "true"
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: bhukkad-postgresql
    database.port: "5432"
    database.user: ${DEBEZIUM_DB_USER}
    database.password: ${DEBEZIUM_DB_PASSWORD}
    database.dbname: identity
    database.server.name: bhukkad.identity
    schema.include.list: public
    table.include.list: public.customers,public.addresses,public.refresh_tokens
    plugin.name: pgoutput
    slot.name: debezium_identity
    slot.drop.on.stop: false
    publication.name: debezium_identity_pub
    publication.autocreate.mode: all
    database.publication.name: debezium_identity_pub
    topic.prefix: bhukkad.identity
    transforms: route
    transforms.route.type: org.apache.kafka.connect.transforms.RegexRouter
    transforms.route.regex: "bhukkad\\.identity\\.(.+)"
    transforms.route.replacement: "bhukkad.identity.events.v1"
    transforms.route.key.regex: "bhukkad\\.identity\\.(.+)"
    transforms.route.key.replacement: "bhukkad.identity.events.v1"
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter.schemas.enable: "false"
    heartbeat.interval.ms: 10000
    heartbeat.topics.prefix: bhukkad.identity.heartbeat
    snapshot.mode: initial
    snapshot.lock.timeout.ms: 10000
    poll.interval.ms: 1000
    max.batch.size: 2048
    max.queue.size: 8192
    provide.transaction.metadata: "true"
    status.storage.topic: bhukkad.connect.status
    config.storage.topic: bhukkad.connect.configs
    offset.storage.topic: bhukkad.connect.offsets
    offset.storage.partitions: 6
    status.storage.partitions: 6
    config.storage.partitions: 6
---
