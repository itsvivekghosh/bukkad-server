apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bhukkad-app-pdb
  namespace: bhukkad
  labels:
    app: bhukkad
    component: api
spec:
  # maxUnavailable:1 allows voluntary disruptions (drain/rollout) when minReplicas=2
  # without deadlock. With RollingUpdate maxUnavailable:0 + maxSurge 25%, rollout
  # still surge-based; PDB only gates voluntary evictions, not rollout.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: bhukkad
      component: api
