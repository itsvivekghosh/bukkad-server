apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-app
  namespace: bhukkad
  labels:
    app: bhukkad
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: api
    spec:
      # Wait for MySQL and Redis before starting app
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL at bhukkad-mysql:3306..."
              COUNTER=0
              MAX=120
              until nc -z bhukkad-mysql 3306; do
                COUNTER=$((COUNTER+1))
                if [ $COUNTER -ge $MAX ]; then
                  echo "MySQL not ready after ${MAX}s. Exiting."
                  exit 1
                fi
                echo "MySQL not ready ($COUNTER/$MAX). Waiting..."
                sleep 3
              done
              echo "MySQL port is open. Waiting 15s for full init..."
              sleep 15
              echo "MySQL is ready!"

        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis at bhukkad-redis:6379..."
              COUNTER=0
              MAX=60
              until nc -z bhukkad-redis 6379; do
                COUNTER=$((COUNTER+1))
                if [ $COUNTER -ge $MAX ]; then
                  echo "Redis not ready after ${MAX}s. Exiting."
                  exit 1
                fi
                echo "Redis not ready ($COUNTER/$MAX). Waiting..."
                sleep 2
              done
              echo "Redis is ready!"

      containers:
        - name: bhukkad-app
          image: bhukkad-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            # ConfigMap values
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: SPRING_PROFILES_ACTIVE
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: SERVER_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_NAME
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: REDIS_PORT
            # Secret values
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_REFRESH_EXPIRATION
            # JVM
            - name: JAVA_OPTS
              value: >-
                -Xms256m
                -Xmx512m
                -XX:+UseG1GC
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          # Startup probe - gives app time to start (up to 5 min)
          startupProbe:
            httpGet:
              path: /api/health/ping
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # Liveness - restart if app hangs
          livenessProbe:
            httpGet:
              path: /api/health/ping
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness - route traffic only when ready
          readinessProbe:
            httpGet:
              path: /api/health/ping
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: app-logs
              mountPath: /app/logs

      volumes:
        - name: app-logs
          emptyDir: {}

      # Graceful shutdown
      terminationGracePeriodSeconds: 30