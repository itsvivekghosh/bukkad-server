apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-app
  namespace: bhukkad
  labels:
    app: bhukkad
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhukkad
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bhukkad
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: bhukkad-app
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: bhukkad
                    component: api
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: api
        # Multi-AZ: spread replicas across availability zones so a single AZ
        # failure does not take down the API (works with a multi-AZ node pool).
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: api
      containers:
        - name: bhukkad-app
          image: bhukkad-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: bhukkad-config
          env:
            - name: WAIT_FOR_SERVICES
              value: "false"
            - name: HEALTH_PATH
              value: /api/v1/health/ping
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: JWT_REFRESH_EXPIRATION
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: RABBITMQ_PASSWORD
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:+UseStringDeduplication
                -XX:MaxGCPauseMillis=200
                -Djava.security.egd=file:/dev/./urandom
          resources:
            requests:
              cpu: 300m
              memory: 640Mi
            limits:
              cpu: "1500m"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /api/v1/health/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app-logs
              mountPath: /app/logs
      volumes:
        - name: app-logs
          emptyDir: {}
