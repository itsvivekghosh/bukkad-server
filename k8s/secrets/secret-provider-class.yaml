apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bhukkad-secrets
  namespace: bhukkad
  labels:
    app: bhukkad
    component: secrets-store-csi
spec:
  provider: aws
  parameters:
    # AWS Secrets Manager objects consumed by the platform (architecture audit
    # §2.3). The AWS provider authenticates through the pod's service account
    # (IRSA) — no static credentials are configured here. Local/floci runs do
    # not mount CSI volumes and keep using env-var fallbacks instead.
    objects: |
      - objectName: bhukkad/prod/jwt-secret
        objectType: secretsmanager
        objectAlias: jwt-secret
      - objectName: bhukkad/prod/db-password
        objectType: secretsmanager
        objectAlias: db-password
    # The driver syncs the mounted files into a Kubernetes Secret so that
    # consumers that cannot read CSI volumes still have a single target. This
    # Secret (bhukkad-csi-secrets) is distinct from bhukkad-secrets, which is
    # owned by the Vault-backed ExternalSecret (k8s/external-secret.yaml) —
    # two controllers must never manage the same Secret name.
    secretObjects:
      - secretName: bhukkad-csi-secrets
        type: Opaque
        data:
          - objectName: jwt-secret
            key: JWT_SECRET
          - objectName: db-password
            key: DB_PASSWORD
