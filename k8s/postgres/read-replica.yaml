apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhukkad-postgresql-read
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-read
spec:
  serviceName: bhukkad-postgresql-read
  replicas: 2
  selector:
    matchLabels:
      app: bhukkad
      component: postgres-read
  template:
    metadata:
      labels:
        app: bhukkad
        component: postgres-read
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: POSTGRES_REPLICATION_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    # Wait for primary to be ready, then set up replication
                    until pg_isready -h bhukkad-postgresql -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do
                      sleep 2
                    done
                    # Create standby.signal to indicate this is a replica
                    touch /var/lib/postgresql/data/pgdata/standby.signal
                    # Configure primary connection info
                    echo "primary_conninfo = 'host=bhukkad-postgresql port=5432 user=repl password=$POSTGRES_REPLICATION_PASSWORD application_name=$HOSTNAME'" >> /etc/postgresql/postgresql.conf
                    echo "hot_standby = on" >> /etc/postgresql/postgresql.conf
                    echo "wal_receiver_status_interval = 10s" >> /etc/postgresql/postgresql.conf
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
      volumes:
        - name: postgres-config
          configMap:
            name: bhukkad-postgres-config
            items:
              - key: postgresql.conf
                path: postgresql.conf
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-postgresql-read
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-read
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: bhukkad
    component: postgres-read