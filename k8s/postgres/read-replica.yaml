apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhukkad-postgresql-read
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-read
spec:
  serviceName: bhukkad-postgresql-read
  replicas: 2
  selector:
    matchLabels:
      app: bhukkad
      component: postgres-read
  template:
    metadata:
      labels:
        app: bhukkad
        component: postgres-read
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: POSTGRES_REPLICATION_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bhukkad
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - bhukkad
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "1500m"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-postgresql-read
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-read
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: bhukkad
    component: postgres-read