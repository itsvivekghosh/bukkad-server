apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-postgresql
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bhukkad
        component: postgres
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        # fsGroup aligns the shared wal-spool emptyDir (and any future TLS
        # key mounts, k8s/README-TLS.md) with the postgres uid/gid (999 in
        # the official image) so the sidecar can read spooled segments. The
        # official postgres entrypoint starts as root and steps down to 999,
        # so no runAsUser override here.
        fsGroup: 999
      initContainers:
        # Copy the wal-g binary from the pinned image into the shared
        # emptyDir so the always-on push loop can run on a tiny pinned
        # busybox image. IMAGE NOTE (documented choice, 2026-09): the wal-g
        # project publishes NO official container image, so we pin the
        # KubeBlocks/ApeCloud build (multi-arch, actively maintained).
        # Supply-chain strict clusters should mirror/rebuild this image per
        # the wal-g release binaries (github.com/wal-g/wal-g/releases).
        - name: wal-g-init
          image: apecloud/wal-g:postgres-1.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp "$(command -v wal-g)" /wal-g-bin/wal-g && chmod 0755 /wal-g-bin/wal-g
          volumeMounts:
            - name: wal-g-bin
              mountPath: /wal-g-bin
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: POSTGRES_REPLICATION_PASSWORD
          args:
            - -c
            - config_file=/etc/postgresql/postgresql.conf
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            # WAL archive spool shared with the wal-g sidecar (see the
            # archive_command in k8s/postgres/configmap.yaml). emptyDir: the
            # spool is transient — un-pushed segments are re-archived from
            # pg_wal after a pod restart; the S3 copy is the durable one.
            - name: wal-spool
              mountPath: /wal-spool
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
        # ---
        # PITR WAL shipper (k8s/README-PITR.md): polls the shared spool for
        # segments deposited by archive_command and uploads them to S3 with
        # `wal-g wal-push`. Upload failures leave the segment in place for
        # retry — the WAL RPO is bounded by the poll interval, the S3
        # freshness is verified nightly by the wal-verify container in
        # k8s/backup-cronjob.yaml.
        - name: wal-g-push
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              SPOOL=/wal-spool/pending
              mkdir -p "${SPOOL}" /wal-spool/done
              echo "[wal-g-push] shipping ${SPOOL} -> ${WALG_S3_PREFIX}"
              while true; do
                for f in "${SPOOL}"/*; do
                  [ -f "${f}" ] || continue
                  seg="$(basename "${f}")"
                  if /wal-g-bin/wal-g wal-push "${f}"; then
                    mv "${f}" "/wal-spool/done/${seg}"
                  else
                    echo "[wal-g-push] wal-push failed for ${seg}; will retry" >&2
                  fi
                done
                sleep 10
              done
          env:
            # WALG_S3_PREFIX is composed from the fleet S3_BUCKET
            # (bhukkad-config) — the same bucket the nightly dump sync uses,
            # under a dedicated WAL prefix. $(S3_BUCKET) is kubelet env
            # expansion and resolves because S3_BUCKET is defined first.
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: S3_BUCKET
            - name: WALG_S3_PREFIX
              value: s3://$(S3_BUCKET)/postgres-wal
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: AWS_REGION
            # Same object-store credentials as the backup CronJob s3-sync
            # container (Vault bhukkad/prod/backup via bhukkad-secrets).
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: AWS_SECRET_ACCESS_KEY
            # Connection info for wal-g commands that query the server.
            - name: PGHOST
              value: localhost
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_USERNAME
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: DB_PASSWORD
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: DB_NAME
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: wal-spool
              mountPath: /wal-spool
            - name: wal-g-bin
              mountPath: /wal-g-bin
              readOnly: true
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: bhukkad-postgres-pvc
        - name: init-sql
          configMap:
            name: bhukkad-postgres-init
            items:
              - key: 01-init.sql
                path: 01-init.sql
        - name: postgres-config
          configMap:
            name: bhukkad-postgres-config
        # Shared WAL archive spool (postgres → wal-g sidecar).
        - name: wal-spool
          emptyDir: {}
        # The wal-g binary, copied out of the pinned wal-g image by the
        # wal-g-init init container so the always-on push loop can run on a
        # tiny pinned busybox image.
        - name: wal-g-bin
          emptyDir: {}
