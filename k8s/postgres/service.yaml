apiVersion: v1
kind: Service
metadata:
  name: bhukkad-postgresql
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: bhukkad
    component: postgres
