apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-postgres-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
data:
  postgresql.conf: |
    # High-traffic sizing for PostgreSQL 16. Buffer cache and WAL sized for a
    # 1-2Gi postgres pod. max_connections=500 supports 10 app pods x 30 Hikari
    # with headroom.
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    work_mem = 16MB
    maintenance_work_mem = 128MB
    max_connections = 500
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    synchronous_commit = off
    log_min_duration_statement = 1000
    log_statement = none
    log_connections = on
    log_disconnections = on
    max_wal_size = 2GB
    min_wal_size = 512MB
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 200

    # ---------------------------------------------------------------------------
    # PITR (roadmap #15 follow-through): continuous WAL archiving.
    #
    # wal_level=replica is the PG16 default and is REQUIRED for archival —
    # stated explicitly so a future tune cannot silently break the chain.
    # archive_mode is postmaster-level: enabling it needs a pod restart
    # (kubectl rollout restart deploy/bhukkad-postgresql), and every base
    # backup MUST be taken AFTER archiving is confirmed working
    # (k8s/docs/RUNBOOK-PITR.md).
    #
    # archive_command stages the segment onto the shared WAL spool volume only —
    # it must NEVER talk to an object store directly (a network hiccup would
    # stall archiving and bloat pg_wal). The wal-g sidecar in
    # k8s/postgres/deployment.yaml drains /wal-spool to the object store
    # (WALG_S3_PREFIX); with an idle drain loop the cp completes instantly and
    # archiving is effectively decoupled from S3 availability. Until real
    # WALG_S3_PREFIX/AWS credentials are provisioned the sidecar drains the
    # spool by DISCARDING segments behind a loud WARN — equivalent to the
    # pre-PITR status quo (pg_wal never bloats, no chain is kept); take the
    # first base backup only AFTER backing-config is live (RUNBOOK-PITR.md).
    # archive_timeout=60s bounds RPO during quiet periods (force-switch WAL
    # so an idle primary still ships a segment every minute worst-case).
    # NOTE: the minikube overlay patch replaces this whole file and keeps
    # archiving OFF (no object store to point at locally).
    # ---------------------------------------------------------------------------
    wal_level = replica
    archive_mode = on
    archive_timeout = 60
    archive_command = 'test ! -f /wal-spool/%f && cp %p /wal-spool/%f'
---
# -----------------------------------------------------------------------------
# PostgreSQL bootstrap, mounted at /docker-entrypoint-initdb.d/01-init.sql.
# The official postgres image creates POSTGRES_DB and POSTGRES_USER first, so
# this only sets up the read-replica user for streaming replication. Schema is
# owned by Flyway at app startup.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-postgres-init
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
data:
  01-init.sql: |
    -- Replication user for the read replica StatefulSet.
    CREATE ROLE repl REPLICATION LOGIN PASSWORD '$POSTGRES_REPLICATION_PASSWORD';
    SELECT 'Database initialized!' AS status;
