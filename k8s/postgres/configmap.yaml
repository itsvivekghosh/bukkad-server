apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-postgres-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
data:
  postgresql.conf: |
    # High-traffic sizing for PostgreSQL 16. Buffer cache and WAL sized for a
    # 1-2Gi postgres pod. max_connections=500 supports 10 app pods x 30 Hikari
    # with headroom.
    shared_buffers = 512MB
    effective_cache_size = 1536MB
    work_mem = 16MB
    maintenance_work_mem = 128MB
    max_connections = 500
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    synchronous_commit = off
    log_min_duration_statement = 1000
    log_statement = none
    log_connections = on
    log_disconnections = on
    max_wal_size = 2GB
    min_wal_size = 512MB
    random_page_cost = 1.1
    effective_io_concurrency = 200
    default_statistics_target = 200

    # --- PITR (WAL archiving, k8s/README-PITR.md) --------------------------
    # wal_level=replica (default) already streams to the read replica; these
    # settings additionally archive every completed WAL segment to a shared
    # emptyDir spool, where the wal-g sidecar (k8s/postgres/deployment.yaml)
    # uploads it to S3 (WALG_S3_PREFIX). Idempotent form: `test -f` returns 0
    # when the segment is already spooled (crash between cp and the archive
    # status update) so archiving never wedges on a retry loop; a FAILED cp
    # (spool full / pod restarting) returns non-zero and PostgreSQL retries —
    # pg_wal then grows, so the nightly wal-verify (k8s/backup-cronjob.yaml)
    # and the S3-freshness guardrails in README-PITR are the tripwires.
    archive_mode = on
    archive_command = 'test -f /wal-spool/pending/%f || cp %p /wal-spool/pending/%f'
    # Force a segment switch every 60s: a quiet primary otherwise waits for a
    # full 16MB segment, stretching the WAL RPO to hours. 60s bounds the
    # archive-upload RPO to roughly the sidecar poll interval + 60s.
    archive_timeout = 60s
---
# -----------------------------------------------------------------------------
# PostgreSQL bootstrap, mounted at /docker-entrypoint-initdb.d/01-init.sql.
# The official postgres image creates POSTGRES_DB and POSTGRES_USER first, so
# this only sets up the read-replica user for streaming replication. Schema is
# owned by Flyway at app startup.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-postgres-init
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres
data:
  01-init.sql: |
    -- Replication user for the read replica StatefulSet.
    CREATE ROLE repl REPLICATION LOGIN PASSWORD '$POSTGRES_REPLICATION_PASSWORD';
    SELECT 'Database initialized!' AS status;
