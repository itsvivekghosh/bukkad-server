apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bhukkad-postgres-failover
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-failover
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bhukkad-postgres-failover
  namespace: bhukkad
  labels:
    app: bhukkad
    component: postgres-failover
subjects:
  - kind: ServiceAccount
    name: bhukkad-postgres-failover
    namespace: bhukkad
roleRef:
  kind: Role
  name: bhukkad-postgres-failover
  apiGroup: rbac.authorization.k8s.io
