apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-redis-sentinel
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
data:
  sentinel.conf: |
    port 26379
    sentinel monitor bhukkad-master bhukkad-redis 6379 2
    sentinel down-after-milliseconds bhukkad-master 5000
    sentinel failover-timeout bhukkad-master 10000
    sentinel parallel-syncs bhukkad-master 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-redis-sentinel
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis-sentinel
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: redis-sentinel
  template:
    metadata:
      labels:
        app: bhukkad
        component: redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7-alpine
          command:
            - sh
            - -c
            - cp /etc/redis/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/redis
      volumes:
        - name: sentinel-config
          configMap:
            name: bhukkad-redis-sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-redis-sentinel
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis-sentinel
spec:
  clusterIP: None
  selector:
    app: bhukkad
    component: redis-sentinel
  ports:
    - port: 26379
      targetPort: 26379
