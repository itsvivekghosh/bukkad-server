apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-redis
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bhukkad
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - /etc/redis/redis.conf
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: bhukkad-redis-pvc
        - name: redis-config
          configMap:
            name: bhukkad-redis-config
