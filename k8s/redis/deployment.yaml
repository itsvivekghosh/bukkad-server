apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bhukkad-redis
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
spec:
  serviceName: bhukkad-redis-headless
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: redis
  template:
    metadata:
      labels:
        app: bhukkad
        component: redis
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: redis
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: redis
      terminationGracePeriodSeconds: 90
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: REDIS_PASSWORD
            - name: TLS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: TLS_ENABLED
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - sh
            - -c
            - |
              TLS_ARGS=""
              if [ "${TLS_ENABLED:-false}" = "true" ]; then
                TLS_ARGS="--tls-port 6380 --tls-cert-file /etc/redis/tls/tls.crt --tls-key-file /etc/redis/tls/tls.key --tls-ca-cert-file /etc/redis/tls/ca.crt --tls-auth-clients no"
              fi
              # First pod (ordinal 0) is master, others are replicas
              if [ "$(echo $POD_NAME | grep -oE '[0-9]+$')" = "0" ]; then
                exec redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD" ${TLS_ARGS}
              else
                exec redis-server /etc/redis/redis.conf --requirepass "$REDIS_PASSWORD" --replicaof bhukkad-redis-0.bhukkad-redis-headless 6379 ${TLS_ARGS}
              fi
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
            - name: tls-cert
              mountPath: /etc/redis/tls
              readOnly: true
      volumes:
        - name: redis-config
          configMap:
            name: bhukkad-redis-config
        - name: tls-cert
          secret:
            secretName: bhukkad-redis-tls
            optional: true
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-redis-headless
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
spec:
  clusterIP: None
  selector:
    app: bhukkad
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-redis
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
spec:
  selector:
    app: bhukkad
    component: redis
  ports:
    - port: 6379
      targetPort: 6379