apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-redis-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 300
    tcp-keepalive 60
    daemonize no
    supervised no
    loglevel notice
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 512mb
    # volatile-lru ensures only keys with TTL are evicted — locks, rate-limit
    # counters and idempotency keys MUST have TTLs (see RedisCacheService +
    # RateLimitService). Using allkeys-lru would evict those and cause duplicate
    # orders / thundering herds under memory pressure.
    maxmemory-policy volatile-lru
    maxmemory-samples 5
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    # Separate logical DBs: 0=cache, 1=locks/rate-limit/idempotency (see
    # application.yml spring.data.redis.database). Eviction only affects DB 0.
    # Requires clients to select DB explicitly; default stays 0 for cache.
    #
    # -----------------------------------------------------------------------
    # TLS (PLACEHOLDER — DO NOT ENABLE HERE; k8s/tls/README-TLS.md).
    # requirepass is injected in k8s/redis/deployment.yaml and the TLS flags
    # ride on the same command line, gated by TLS_ENABLED (default false →
    # this file is served verbatim and only plaintext 6379 answers). What the
    # flip appends there:
    #   --tls-port 6380 --tls-cert-file /etc/redis/tls/tls.crt \
    #   --tls-key-file /etc/redis/tls/tls.key --tls-ca-cert-file /etc/redis/tls/ca.crt \
    #   --tls-auth-clients no
    # Deliberately kept OFF in redis.conf so the optional-Secret mount of a
    # not-yet-issued certificate (cert-manager absent) can never crash redis at
    # parse time on a config-file directive.
    # -----------------------------------------------------------------------
    # port 6379                      # kept during the TLS cutover window only
    # tls-port 6380                  # (or `port 0` + tls-port 6379 when done)
    # tls-cert-file /etc/redis/tls/tls.crt
    # tls-key-file /etc/redis/tls/tls.key
    # tls-ca-cert-file /etc/redis/tls/ca.crt
    # tls-auth-clients no
