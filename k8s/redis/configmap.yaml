apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-redis-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: redis
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    tcp-backlog 511
    timeout 300
    tcp-keepalive 60
    daemonize no
    supervised no
    loglevel notice
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
    maxmemory 512mb
    # volatile-lru ensures only keys with TTL are evicted — locks, rate-limit
    # counters and idempotency keys MUST have TTLs (see RedisCacheService +
    # RateLimitService). Using allkeys-lru would evict those and cause duplicate
    # orders / thundering herds under memory pressure.
    maxmemory-policy volatile-lru
    maxmemory-samples 5
    lazyfree-lazy-eviction yes
    lazyfree-lazy-expire yes
    lazyfree-lazy-server-del yes
    # Separate logical DBs: 0=cache, 1=locks/rate-limit/idempotency (see
    # application.yml spring.data.redis.database). Eviction only affects DB 0.
    # Requires clients to select DB explicitly; default stays 0 for cache.
    # --- TLS (flag-gated, k8s/README-TLS.md) --------------------------------
    # COMMENTED-READY: the tls-internal component mounts the server cert
    # (bhukkad-redis-tls secret at /etc/redis-tls in the redis pod) but the
    # server keeps serving plaintext 6379 until ops flips BOTH sides of the
    # block below (server: uncomment here + rollout restart; clients:
    # SPRING_DATA_REDIS_SSL_ENABLED=true in bhukkad-config). Flipping swaps
    # 6379 from plaintext to TLS in one restart — plan the window with the
    # client flip (RedisCacheService/RateLimitService reconnect with TLS).
    # port 0
    # tls-port 6379
    # tls-cert-file /etc/redis-tls/tls.crt
    # tls-key-file /etc/redis-tls/tls.key
    # tls-ca-cert-file /etc/redis-tls/ca.crt
