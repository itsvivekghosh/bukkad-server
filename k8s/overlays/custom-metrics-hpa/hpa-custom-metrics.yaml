# -----------------------------------------------------------------------------
# Custom-metrics HorizontalPodAutoscaler for the order API Deployment.
#
# This file lives INSIDE the overlay directory on purpose. Kustomize refuses to
# load a bare file that sits outside the kustomization root ("security; file ...
# is not in or below ..."), so the previous location (k8s/app/) could never be
# referenced from here.
#
# REQUIREMENTS: the Pods metrics below are served by the custom.metrics.k8s.io
# API, so a Prometheus Adapter (or equivalent) must be installed and must expose
# the metric names referenced here. Without an adapter the HPA reports
# FailedGetPodsMetric and will not scale on those metrics (CPU still works).
#
# REPLACEMENT SEMANTICS: this overlay reuses the BASE HPA NAME
# `bhukkad-order-hpa` so applying it REPLACES the base autoscaler rather than
# adding a second one. Two HPAs targeting the same Deployment each compute their
# own desired replica count and thrash the ReplicaSet, so only one may own it.
# (Previously this file named itself `bhukkad-app-hpa` and targeted a Deployment
# `bhukkad-app` that does not exist anywhere in the repo, so the overlay was a
# silent no-op.)
#
# maxReplicas is raised 12 -> 20 and the CPU target 65% -> 70% relative to the
# base; the memory target is dropped because scaling a JVM on RSS is unreliable
# (the heap does not shrink), and the request-rate metric is a better load
# signal. A per-pod SSE signal is only useful for services that export
# `sse_connections` (realtime/delivery do; order does not yet), so it is
# intentionally not used here.
# -----------------------------------------------------------------------------
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhukkad-order-hpa
  namespace: bhukkad
  labels:
    app: bhukkad
    component: order
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhukkad-order
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Standard Micrometer HTTP server timer (exported by Boot Actuator for MVC).
    # The Prometheus Adapter must map it to this Pods metric name; adjust the
    # adapter rule (or this name) together, never one side only.
    - type: Pods
      pods:
        metric:
          name: http_server_requests_seconds_count
        target:
          type: AverageValue
          averageValue: "30"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
