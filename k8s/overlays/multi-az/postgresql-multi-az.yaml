apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bhukkad-postgres-multi-az
  namespace: bhukkad
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  replication:
    slots:
      highAvailability:
        enabled: true
    synchronousReplication: true
  replicationSlots:
    highAvailability:
      enabled: true
  bootstrap:
    initdb:
      database: bhukkad
      owner: app
  monitoring:
    enablePodMonitor: true
  affinity:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            postgresql: bhukkad-postgres-multi-az
