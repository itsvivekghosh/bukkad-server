apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Low-memory profile for local minikube (3–4 GB Docker RAM).
# Lists base manifests individually (cannot use `resources: [../../]` — kustomize cycle).
# Usage: kubectl apply -k k8s/overlays/minikube

namespace: bhukkad

resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../secrets.yaml
  - ../../postgres/pvc.yaml
  - ../../postgres/configmap.yaml
  - ../../postgres/deployment.yaml
  - ../../postgres/service.yaml
  - ../../redis/configmap.yaml
  - ../../redis/pvc.yaml
  - ../../redis/deployment.yaml
  - ../../redis/service.yaml
  - ../../app/serviceaccount.yaml
  - ../../logging/fluent-bit-configmap.yaml
  - ../../ingress.yaml

patches:
  - path: patches/postgres-deployment.yaml
  - path: patches/redis-deployment.yaml
  - path: patches/postgres-config.yaml

labels:
  - includeSelectors: true
    pairs:
      managed-by: kustomize
      project: bhukkad
