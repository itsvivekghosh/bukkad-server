apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Low-memory profile for local minikube (3–4 GB Docker RAM).
#
# The overlay reaches ../../ base files by design (see below), so it must be
# built with the relaxed loader — plain `kustomize build` / `kubectl apply -k`
# forbid `../` traversal:
#   kustomize build --load-restrictor LoadRestrictionsNone k8s/overlays/minikube
#
# POST-CONSOLIDATION (16 services → 6): the resource list previously pointed at
# the retired pre-merge service directories (survey/referral/restaurant/order/
# payment/delivery/notification/search/admin-analytics/realtime/
# personalization/growth/supportticket/social) plus redis/pvc.yaml and
# redis/service.yaml, none of which exist — `kustomize build` died with
# "open k8s/redis/pvc.yaml: no such file or directory". It now mirrors the
# base k8s/kustomization.yaml: one Deployment per CONSOLIDATED service
# (identity, commerce, catalog, engagement, admin) + gateway, the infra each
# needs, and the redpanda component. The low-memory postgres/redis patches are
# kept.
#
# The static secrets.yaml is intentionally NOT included — Vault-less minikube
# users create bhukkad-secrets out-of-band (see k8s/secrets.yaml header).
#
# Usage:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/overlays/minikube | kubectl apply -f -

namespace: bhukkad

resources:
  - ../../namespace.yaml
  - ../../configmap.yaml
  - ../../secret-store.yaml
  - ../../external-secret.yaml
  - ../../common/priority-class.yaml
  - ../../postgres/pvc.yaml
  # WAL spool consumed by the postgres pod's walg-archive sidecar — must be
  # present here too (the base deployment references the claim). Minikube keeps
  # archiving effectively OFF: the conf patch has archive_mode=off and the
  # sidecar discard-guard covers the CHANGE_ME WALG_S3_PREFIX placeholder.
  - ../../postgres/pvc-wal-spool.yaml
  - ../../postgres/configmap.yaml
  - ../../postgres/deployment.yaml
  - ../../postgres/service.yaml
  - ../../pgbouncer/deployment.yaml
  - ../../pgbouncer/service.yaml
  - ../../redis/configmap.yaml
  - ../../redis/deployment.yaml
  - ../../redis/redis-sentinel.yaml
  # Consolidated services (post 16→5 merge): identity, commerce (order +
  # payment + delivery), catalog (restaurant + search + personalization),
  # engagement (social + growth + referral + survey + notification + realtime),
  # admin (admin-analytics + support), gateway.
  - ../../identity/deployment.yaml
  - ../../identity/service.yaml
  - ../../commerce/deployment.yaml
  - ../../catalog/deployment.yaml
  - ../../engagement/deployment.yaml
  - ../../admin/deployment.yaml
  - ../../gateway/deployment.yaml
  - ../../gateway/service.yaml
  - ../../logging/fluent-bit-configmap.yaml
  - ../../logging/fluent-bit-rbac.yaml
  - ../../logging/fluent-bit-daemonset.yaml
  - ../../nginx/configmap.yaml
  - ../../nginx/deployment.yaml
  - ../../nginx/service.yaml
  - ../../ingress.yaml

patches:
  - path: patches/postgres-deployment.yaml
  - path: patches/redis-deployment.yaml
  - path: patches/postgres-config.yaml

components:
  - ../../components/redpanda

labels:
  - includeSelectors: true
    pairs:
      managed-by: kustomize
      project: bhukkad
