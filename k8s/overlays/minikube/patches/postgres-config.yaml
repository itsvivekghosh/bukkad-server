apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-postgres-config
  namespace: bhukkad
data:
  postgresql.conf: |
    # Low-memory profile for local minikube (3-4 GB Docker RAM).
    shared_buffers = 128MB
    effective_cache_size = 384MB
    work_mem = 8MB
    maintenance_work_mem = 64MB
    max_connections = 100
    wal_buffers = 4MB
    synchronous_commit = off
    log_min_duration_statement = 2000
    # Minikube ships WITHOUT WAL archiving: the base bhukkad-postgres-config
    # enables archive_mode/archive_command for PITR, but this patch REPLACES
    # the whole file and there is no object store locally. The walg-archive
    # sidecar additionally discards (never crashes) on the CHANGE_ME
    # WALG_S3_PREFIX placeholder — local stacks keep zero backup behavior.
    archive_mode = off
