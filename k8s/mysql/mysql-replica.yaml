apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-mysql-replica
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bhukkad
      component: mysql-replica
  template:
    metadata:
      labels:
        app: bhukkad
        component: mysql-replica
    spec:
      containers:
        - name: mysql-replica
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bhukkad-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: bhukkad-config
                  key: MYSQL_DATABASE
          args:
            - --server-id=2
            - --log-bin=mysql-bin
            - --relay-log=relay-bin
            - --read-only=1
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          volumeMounts:
            - name: mysql-replica-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-replica-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bhukkad-mysql-replica
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql-replica
spec:
  type: ClusterIP
  selector:
    app: bhukkad
    component: mysql-replica
  ports:
    - port: 3306
      targetPort: 3306
