apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-mysql-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-authentication-plugin=mysql_native_password
    # High-traffic sizing: 768M buffer pool for 1-2Gi MySQL pod, 500 conns supports
    # 10 app pods × 20 pool = 200 with 60% headroom (vs previous 200 limit that starved at 500).
    innodb_buffer_pool_size=768M
    innodb_log_file_size=256M
    innodb_flush_log_at_trx_commit=2
    innodb_flush_method=O_DIRECT
    innodb_io_capacity=600
    innodb_io_capacity_max=1200
    max_connections=500
    max_connect_errors=10000
    table_open_cache=800
    tmp_table_size=64M
    max_heap_table_size=64M
    slow_query_log=1
    long_query_time=1
---
# -----------------------------------------------------------------------------
# MySQL bootstrap script, mounted at /docker-entrypoint-initdb.d/init.sql.
#
# This used to live in `bhukkad-config`, which the app Deployment consumes with
# `envFrom`; `init.sql` is not a valid environment variable name, so kubelet
# skipped it and raised an InvalidVariableNames event on every app pod. It now
# lives in its own ConfigMap alongside my.cnf, which is only ever mounted as a
# volume.
#
# The official mysql image runs this AFTER creating MYSQL_USER, so the GRANT
# below resolves.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-mysql-init
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql
data:
  init.sql: |
    SET NAMES utf8mb4;
    SET CHARACTER SET utf8mb4;

    CREATE DATABASE IF NOT EXISTS bhukkad
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    USE bhukkad;

    GRANT ALL PRIVILEGES ON bhukkad.* TO 'bhukkad_user'@'%';
    FLUSH PRIVILEGES;

    -- Replication user for the read replica StatefulSet.
    CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED BY '$MYSQL_REPLICATION_PASSWORD';
    GRANT REPLICATION SLAVE ON *.* TO 'repl'@'%';
    FLUSH PRIVILEGES;

    SELECT 'Database initialized!' AS status;
