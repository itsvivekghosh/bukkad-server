apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-mysql-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-authentication-plugin=mysql_native_password
    innodb_buffer_pool_size=384M
    innodb_log_file_size=128M
    innodb_flush_log_at_trx_commit=2
    innodb_flush_method=O_DIRECT
    innodb_io_capacity=400
    innodb_io_capacity_max=800
    max_connections=200
    table_open_cache=400
    tmp_table_size=64M
    max_heap_table_size=64M
    slow_query_log=1
    long_query_time=2
---
# -----------------------------------------------------------------------------
# MySQL bootstrap script, mounted at /docker-entrypoint-initdb.d/init.sql.
#
# This used to live in `bhukkad-config`, which the app Deployment consumes with
# `envFrom`; `init.sql` is not a valid environment variable name, so kubelet
# skipped it and raised an InvalidVariableNames event on every app pod. It now
# lives in its own ConfigMap alongside my.cnf, which is only ever mounted as a
# volume.
#
# The official mysql image runs this AFTER creating MYSQL_USER, so the GRANT
# below resolves.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-mysql-init
  namespace: bhukkad
  labels:
    app: bhukkad
    component: mysql
data:
  init.sql: |
    SET NAMES utf8mb4;
    SET CHARACTER SET utf8mb4;

    CREATE DATABASE IF NOT EXISTS bhukkad
      CHARACTER SET utf8mb4
      COLLATE utf8mb4_unicode_ci;

    USE bhukkad;

    GRANT ALL PRIVILEGES ON bhukkad.* TO 'bhukkad_user'@'%';
    FLUSH PRIVILEGES;

    SELECT 'Database initialized!' AS status;
