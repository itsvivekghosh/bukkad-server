apiVersion: v1
kind: ConfigMap
metadata:
  name: bhukkad-nginx-config
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/json;
        charset utf-8;
        server_tokens off;

        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time '
                        'trace=$http_x_trace_id';

        access_log /var/log/nginx/access.log main;

        # Performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        keepalive_requests 100;
        types_hash_max_size 2048;
        client_max_body_size 10M;

        # Gzip
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1000;
        gzip_types text/plain
                   text/css
                   text/xml
                   application/json
                   application/javascript
                   application/rss+xml
                   application/atom+xml
                   image/svg+xml;

        # Brotli — better compression than gzip on JSON (~20-30% smaller payloads).
        # Requires the `nginx-module-brotli` dynamic module to be loaded at the
        # nginx level (handled by the ingress controller base image, not here).
        # nginx still negotiates `Accept-Encoding: br` first and falls back to gzip
        # for clients that do not advertise brotli, so this is purely additive.
        brotli on;
        brotli_comp_level 5;
        brotli_min_length 1000;
        brotli_types text/plain
                     text/css
                     text/xml
                     application/json
                     application/javascript
                     application/rss+xml
                     application/atom+xml
                     image/svg+xml;

        # Rate Limiting Zones
        limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
        limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
        limit_req_zone $binary_remote_addr zone=api_order:10m rate=10r/s;
        limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

        # Upstream - App Service
        upstream bhukkad_app {
            least_conn;
            server bhukkad-app:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            # Connection limit per IP
            limit_conn conn_per_ip 50;

            # ==================== Security Headers ====================
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            # Health (no rate limit). Use the versioned path directly.
            location /api/v1/health {
                proxy_pass http://bhukkad_app;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                access_log off;
            }

            # ==================== Auth - Strict Rate Limit ====================
            location /api/auth/ {
                limit_req zone=api_auth burst=10 nodelay;
                limit_req_status 429;

                proxy_pass http://bhukkad_app;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # ==================== Orders - Medium Rate Limit ====================
            location /api/orders/ {
                limit_req zone=api_order burst=20 nodelay;
                limit_req_status 429;

                proxy_pass http://bhukkad_app;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            # ==================== General API - Normal Rate Limit ====================
            location /api/ {
                limit_req zone=api_general burst=50 nodelay;
                limit_req_status 429;

                proxy_pass http://bhukkad_app;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                proxy_set_header Connection "";
                proxy_connect_timeout 30s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
            }

            # ==================== Block Swagger in Production ====================
            location /swagger-ui {
                return 404 '{"success":false,"message":"Not Found"}';
                add_header Content-Type application/json;
            }

            location /v3/api-docs {
                return 404 '{"success":false,"message":"Not Found"}';
                add_header Content-Type application/json;
            }

            # ==================== Root ====================
            location / {
                return 200 '{"status":"UP","service":"Bhukkad API","version":"1.0.0"}';
                add_header Content-Type application/json;
            }

            # ==================== Error Pages ====================
            error_page 404 = @not_found;
            error_page 429 = @rate_limited;
            error_page 500 502 503 504 = @server_error;

            location @not_found {
                return 404 '{"success":false,"message":"Endpoint not found"}';
                add_header Content-Type application/json;
            }

            location @rate_limited {
                return 429 '{"success":false,"message":"Too many requests. Please slow down."}';
                add_header Content-Type application/json;
                add_header Retry-After 60;
            }

            location @server_error {
                return 503 '{"success":false,"message":"Service temporarily unavailable. Please try again later."}';
                add_header Content-Type application/json;
            }
        }
    }