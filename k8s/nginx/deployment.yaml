apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-nginx
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhukkad
      component: nginx
  template:
    metadata:
      labels:
        app: bhukkad
        component: nginx
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Server blocks (bhukkad-api-80.conf + bhukkad-routes.conf; the
            # TLS flag adds bhukkad-api-tls.conf, k8s/components/tls-internal).
            # Filtered via items so nginx.conf itself is not double-loaded.
            - name: nginx-servers
              mountPath: /etc/nginx/bhukkad
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: bhukkad-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        # Server blocks dir — items mirror the *.conf keys that should be
        # included. The tls-internal component's patch appends
        # bhukkad-api-tls.conf here.
        - name: nginx-servers
          configMap:
            name: bhukkad-nginx-config
            items:
              - key: bhukkad-api-80.conf
                path: bhukkad-api-80.conf
              - key: bhukkad-routes.conf
                path: bhukkad-routes.conf