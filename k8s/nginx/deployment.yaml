apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-nginx
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bhukkad
      component: nginx
  template:
    metadata:
      labels:
        app: bhukkad
        component: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: bhukkad-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf