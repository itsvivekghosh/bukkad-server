apiVersion: apps/v1
kind: Deployment
metadata:
  name: bhukkad-nginx
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bhukkad
      component: nginx
  template:
    metadata:
      labels:
        app: bhukkad
        component: nginx
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: nginx
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bhukkad
              component: nginx
      terminationGracePeriodSeconds: 90
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # Server blocks (bhukkad-api-80.conf + bhukkad-routes.conf; the
            # TLS flag adds bhukkad-api-tls.conf, k8s/components/tls-internal).
            # Filtered via items so nginx.conf itself is not double-loaded.
            - name: nginx-servers
              mountPath: /etc/nginx/bhukkad
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1000m"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: bhukkad-nginx-config
            items:
              - key: nginx.conf
                path: nginx.conf
        # Server blocks dir — items mirror the *.conf keys that should be
        # included. The tls-internal component's patch appends
        # bhukkad-api-tls.conf here.
        - name: nginx-servers
          configMap:
            name: bhukkad-nginx-config
            items:
              - key: bhukkad-api-80.conf
                path: bhukkad-api-80.conf
              - key: bhukkad-routes.conf
                path: bhukkad-routes.conf
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bhukkad-nginx-hpa
  namespace: bhukkad
  labels:
    app: bhukkad
    component: nginx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bhukkad-nginx
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max