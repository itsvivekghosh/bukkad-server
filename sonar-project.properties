# SonarQube analysis configuration — Bhukkad services/ reactor (P2 repair).
#
# The monolith this file used to describe (src/ at the repo root) is DEAD and
# deleted; the only buildable code is the 16-module Maven reactor under
# services/ (services/pom.xml). The scanner therefore declares the reactor as
# sonar.modules, one projectBaseDir per module — never the repo root, so no
# dead-monolith path can re-enter analysis.
#
# Usage: SonarSource/sonarqube-scan-action@v8 from the REPOSITORY ROOT (the
# feature-ci sonarqube job). Test + coverage reports come from
#   ./mvnw -B -f services/pom.xml test
# which leaves per-module surefire XML under services/<m>/target/surefire-reports
# and JaCoCo XML under services/<m>/target/site/jacoco/jacoco.xml.
sonar.projectKey=bhukkad-delivery-system
sonar.projectName=Bhukkad Delivery System

# --- Multi-module reactor layout ---------------------------------------------
# Module keys mirror services/pom.xml <modules>; each maps to its sources via
# projectBaseDir below.
sonar.modules=platform-lib,gateway,restaurant,identity,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth

platform-lib.sonar.projectBaseDir=services/platform-lib
gateway.sonar.projectBaseDir=services/gateway
restaurant.sonar.projectBaseDir=services/restaurant
identity.sonar.projectBaseDir=services/identity
order.sonar.projectBaseDir=services/order
payment.sonar.projectBaseDir=services/payment
delivery.sonar.projectBaseDir=services/delivery
notification.sonar.projectBaseDir=services/notification
search.sonar.projectBaseDir=services/search
admin-analytics.sonar.projectBaseDir=services/admin-analytics
survey.sonar.projectBaseDir=services/survey
referral.sonar.projectBaseDir=services/referral
supportticket.sonar.projectBaseDir=services/supportticket
realtime.sonar.projectBaseDir=services/realtime
personalization.sonar.projectBaseDir=services/personalization
growth.sonar.projectBaseDir=services/growth

# Inherited by every module — resolved relative to each module's projectBaseDir.
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports
# Coverage: per-module jacoco XML produced by `mvn -f services/pom.xml test`
# (jacoco-report execution is bound to the test phase in services/pom.xml).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Keep build output and generated code out of analysis for every module.
sonar.exclusions=**/target/**,**/generated-sources/**,**/entity/**,**/dto/**,**/mapper/**,**/config/**,**/db/migration/**,**/protobuf/**
sonar.coverage.exclusions=**/entity/**,**/dto/**,**/config/**,**/mapper/**,**/DbMigration*.*,**/generated/**
# New-code definition: reference branch for the strangler-fig migration —
# the quality gate measures "Coverage on New Code" (target: 100%) against it.
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8
