# SonarQube analysis configuration for bhukkad-delivery-system
# Usage: mvn sonar:sonar (token via SONAR_TOKEN env or -Dsonar.login)
sonar.projectKey=bhukkad-delivery-system
sonar.projectName=Bhukkad Delivery System
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports
# Coverage: jacoco XML produced by `mvn test jacoco:report`
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.exclusions=**/entity/**,**/dto/**,**/mapper/**,**/config/**,**/db/migration/**,**/protobuf/**,target/generated-sources/**
sonar.coverage.exclusions=**/entity/**,**/dto/**,**/config/**,**/mapper/**,**/DbMigration*.*,**/generated/**
# New-code definition: reference branch for the strangler-fig migration —
# the quality gate measures "Coverage on New Code" (target: 100%) against it.
sonar.newCode.referenceBranch=main
sonar.qualitygate.wait=true
sonar.java.source=17
sonar.java.target=17
sonar.sourceEncoding=UTF-8
