# SonarQube (SonarCloud) project configuration
# Server: sonarcloud.io (public repository — free tier)
# Organization: itsvivekghosh (from GitHub org)
# Project key: itsvivekghosh_bhukkad-server

sonar.projectKey=itsvivekghosh_bhukkad-server
sonar.organization=itsvivekghosh
sonar.host.url=https://sonarcloud.io

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo XML coverage report (generated by jacoco-maven-plugin)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions — justified non-testable/generated code only
# DTOs, entities, config properties, generated mappers, and bootstrap are excluded
# from coverage measurement. Business logic (controllers, services, repositories,
# security, validators, utilities) is deliberately kept in scope.
# (Backslash continuations are required — Java properties files do not fold
# indented lines into the previous value without them.)
sonar.coverage.exclusions=\
  src/main/java/com/bhukkad/dto/**,\
  src/main/java/com/bhukkad/entity/**,\
  src/main/java/com/bhukkad/config/*Properties.java,\
  src/main/java/com/bhukkad/config/RestTemplateConfig.java,\
  src/main/java/com/bhukkad/BackendServerApplication.java,\
  src/main/java/com/bhukkad/mapper/*Impl.java

# Exclude generated/test code from analysis
sonar.exclusions=\
  target/**,\
  src/test/**,\
  src/main/java/com/bhukkad/mapper/*Impl.java

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.java.version=17