spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bhukkad}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true&connectTimeout=60000&socketTimeout=60000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadDevPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 5
          max-idle: 3
          min-idle: 1
          max-wait: 3000ms

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  devtools:
    restart:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: always
    include-exception: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    com.bhukkad: DEBUG
    com.bhukkad.security: DEBUG
    com.bhukkad.logging: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    PERFORMANCE: DEBUG
    ORDER: DEBUG
    PAYMENT: DEBUG
    SECURITY: DEBUG
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: WARN
  file:
    name: logs/bhukkad-dev.log

app:
  environment: development
  debug: true
  fraud:
    # Local dev and automated test scripts share one IP; log abuse signals without blocking.
    blocking-enabled: false
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@bhukkad.dev}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
  wallet:
    allow-direct-top-up: true
  monitoring:
    prometheus:
      require-auth: false
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}


# ============================================================
# Actuator
# ============================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true

  info:
    env:
      enabled: true

# ============================================================
# Application Info
# ============================================================

info:
  app:
    name: bhukkad
    version: ${APP_VERSION:1.0.0}
    environment: development
    description: Bhukkad Backend API
