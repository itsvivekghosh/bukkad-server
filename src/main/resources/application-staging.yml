# Staging profile — mirrors production with read replica and quieter SQL logging

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bhukkad}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadStagingPool
      maximum-pool-size: 30
      minimum-idle: 8
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.bhukkad: INFO
  file:
    name: logs/bhukkad-staging.log

app:
  environment: staging
  debug: false
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:true}
  stomp:
    broker:
      type: ${STOMP_BROKER_TYPE:simple}
  events:
    external:
      enabled: ${EXTERNAL_EVENTS_ENABLED:false}
      type: log
  scheduled-orders:
    minimum-lead-minutes: 30
    max-days-ahead: 7
    dispatch-interval-ms: 60000
  settlement:
    commission-percent: 15.0
  monitoring:
    prometheus:
      require-auth: true
  notification:
    enabled: true
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from: ${NOTIFICATION_EMAIL_FROM:noreply@bhukkad.com}
  gift-card:
    notification-email-enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    sender-email: ${NOTIFICATION_EMAIL_FROM:noreply@bhukkad.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
