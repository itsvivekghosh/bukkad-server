spring:
  application:
    name: bhukkad-server

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  profiles:
    active: dev

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Write datasource connection pool. Size from PostgreSQL max_connections ÷ expected
  # pod count with headroom (e.g. 4-core pod × 10 replicas ≈ 300 connections at 30 per pod).
  # Gateway payment calls no longer hold connections here (payment processing
  # runs outside the DB transaction), so the pool serves request concurrency
  # rather than blocking on external I/O. Formula: pods × pool ≤ 0.8 × max_connections.
  datasource:
    hikari:
      pool-name: BhukkadWritePool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  # Redis Configuration — tuned for heavy traffic (100 Tomcat + 24 async + schedulers
  # contending on rate-limit, cache, geo, shedlock, SSE relay).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms
        shutdown-timeout: 200ms
        cluster:
          refresh:
            adaptive: true
          # Redis Cluster — activated when REDIS_CLUSTER_NODES is supplied (e.g.
          # "host1:6379,host2:6379,host3:6379"). When empty, the app uses the
          # single-node host/port above. This lets the fleet scale past 1M keys
          # without code changes.
          nodes: ${REDIS_CLUSTER_NODES:}
          max-redirects: 3

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        type:
          prefer_native_enum_types: false
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    # out-of-order is required for this repo's squash-baseline layout (V1 is the
    # squashed baseline, V62+ are appended), where a DB that was mid-rollout can
    # legitimately apply a later migration before an earlier one. This makes
    # schema evolution NON-reproducible, so production should pin
    # FLYWAY_OUT_OF_ORDER=false once all environments converge, and rely on the
    # ignore-missing-patterns below for the V2–V61 squash gap.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
    baseline-on-migrate: true
    locations: classpath:db/migration-pg
    ignore-migration-patterns: ${FLYWAY_IGNORE_MISSING:*:missing}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: non_null

  # Internationalization: locale is resolved from the Accept-Language header by
  # AcceptHeaderLocaleResolver (see I18nConfig). Bundle lives in
  # src/main/resources/messages*.properties.
  messages:
    basename: messages
    fallback-to-system-locale: false

  # OAuth2 social login (Google / Apple / Facebook). Each provider is enabled
  # only when its client-id env var is set. Registration maps to the existing
  # User entity by verified email; account linking happens in AuthServiceImpl.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:dev-google}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:dev-secret}
            scope: openid,email,profile
          apple:
            client-id: ${OAUTH_APPLE_CLIENT_ID:dev-apple}
            client-secret: ${OAUTH_APPLE_CLIENT_SECRET:dev-secret}
            scope: openid,name,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${OAUTH_FACEBOOK_CLIENT_ID:dev-facebook}
            client-secret: ${OAUTH_FACEBOOK_CLIENT_SECRET:dev-secret}
            scope: email,public_profile
            authorization-grant-type: authorization_code
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token

    # Password hashing: Argon2id is the default (OWASP-recommended, memory-hard).
    # For heavy-traffic pods where CPU is the bottleneck, switch to BCrypt
    # strength 12 by setting PASSWORD_ENCODER_ALGORITHM=bcrypt. The trade-off:
    #   - Argon2id: 64 MiB, 3 iterations — slower but resistant to GPU/ASIC attacks
    #   - BCrypt 12: ~72ms on modern CPU — faster but less resistant to hardware attacks
    # Both schemes are supported simultaneously via DelegatingPasswordEncoder;
    # existing hashes remain valid during algorithm rotation.
    password-encoder:
      algorithm: ${PASSWORD_ENCODER_ALGORITHM:argon2}
      argon2:
        salt-length: 16
        hash-length: 32
        parallelism: 1
        memory-kib: ${ARGON2_MEMORY_KIB:65536}
        iterations: ${ARGON2_ITERATIONS:3}
      bcrypt:
        strength: ${BCRYPT_STRENGTH:12}

    # Authentication result cache: stores successful (email, password) -> user id
    # mappings for a short TTL to avoid repeated BCrypt/Argon2 verification on
    # the same credentials within a session. This trades a small amount of
    # security (password changes don't invalidate the cache immediately) for
    # significant CPU savings under heavy login traffic.
    auth-cache:
      enabled: ${AUTH_CACHE_ENABLED:true}
      maximum-size: ${AUTH_CACHE_MAX_SIZE:10000}
      expire-after-write-seconds: ${AUTH_CACHE_TTL_SECONDS:30}

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  # High-traffic Tomcat tuning: for blocking JPA/MySQL, Tomcat threads must be
  # close to Hikari pool size (ratio 1.5-2×), not 5×. With Hikari 20, Tomcat 100
  # would queue 80 threads on connectionTimeout. Formula: tomcat.max ≈ hikari.max × 2
  # plus headroom for non-DB work (SSE, cache). Queue/backlog protects against SYN flood.
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:80}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:4096}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: 20000
    keep-alive-timeout: 15000
    max-keep-alive-requests: 100
  # HTTP/2 configuration for production (feature #10)
  http2:
    enabled: ${SERVER_HTTP2_ENABLED:false}
  # Response compression — gzip on the application server.
  #
  # Brotli is intentionally not enabled at the Tomcat layer: Tomcat 10.1's built-in
  # `CompressionConfig` only implements `gzip`/`deflate` (it recognises the `br`
  # label but produces no brotli output). Adding brotli4j + a custom response
  # stream wrapper is a non-trivial change for marginal benefit on JSON, because
  # in production nginx terminates compression for this service — see the
  # `brotli on;` block in k8s/nginx/configmap.yaml, where brotli runs at ~20-30%
  # smaller payloads than gzip. The Tomcat gzip block below is the in-cluster
  # fallback for direct-port traffic (e.g. local dev, port-forward debugging).
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

app:
  environment: local
  debug: false
 
  feature-flags:
    flags:
      autocomplete-enabled: true
      search-provider-es: false
      new-checkout-flow: false
    # Percentage-based rollout per flag (0-100). When set, overrides the boolean
    # switch for user-scoped checks (isEnabled(key, userId)).
    rollout:
      new-checkout-flow: 10
  chaos:
    enabled: ${CHAOS_ENABLED:false}
    latency-probability: 0.0
    latency-ms: 0
    failure-probability: 0.0
  async:
    order:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 200
    low:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
  cloud-kitchen:
    kitchen-queue-default-limit: 50
    order-list-default-size: 20
    order-list-max-size: 100
  scheduled-orders:
    minimum-lead-minutes: 30
    max-days-ahead: 7
    dispatch-interval-ms: 60000
  dynamic-pricing:
    min-price: 10.0
    max-surge-percent: 50.0
    max-rules-per-restaurant: 10
  inventory:
    low-stock-threshold: 10
    alert-check-interval-ms: 300000
    stock-reservation:
      enabled: true
      reservation-ttl-seconds: 900
  db:
    materialized-view-refresh-ms: 300000

  commission:
    default-rate: 15.0
    tiers:
      - name: "Bronze"
        min-orders: 0
        max-orders: 100
        commission-percent: 15.0
        description: "Standard commission rate for new restaurants"
      - name: "Silver"
        min-orders: 100
        max-orders: 500
        commission-percent: 12.0
        description: "Discounted rate for restaurants with 100+ orders"
      - name: "Gold"
        min-orders: 500
        max-orders: 2000
        commission-percent: 10.0
        description: "Preferred rate for high-volume restaurants"
      - name: "Platinum"
        min-orders: 2000
        max-orders: 999999.0
        commission-percent: 8.0
        description: "Best rate for top-performing restaurants"
  jwt:
    # HS512 signing requires >= 512 bits (64 bytes) of decoded key material.
    # The fallback below is a development-only default; production MUST set
    # JWT_SECRET to its own 64-byte (or longer) base64-encoded secret.
    # Expiration 15m (900000ms) limits blast radius of stolen tokens. Refresh tokens
    # are 7d and rotated on use when rotation is enabled. For high-traffic multi-pod
    # deploys, keep JWT_ROTATION_ENABLED=false — per-pod random rotation diverges
    # and breaks cross-pod validation (see JwtSecretRotationService).
    secret: ${JWT_SECRET:Wz6ZY4rjTh8TXTAsD25DB3+vPAnlJtL8iIms5CgJpWQqK6ZwXW6u+1PxMmNOj7N0akCSkweqlxighGqSKosZsA==}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    rotation:
      enabled: ${JWT_ROTATION_ENABLED:false}
      interval-ms: 86400000
  api-key:
    # Server-side pepper for HMAC-SHA256 API-key digests. Protects stored key
    # hashes against offline attacks if the database is ever leaked.
    pepper: ${API_KEY_PEPPER:zYHsmVfyqzrgU+RE/SXJ+Ep59FZMasTNccKToJT9yKpc6Ntk15gfWXCaPV3sGJr0Vw7X5uKeRIuaRUq4VKQECQ==}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    max-retries: 5
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    dead-letter-batch-size: 50
    dead-letter-repoll-ms: 60000

  # Distributed locking for scheduled jobs (ShedLock). The lock lives in Redis;
  # lock_at_most_for must comfortably exceed the longest job run.
  shedlock:
    enabled: ${SHEDLOCK_ENABLED:true}
    lock-at-most-for: PT30M
    lock-at-least-for: PT1S
  datasource:
    read-replica:
      enabled: true
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USERNAME:}
      password: ${DB_REPLICA_PASSWORD:}
      # Multiple replicas for horizontal read scaling (additive to the single url above).
      # When at least one replica is listed, the single url is ignored and read
      # connections are round-robined across the list via ReadReplicaSelector.
      # replicas:
      #   - url: ${DB_REPLICA2_URL:}
      #     username: ${DB_REPLICA2_USERNAME:}
      #     password: ${DB_REPLICA2_PASSWORD:}
      #   - url: ${DB_REPLICA3_URL:}
      hikari:
        pool-name: BhukkadReadReplicaPool
        # Pool size formula: cores × 2 + 2. For a 4-core replica → 10.
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:10}
        minimum-idle: ${DB_REPLICA_MIN_IDLE:2}
        read-only: true

  rate-limit:
    enabled: true
    # When true, responses carry X-RateLimit-Limit / X-RateLimit-Remaining /
    # X-RateLimit-Reset headers so clients can self-throttle.
    headers-enabled: ${RATE_LIMIT_HEADERS_ENABLED:true}
    buckets:
      order-track:
        limit: 20
        window-seconds: 60
      kitchen-queue:
        limit: 30
        window-seconds: 60
      search:
        limit: 30
        window-seconds: 60
      mobile-feed:
        limit: 30
        window-seconds: 60
      auth-login:
        limit: 10
        window-seconds: 60
      cart-mutation:
        limit: 40
        window-seconds: 60
      # Webhook endpoints are unauthenticated and keyed by client IP. Kept well
      # above provider redelivery volume so legitimate retries are never dropped.
      webhook:
        limit: 120
        window-seconds: 60
      # Registration is unauthenticated, so this bucket is the per-source cap on
      # account creation. Kept above the fraud thresholds below on purpose: the rate
      # limiter smooths bursts, the fraud check is what blocks sustained abuse.
      auth-register:
        limit: 10
        window-seconds: 60
      graphql-home:
        limit: 30
        window-seconds: 60
      graphql-order:
        limit: 30
        window-seconds: 60

  # Abuse detection for credential and checkout endpoints.
  #
  # Counting is scoped per event type and per dimension (source IP, device
  # fingerprint), which is what catches an attacker cycling through many distinct
  # accounts - each one individually under its own rate limit.
  #
  # Rollout guidance: deploy with blocking-enabled=false first. The service then logs
  # FRAUD_WOULD_BLOCK instead of throwing, so the real traffic distribution can be
  # observed and the thresholds tuned before any customer is turned away.
  fraud:
    enabled: ${FRAUD_DETECTION_ENABLED:true}
    blocking-enabled: ${FRAUD_BLOCKING_ENABLED:true}
    # Sliding detection window, in minutes, applied to every threshold below.
    window-minutes: 60
    # Value sent back in the Retry-After header on a 429.
    retry-after-seconds: 300
    # Applied to any event type with no explicit entry in `thresholds`.
    default-threshold: 20
    # A value of 0 disables that dimension for that event type.
    thresholds:
      auth-register:
        per-ip: 10
        per-device: 5
      auth-login:
        per-ip: 40
        per-device: 25
      order-create:
        per-ip: 25
        per-device: 15

  cluster:
    live-relay:
      enabled: true
      channel: bhukkad:live:order-updates

  live:
    sse:
      heartbeat-interval-ms: 25000
      # Hard cap on concurrent SSE connections per stream key (an order, a
      # restaurant's kitchen, or a rider). New subscribers beyond the cap get
      # 503 Service Unavailable. Bounds pod memory against reconnect floods.
      max-emitters-per-stream: 50
      # Fleet-wide per-pod cap on concurrent SSE connections across ALL streams
      # (every connection holds a servlet async context + buffers). New
      # subscribers beyond the budget get 503 Service Unavailable.
      max-total-emitters: 2000
      replay:
        max-events-per-stream: 200
        ttl-seconds: 3600

  stomp:
    broker:
      type: simple
      rabbit:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_STOMP_PORT:61613}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VHOST:/}

  storage:
    s3:
      enabled: ${S3_ENABLED:false}
      bucket: ${S3_BUCKET:bhukkad-menu-images}
      region: ${AWS_REGION:ap-south-1}
      key-prefix: menu-items
      upload-url-expiry-seconds: 900
      download-url-expiry-seconds: 3600
      # CloudFront CDN for menu images (feature #10)
      cloudfront:
        enabled: ${CLOUDFRONT_ENABLED:false}
        domain: ${CLOUDFRONT_DOMAIN:}
        key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
        private-key: ${CLOUDFRONT_PRIVATE_KEY:}
        signed-url-expiry-seconds: 3600

  payment:
    provider: simulated
    razorpay:
      enabled: ${APP_PAYMENT_RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      currency: INR

  notification:
    enabled: true
    email:
      enabled: false
      from: noreply@bhukkad.com
    sms:
      enabled: false
      provider: log
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    whatsapp:
      enabled: false
      provider: log
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        whatsapp-from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:}
    push:
      enabled: false
      provider: log
      fcm:
        server-key: ${FCM_SERVER_KEY:}
        project-id: ${FCM_PROJECT_ID:}

  wallet:
    allow-direct-top-up: false

  referral:
    enabled: true
    bonus-amount: 50.0
    referee-bonus-amount: 25.0

  # DPDP/GDPR compliance (feature #16): data export, consent tracking and
  # retention-based cleanup of expired compliance artifacts.
  compliance:
    enabled: ${COMPLIANCE_ENABLED:true}
    # Data export payloads older than this are purged by DataRetentionService.
    retention-days: 90
    # How often the retention sweep runs (ms).
    retention-cleanup-ms: ${COMPLIANCE_RETENTION_CLEANUP_MS:86400000}

  # Old-order archival into the range-partitioned orders_archive table (Phase 2).
  archival:
    orders:
      retention-days: ${ORDER_ARCHIVE_RETENTION_DAYS:365}
      batch-size: ${ORDER_ARCHIVE_BATCH_SIZE:500}
      interval-ms: ${ORDER_ARCHIVE_INTERVAL_MS:3600000}

  # Social login redirect target (frontend route that receives the JWT pair
  # from OAuth2LoginSuccessHandler).
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}

  # A/B experiments (feature #7). Weights are percentages and may sum to less
  # than 100 — the remainder is excluded from the experiment. Assignments are
  # deterministic per (experiment, user) via consistent hashing.
  experiments:
    enabled: ${EXPERIMENTS_ENABLED:true}
    experiments:
      checkout-cta-copy:
        enabled: false
        description: "Example: new checkout CTA wording"
        variants:
          - name: control
            weight: 50
          - name: treatment
            weight: 50

  # Personalized recommendations (feature #4): max items returned per endpoint.
  recommendations:
    max-items: ${RECOMMENDATION_MAX_ITEMS:10}

  # Churn prediction & proactive retention (feature #12).
  churn:
    enabled: ${CHURN_PREDICTION_ENABLED:true}
    scoring-cron: "0 0 3 * * MON"
    retention-threshold: 65
    batch-size: 500
    recency-decay-days: 30

  # ML-based order fraud scoring (feature #10). Enforcement stays off during
  # rollout — scores are logged and flagged for review only.
  fraud-scoring:
    enabled: ${FRAUD_SCORING_ENABLED:true}
    enforcement-enabled: ${FRAUD_SCORING_ENFORCEMENT:false}
    review-threshold: 60
    reject-threshold: 85

  settlement:
    commission-percent: 15.0
    auto-settle-enabled: true
    min-pending-amount: 100.0
    auto-settle-cron: "0 0 2 * * *"

  delivery-truth:
    avg-speed-km-per-min: 0.6
    pickup-buffer-minutes: 8
    confidence-band-minutes: 5
    record-snapshots: true

  road-distance:
    # Real road-distance ETA (P1-2). Disabled by default → haversine fallback.
    # Enable with APP_ROAD_DISTANCE_ENABLED=true and set an OSRM URL.
    enabled: ${APP_ROAD_DISTANCE_ENABLED:false}
    osrm-url: ${OSRM_URL:}
    connect-timeout-ms: 2000
    read-timeout-ms: 2000
    fallback-speed-km-per-min: 0.6

  cache:
    local:
      enabled: true
      max-size: 5000
      ttl-seconds: 60
    stampede:
      enabled: ${CACHE_STAMPEDE_ENABLED:true}
      jitter-percent: 10
      early-expire-percent: 5
    # Dynamic TTLs: optional per-bucket time-of-day multipliers applied on top of
    # the static `cache.ttl.*` values. When enabled, peak-hour traffic uses shorter
    # TTLs (fresher data) and off-peak uses longer ones (higher hit ratio).
    dynamic-ttl:
      enabled: false
      peak-hours: "11:00-14:00,19:00-22:00"
      peak-multiplier: 0.5
      off-peak-multiplier: 1.5
    # Pub/sub invalidation: cache evictions are broadcast on the Redis channel
    # below so every instance drops the key in both Redis (L2) and the local
    # Caffeine (L1) cache, not just the writer. The subscriber and publisher are
    # registered unconditionally; this flag documents the behavior and can be
    # used to disable cross-instance invalidation in single-instance topologies.
    # The channel value must match the hardcoded constant in
    # CacheInvalidationSubscriber / DistributedCacheInvalidator.
    pubsub-invalidation:
      enabled: true
      channel: bhukkad:cache:invalidation
    # Static TTLs per cache bucket (seconds). Consumed by RedisCacheService.
    ttl:
      restaurant: 1800
      restaurant-list: 600
      menu-item: 900
      menu-category: 1800
      cuisine: 86400
      user-profile: 3600
      cart: 1800
      order: 300
      review: 1800
      coupon: 3600
      search: 300
      home-feed: 60

  geo:
    redis-geo-enabled: true
    restaurants-geo-key: restaurants:geo

  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        platform-topic: bhukkad.platform.events
        consumer-group: bhukkad-platform-consumer
        dlq-topic: bhukkad.platform.events.dlt

  monitoring:
    prometheus:
      require-auth: true
      bearer-token: ${PROMETHEUS_BEARER_TOKEN:}

  alerting:
    enabled: true
    dedup-window-seconds: 60
    slow-request:
      warning-threshold-ms: 1000
      critical-threshold-ms: 3000
    http-error:
      alert-on-4xx: true
      alert-on-5xx: true
    webhook:
      enabled: false
      url: ${ALERT_WEBHOOK_URL:}
      secret: ${ALERT_WEBHOOK_SECRET:}

  delivery:
    earnings:
      per-delivery: 30.0
    # Delivery proof: the rider must capture evidence of handover (a 6-digit OTP the
    # customer reads out, optionally plus a photo) before an order can be marked
    # DELIVERED. Backs the "order never arrived" dispute flow.
    proof:
      # Master switch. When false the OTP/photo endpoints reject outright and no proof
      # rows are written.
      enabled: ${DELIVERY_PROOF_ENABLED:true}
      # Enforcement is deliberately OFF at ship time. Turning this on makes a verified
      # proof mandatory for the DELIVERED transition, which would strand every order
      # already out for delivery without one. Flip it only once riders are on a build
      # that captures proof, and prefer a low-traffic window.
      enforced: ${DELIVERY_PROOF_ENFORCED:false}
      # OTP lifetime. Long enough to survive a lift with no signal, short enough that a
      # code overheard earlier in the day is useless.
      otp-expiry-minutes: ${DELIVERY_PROOF_OTP_EXPIRY_MINUTES:10}
      # Wrong guesses allowed per issued code. Exhausting them marks the proof FAILED;
      # only a freshly issued code restores the allowance.
      max-otp-attempts: ${DELIVERY_PROOF_MAX_OTP_ATTEMPTS:5}
      # Minimum gap between resends, so a rider tapping "resend" cannot bill us for a
      # burst of SMS or spam the customer.
      otp-resend-cooldown-seconds: ${DELIVERY_PROOF_OTP_RESEND_COOLDOWN_SECONDS:60}

resilience4j:
  retry:
    instances:
      paymentGateway:
        max-attempts: 3
        wait-duration: 500ms
        # Exponential backoff with randomized jitter on top, so concurrent
        # instances don't retry the degraded gateway in lockstep.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
        ignore-exceptions:
          - com.bhukkad.exception.BusinessException
      osrm:
        max-attempts: 2
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.bhukkad.exception.BusinessException
  timelimiter:
    configs:
      paymentGateway:
        timeout-duration: 6s
        cancel-running-future: true
      osrm:
        timeout-duration: 3s
        cancel-running-future: true
      notificationSms:
        timeout-duration: 5s
        cancel-running-future: true
      notificationEmail:
        timeout-duration: 8s
        cancel-running-future: true
      notificationWhatsApp:
        timeout-duration: 5s
        cancel-running-future: true
      notificationPush:
        timeout-duration: 5s
        cancel-running-future: true
    instances:
      paymentGateway:
        base-config: paymentGateway
      osrm:
        base-config: osrm
      notificationSms:
        base-config: notificationSms
      notificationEmail:
        base-config: notificationEmail
      notificationWhatsApp:
        base-config: notificationWhatsApp
      notificationPush:
        base-config: notificationPush
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      notificationEmail:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      notificationSms:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      notificationWhatsApp:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      notificationPush:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
      osrm:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      paymentGateway:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
      osrm:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
      notificationSms:
        max-concurrent-calls: 30
        max-wait-duration: 200ms
      notificationEmail:
        max-concurrent-calls: 30
        max-wait-duration: 200ms
      notificationWhatsApp:
        max-concurrent-calls: 30
        max-wait-duration: 200ms
      notificationPush:
        max-concurrent-calls: 30
        max-wait-duration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  # Distributed tracing (OpenTelemetry). Two exporters are supported:
  #   - Zipkin (default): MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
  #   - OTLP (Jaeger / Tempo / collector): MANAGEMENT_OTLP_TRACING_ENDPOINT
  # Disabled by default; enable with MANAGEMENT_TRACING_ENABLED=true.
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://jaeger:4318/v1/traces}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    rabbit:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true

cache:
  ttl:
    restaurant: 1800
    restaurant-list: 600
    menu-item: 900
    menu-category: 1800
    cuisine: 86400
    user-profile: 3600
    cart: 1800
    order: 300
    order-track: 30
    kitchen-queue: 15
    review: 1800
    coupon: 3600
    search: 300
    admin-dashboard: 60
    # Home feed and serviceability are read-heavy and cheap to recompute, so they
    # use short TTLs to keep promo/zone edits visible within a minute.
    home-feed: 60
    serviceability: 60

logging:
  level:
    root: INFO
    com.bhukkad: DEBUG
    com.bhukkad.security: DEBUG
    com.bhukkad.logging: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.cache: DEBUG
    org.springframework.data.redis: DEBUG
    PERFORMANCE: DEBUG
    ORDER: DEBUG
    PAYMENT: DEBUG
    SECURITY: DEBUG
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    doc-expansion: none
    default-models-expand-depth: 2
    default-model-expand-depth: 2
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.bhukkad.controller
  show-actuator: false

# gRPC server for internal high-throughput service-to-service endpoints (feature #9).
# Disabled by default (net.devh convention: port = -1 means "do not start").
# Enable with GRPC_SERVER_PORT=9090. net.devh reads the top-level grpc.*
# namespace, NOT server.grpc.
grpc:
  server:
    port: ${GRPC_SERVER_PORT:-1}
