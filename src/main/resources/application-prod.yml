spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bhukkad}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadProdPool
      # Tunable per environment; default 50 = (24 cores × 2) + 2
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: ${DB_MIN_IDLE:15}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 50
          fetch_size: 50

app:
  environment: production
  debug: false

# Production-specific settings
server:
  http2:
    enabled: true

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 0.1

# Production cache settings - longer TTLs for better hit ratios
cache:
  ttl:
    restaurant: 3600
    restaurant-list: 1800
    menu-item: 1800
    menu-category: 3600
    home-feed: 300
    serviceability: 300

# Disable debug endpoints in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
