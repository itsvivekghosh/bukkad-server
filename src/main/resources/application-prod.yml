spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bhukkad}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadProdPool
      maximum-pool-size: 50
      minimum-idle: 15
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 4
          max-wait: 3000ms

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  devtools:
    restart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    com.bhukkad.security: WARN
    com.bhukkad.logging: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    PERFORMANCE: INFO
    ORDER: INFO
    PAYMENT: INFO
    SECURITY: WARN

app:
  environment: production
  debug: false
  async:
    order:
      core-pool-size: 8
      max-pool-size: 32
      queue-capacity: 500
  cloud-kitchen:
    kitchen-queue-default-limit: 50
    order-list-default-size: 20
    order-list-max-size: 100
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:true}
      url: ${DB_REPLICA_URL:}
      username: ${DB_REPLICA_USERNAME:${DB_USERNAME}}
      password: ${DB_REPLICA_PASSWORD:${DB_PASSWORD}}
      hikari:
        pool-name: BhukkadReadReplicaPool
        maximum-pool-size: 25
        minimum-idle: 5
        connection-timeout: 30000
        read-only: true
  rate-limit:
    enabled: true
    buckets:
      order-track:
        limit: 15
        window-seconds: 60
      kitchen-queue:
        limit: 20
        window-seconds: 60
  cluster:
    live-relay:
      enabled: ${LIVE_RELAY_ENABLED:true}
      channel: ${LIVE_RELAY_CHANNEL:bhukkad:live:order-updates}
  stomp:
    broker:
      type: ${STOMP_BROKER_TYPE:simple}
      rabbit:
        host: ${RABBITMQ_HOST:localhost}
        port: ${RABBITMQ_STOMP_PORT:61613}
        username: ${RABBITMQ_USERNAME:guest}
        password: ${RABBITMQ_PASSWORD:guest}
        virtual-host: ${RABBITMQ_VHOST:/}
  payment:
    provider: ${PAYMENT_PROVIDER:simulated}
    razorpay:
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      currency: INR
  notification:
    enabled: true
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
      from: ${NOTIFICATION_EMAIL_FROM:noreply@bhukkad.com}
    sms:
      enabled: ${NOTIFICATION_SMS_ENABLED:false}
      provider: log

cache:
  ttl:
    kitchen-queue: 10
    order-track: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true
