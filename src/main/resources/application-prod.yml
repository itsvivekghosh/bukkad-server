spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 50
          fetch_size: 50

app:
  environment: production
  debug: false

# Production-specific settings
server:
  http2:
    enabled: true

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 0.1

# Production cache settings - longer TTLs for better hit ratios
cache:
  ttl:
    restaurant: 3600
    restaurant-list: 1800
    menu-item: 1800
    menu-category: 3600
    home-feed: 300
    serviceability: 300

# Disable debug endpoints in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
