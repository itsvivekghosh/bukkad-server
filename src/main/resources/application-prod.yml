spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bhukkad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadProdPool
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 60000

    data:
      redis:
        host: localhost
        port: 6379
        password:
        database: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  devtools:
    restart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-exception: false

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    com.bhukkad.security: WARN
    com.bhukkad.logging: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    PERFORMANCE: INFO
    ORDER: INFO
    PAYMENT: INFO
    SECURITY: WARN
  file:
    name: logs/bhukkad-prod.log

app:
  environment: production
  debug: false
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}