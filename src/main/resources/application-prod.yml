spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bhukkad}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: BhukkadProdPool
      # High-traffic: 30 per pod × 10 pods = 300 << MySQL 500 (40% headroom).
      # Previous 20 × 10 = 200 had queueing under burst; Tomcat 80 needs ~30 Hikari.
      # Formula: pods × pool ≤ 0.8 × max_connections.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000
      # Fail fast if starving rather than queuing forever.
      initialization-fail-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 40
          max-idle: 20
          min-idle: 5
          max-wait: 3000ms

  jpa:
    show-sql: false
    properties:
      hibernate:
        # Session-level statistics enable query-count/entity-count monitoring
        # (Micrometer exporter or periodic "Hibernate Statistics" INFO logs).
        # Without these, N+1 query regressions on the order-detail/profile
        # graphs are invisible in production. Log level for the stats line is
        # INFO, so the overhead is negligible at this fleet's scale.
        generate_statistics: true
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 50

app:
  environment: production
  debug: false
  notification:
    # Real OTP / transactional delivery via Twilio. Credentials come from
    # secrets (TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER,
    # TWILIO_WHATSAPP_FROM_NUMBER) — see .github/workflows/production.yml.
    sms:
      enabled: true
      provider: twilio
    whatsapp:
      enabled: true
      provider: twilio

# Production-specific settings
server:
  http2:
    enabled: true
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:100}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:20}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    # Access log with rotation — keep minimal to avoid disk pressure at 5k RPS
    accesslog:
      enabled: false

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 0.1

# Production cache settings - longer TTLs for better hit ratios
cache:
  ttl:
    restaurant: 3600
    restaurant-list: 1800
    menu-item: 1800
    menu-category: 3600
    home-feed: 300
    serviceability: 300

# Disable debug endpoints in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

spring:
  graphql:
    graphiql:
      enabled: false
    websocket:
      enabled: false
