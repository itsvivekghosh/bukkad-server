# ArchUnit freeze store: records today's cross-domain violations so the build
# only fails on NEW boundary regressions (strangler-fig Phase 0). Pay down a
# frozen violation and refresh the store with:
#   mvn test -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.refreeze=false
freeze.store.default.allowStoreCreation=true
