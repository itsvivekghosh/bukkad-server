# Test profile used by integration tests (Testcontainers).
# The MySQL/Redis containers are wired via @DynamicPropertySource in
# AbstractJpaIntegrationTest; this file only disables infrastructure that the
# @DataJpaTest slice does not need and that would otherwise fail the context.

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      # Mirrors the base application.yml exclusion list. Profile-specific
      # autoconfigure.exclude REPLACES the base list, so both entries must be
      # repeated here or the full context tries to wire gRPC server security
      # (no GrpcAuthenticationReader bean exists in this app).
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"

# Disable infra that would block a slice-test context.
app:
  eventing:
    enabled: false
  rate-limit:
    enabled: false
  monitoring:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
