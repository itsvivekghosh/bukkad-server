spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:20}
      minimum-idle: ${ORDER_DB_POOL_SIZE:20}

app:
  environment: production
  order:
    async-saga:
      # Feature #3 exit criterion: prod opts into the outbox-driven saga.
      enabled: true