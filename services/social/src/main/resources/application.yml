server:
  port: 8095
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
    accept-count: 200
    max-connections: 4096
    connection-timeout: 10s
    max-swallow-size: 2MB
  max-http-request-header-size: 8KB
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: social
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${SOCIAL_DB_URL:jdbc:postgresql://pgbouncer:6432/social}
    username: ${SOCIAL_DB_USERNAME:app}
    password: ${SOCIAL_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${SOCIAL_DB_POOL_SIZE:50}
      minimum-idle: 20
      connection-timeout: 1000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration-pg
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}  # Format: host1:port1,host2:port2,host3:port3
      lettuce:
        pool:
          enabled: true
          max-active: 1024
          min-idle: 16
          max-idle: 128
          max-wait: 5s

management:
  metrics:
    enable:
      lettuce: true
      kafka: true
      jdbc: true
      reactor.netty: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 20
        wait-duration-in-open-state: 20s
        sliding-window-size: 100
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 30
        permitted-number-of-calls-in-half-open-state: 10
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.data.redis.RedisConnectionFailureException
          - java.lang.RuntimeException
      restaurantService:
        base-config: default
        failure-rate-threshold: 30
        wait-duration-in-open-state: 10s
        sliding-window-size: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 40
        permitted-number-of-calls-in-half-open-state: 5
      orderService:
        base-config: default
        failure-rate-threshold: 25
        wait-duration-in-open-state: 15s
        sliding-window-size: 50
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 35
        permitted-number-of-calls-in-half-open-state: 5
      redis:
        base-config: default
        failure-rate-threshold: 40
        wait-duration-in-open-state: 5s
        sliding-window-size: 200
        slow-call-duration-threshold: 500ms
        slow-call-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 20

logging:
  level:
    com.bhukkad: INFO
  sampling:
    http: ${LOGGING_SAMPLING_HTTP:1.0}
    service: ${LOGGING_SAMPLING_SERVICE:1.0}

app:
  environment: ${ENVIRONMENT:production}
  version: ${APP_VERSION:unknown}
  region: ${REGION:unknown}
  datasource:
    read-replica:
      enabled: ${SOCIAL_READ_REPLICA_ENABLED:false}
      replicas:
        - url: ${SOCIAL_REPLICA1_URL:jdbc:postgresql://replica1:5432/social}
          username: ${SOCIAL_DB_USERNAME:app}
          password: ${SOCIAL_DB_PASSWORD:app_pass}
          hikari:
            pool-name: "social-replica-1-pool"
            maximum-pool-size: ${SOCIAL_REPLICA1_POOL_SIZE:15}
            minimum-idle: 5
            connection-timeout: 3000
            idle-timeout: 600000
            max-lifetime: 1800000
            read-only: true
        - url: ${SOCIAL_REPLICA2_URL:jdbc:postgresql://replica2:5432/social}
          username: ${SOCIAL_DB_USERNAME:app}
          password: ${SOCIAL_DB_PASSWORD:app_pass}
          hikari:
            pool-name: "social-replica-2-pool"
            maximum-pool-size: ${SOCIAL_REPLICA2_POOL_SIZE:15}
            minimum-idle: 5
            connection-timeout: 3000
            idle-timeout: 600000
            max-lifetime: 1800000
            read-only: true
      write-fence-ms: ${SOCIAL_WRITE_FENCE_MS:2000}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth,social}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:social-platform-consumer}
        platform-topic: social.events.v1
        dlq-topic: social.events.v1.dlt

  # Social service alert thresholds (used by PerformanceMetrics / admin-analytics)
  social:
    alert:
      feed-p95-ms: 200
      feed-error-rate: 0.05
      like-error-rate: 0.01
      order-error-rate: 0.01
  cache:
    feed-l1:
      max-size: ${FEED_L1_MAX_SIZE:100000}
