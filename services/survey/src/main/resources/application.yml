server:
  port: 8083
  tomcat:
    threads:
      max: 100
    accept-count: 200
spring:
  application: {name: survey}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${SURVEY_DB_URL:jdbc:postgresql://localhost:5432/survey}
    username: ${SURVEY_DB_USERNAME:app}
    password: ${SURVEY_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint:

      health:

        probes:

          enabled: true

        group:

          liveness:

            include: livenessState

          readiness:

            include: readinessState
logging: {level: {com.bhukkad: INFO}}


app:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  environment: production
  survey:
    # Internal ownership-oracle base URL of the order service (mesh).
    order-base-url: ${ORDER_SERVICE_URL:http://order:8092}
  events:
    external:
      # Trending-dish materializer; Redpanda is part of standard dev bring-up
      # (services/docker/docker-compose.dev.yml), so the default now follows
      # migration plan Phase 0.4.
      enabled: ${EVENTS_EXTERNAL_ENABLED:true}
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        platform-topic: ${PLATFORM_EVENTS_TOPIC:bhukkad.platform.events}
        consumer-group: ${SURVEY_CONSUMER_GROUP:survey-platform-consumer}
  service:
    survey-url: ${SURVEY_SERVICE_URL:http://localhost:8083}
    restaurant-url: ${RESTAURANT_SERVICE_URL:http://localhost:8084}
    menu-url: ${MENU_SERVICE_URL:http://localhost:8085}
