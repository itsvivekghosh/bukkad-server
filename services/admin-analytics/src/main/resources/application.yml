server: {port: 8087}
spring:
  application: {name: admin-analytics}
  datasource:
    url: ${ADMIN_DB_URL:jdbc:postgresql://localhost:5432/admin}
    username: ${ADMIN_DB_USERNAME:app}
    password: ${ADMIN_DB_PASSWORD:app_pass}
    hikari: {maximum-pool-size: 5}
  jpa: {hibernate: {ddl-auto: none}, open-in-view: false}
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint: {health: {probes: {enabled: true}}}
logging: {level: {com.bhukkad: INFO}}

app:
  routes:
    identity-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    delivery-uri: ${DELIVERY_SERVICE_URL:http://localhost:8084}
  environment: production
  # A/B experiments (feature #7). Weights are percentages and may sum to less
  # than 100 — the remainder is excluded from the experiment. Assignments are
  # deterministic per (experiment, user) via consistent hashing.
  experiments:
    enabled: ${EXPERIMENTS_ENABLED:true}
    experiments:
      checkout-cta-copy:
        enabled: false
        description: "Example: new checkout CTA wording"
        variants:
          - name: control
            weight: 50
          - name: treatment
            weight: 50
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:admin-platform-consumer}
        platform-topic: admin.events.v1
        dlq-topic: admin.events.v1.dlt
