server:
  port: 8080
  netty:
    worker-count: 0  # auto = CPU cores
    connection-timeout: 30s

  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: bhukkad-gateway
  # PERF-0 geometry: gateway is reactive (netty, no Tomcat/DB/Hikari keys apply);
  # it gets the scheduler pool and Redis timeouts that it does support.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}
  cloud:
    gateway:
      # Audit batch A (edge hardening): bound upstream latency — without a
      # response timeout a hung service pins gateway connections forever.
      httpclient:
        connect-timeout: 5000
        response-timeout: 8s
        # W-5.4 / gateway pool (explicit budget; previously unconfigured =
        # implicit elastic provider = unbounded upstream connections under
        # fan-out/retry storms, exhaustion traded for invisible fd/port risk).
        # Fixed 500/pod × HPA 3..10 bounds in-flight upstream work
        # (REST + one held connection per live proxied stream); saturation
        # now surfaces as fast, counted acquire timeouts (503) instead of a
        # silently melting node.
        pool:
          type: fixed
          max-connections: 2000
          acquire-timeout: 8000
          max-idle-time: 30000
      # Edge header hardening (DedupeResponseHeader for Access-Control-Allow-*,
      # Proxy-Connection/TE stripping, Set-Cookie HttpOnly+Secure+SameSite=Strict)
      # is implemented via the TransportHeaderHygieneFilter and SecureCookieFilter
      # GlobalFilters — spring.cloud.gateway.default-filters only decorate
      # configuration-defined routes, and this gateway's 36-route strangler table
      # is a programmatic RouteLocator the property would silently bypass.
  # Shared Redis holding runtime feature-flag overrides (edge kill switch).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 16
          min-idle: 2
          max-idle: 8
          max-wait: 5s
      # Redis Sentinel / Cluster are intentionally NOT declared here.
      # Spring Boot activates Sentinel auto-configuration from the mere
      # PRESENCE of spring.data.redis.sentinel.master, so an env-var stub with
      # an empty default switched Sentinel on permanently and every eager
      # context build died with "Sentinel Master Id must not be null or empty"
      # (the local profile masked it via spring.main.lazy-initialization).
      # HA deployments must supply these in their own profile instead.

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:15}
        minimum-idle: 2
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
  # ---------------------------------------------------------------------------
  # Routes after the 16 -> 5 consolidation.
  #
  # The route table in GatewayConfig is unchanged (one entry per legacy domain,
  # each with its own circuit breaker + kill-switch), so the property names
  # stayed the same. What changed is WHERE each one points: the old
  # per-service defaults (order -> :8092, payment -> :8093, ...) no longer exist
  # as separate processes, so every request fell through to the gateway itself
  # and came back 405 with `Allow: GET` — the gateway's own actuator mapping.
  #
  #   identity    -> identity
  #   order       -> commerce   (order + payment + delivery)
  #   payment     -> commerce
  #   delivery    -> commerce
  #   restaurant  -> catalog    (restaurant + search + personalization)
  #   search      -> catalog
  #   personalization -> catalog
  #   social / survey / referral / notification / realtime / growth -> engagement
  #   support / admin-analytics -> admin
  #
  # Every value stays env-overridable so k8s / docker-compose can point at the
  # pod DNS names.
  # ---------------------------------------------------------------------------
  routes:
    identity-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}

    # commerce = order + payment + delivery
    order-uri: ${COMMERCE_SERVICE_URL:http://localhost:8080}
    payment-uri: ${COMMERCE_SERVICE_URL:http://localhost:8080}
    delivery-uri: ${COMMERCE_SERVICE_URL:http://localhost:8080}

    # catalog = restaurant + search + personalization
    restaurant-uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
    search-uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
    personalization-uri: ${CATALOG_SERVICE_URL:http://localhost:8081}

    # engagement = social + growth + referral + survey + notification + realtime
    social-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}
    growth-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}
    referral-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}
    survey-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}
    notification-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}
    realtime-uri: ${ENGAGEMENT_SERVICE_URL:http://localhost:8082}

    # admin = admin-analytics + supportticket
    admin-analytics-uri: ${ADMIN_SERVICE_URL:http://localhost:8083}
    support-uri: ${ADMIN_SERVICE_URL:http://localhost:8083}
  # Edge kill-switch defaults (W0 / gap A10). Same keys as every service's
  # app.feature-flags block; runtime overrides come from the shared Redis
  # hash bhukkad:feature-flag:overrides written by admin-analytics.
  # A route is disabled only when its flag resolves false (fail-open).
  feature-flags:
    flags: {}
    rollout: {}
  sse:
    # Phase 6 consistent-hash SSE routing. Populate with all realtime pod
    # addresses so /api/v1/live/{userId} requests are pinned by userId hash.
    # realtime merged into engagement; list the engagement pod DNS names.
    # Overridable so a non-k8s deployment (local/CI) can point at its own
    # engagement instance instead of inheriting unreachable cluster DNS.
    realtime-instances:
      - ${SSE_REALTIME_INSTANCES:http://engagement.bhukkad.svc.cluster.local:8082}

  rate-limit:
    enabled: true
    fail-open-on-redis-error: true
    buckets:
      order-track:
        limit: 1000
        window-seconds: 60
      kitchen-queue:
        limit: 1000
        window-seconds: 60
      search:
        limit: 1000
        window-seconds: 60
      cart-mutation:
        limit: 1000
        window-seconds: 60
      referral:
        limit: 1000
        window-seconds: 60
      webhook:
        limit: 1000
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    enable:
      reactor.netty: true
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 50
        minimum-number-of-calls: 20
        permitted-number-of-calls-in-half-open-state: 10
        # Only TRANSPORT and infrastructure failures may trip the breaker.
        #
        # `WebClientResponseException$ServiceUnavailable` used to be recorded as
        # a failure. But an upstream 503 is frequently an APPLICATION answer --
        # commerce returns 503 UPSTREAM_UNAVAILABLE while pricing a menu item,
        # i.e. a transient business condition. Counting it made one such response
        # push the failure rate over the threshold, open the breaker, and convert
        # every subsequent request into a gateway 503 -- including ones that would
        # have succeeded. That is a self-inflicted outage cascade.
        #
        # A circuit breaker exists to protect against a *down* dependency, not a
        # dependency answering. Down means connect failures / timeouts / 5xx
        # gateway errors, which is what is recorded below.
        record-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      identity:
        base-config: default
      order:
        base-config: default
      payment:
        base-config: default
      delivery:
        base-config: default
      restaurant:
        base-config: default
      search:
        base-config: default
      notification:
        base-config: default
      referral:
        base-config: default
      support:
        base-config: default
      growth:
        base-config: default
      personalization:
        base-config: default
      realtime:
        base-config: default
      # SSE streams (/api/v1/live/{kitchen,rider,order}/**). The default
      # Resilience4j time limiter is 1s, but a healthy SSE response produces no
      # terminal signal, so every stream was aborted at one second and surfaced
      # as 503 UPSTREAM_UNAVAILABLE. Widen only this instance — the other
      # realtime routes keep the 1s limiter so a hung dependency fails fast.
      realtimeSse:
        base-config: default
      survey:
        base-config: default
  # Per-instance time limiters (defaults: 1s connect, 1s overall).
  timelimiter:
    instances:
      realtimeSse:
        timeout-duration: 30m
        cancel-running-future: true