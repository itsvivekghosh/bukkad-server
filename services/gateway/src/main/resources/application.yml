server:
  port: 8080
  netty:
    worker-count: 0  # auto = CPU cores
    connection-timeout: 30s
    max-initial-line-length: 4096
    max-header-size: 16384
    max-chunk-size: 8192
    initial-buffer-size: 8192

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: bhukkad-
  # PERF-0 geometry:  is reactive (netty, no Tomcat/DB/Hikari keys apply);
  # it gets the scheduler pool and Redis timeouts that it does support.
  # Startup optimizations
  main:
    lazy-initialization: true
    banner-mode: "off"
    allow-bean-definition-overriding: true
  task:
    scheduling:
      pool:
        size: 8
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 1000
  cloud:
    gateway:
      # Audit batch A (edge hardening): bound upstream latency — without a
      # response timeout a hung service pins  connections forever.
      httpclient:
        connect-timeout: 5000
        response-timeout: 8s
        # W-5.4 /  pool (explicit budget; previously unconfigured =
        # implicit elastic provider = unbounded upstream connections under
        # fan-out/retry storms, exhaustion traded for invisible fd/port risk).
        # Fixed 500/pod × HPA 3..10 bounds in-flight upstream work
        # (REST + one held connection per live proxied stream); saturation
        # now surfaces as fast, counted acquire timeouts (503) instead of a
        # silently melting node.
        pool:
          type: fixed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 60
          min-idle: 10
          max-idle: 30
          max-wait: 2000
      # Redis Sentinel / Cluster are intentionally NOT declared here.
      # Spring Boot activates Sentinel auto-configuration from the mere
      # PRESENCE of spring.data.redis.sentinel.master, so an env-var stub with
      # an empty default switched Sentinel on permanently and every eager
      # context build died with "Sentinel Master Id must not be null or empty"
      # (the local profile masked it via spring.main.lazy-initialization).
      # HA deployments must supply these in their own profile instead.

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:10}
        minimum-idle: 5
        connection-timeout: 3000
        validation-timeout: 3000
        connection-test-query: SELECT 1
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
  # Resource-level authorization at the edge. Disabled until an edge policy
  # exists; the local platform-lib engine can later be replaced by an OPA
  # sidecar without changing request handling.
  authz:
    enabled: ${AUTHZ_ENABLED:false}
    policy-id: ${AUTHZ_POLICY_ID:gateway-default}
    resource-type: ${AUTHZ_RESOURCE_TYPE:http}

  # ---------------------------------------------------------------------------
  # Routes after the 16 -> 5 consolidation.
  #
  # The route table in GatewayConfig is unchanged (one entry per legacy domain,
  # each with its own circuit breaker + kill-switch), so the property names
  # stayed the same. What changed is WHERE each one points: the old
  # per-service defaults (order -> :8092, payment -> :8093, ...) no longer exist
  # as separate processes, so every request fell through to the  itself
  # and came back 405 with `Allow: GET` — the 's own actuator mapping.
  #
  #   identity    -> identity
  #   order       -> commerce   (order + payment + delivery)
  #   payment     -> commerce
  #   delivery    -> commerce
  #   restaurant  -> catalog    (restaurant + search + personalization)
  #   search      -> catalog
  #   personalization -> catalog
  #   social / survey / referral / notification / realtime / growth -> engagement
  #   support / admin-analytics -> admin
  #
  # Every value stays env-overridable so k8s / docker-compose can point at the
  # pod DNS names.
  # ---------------------------------------------------------------------------
  routes:
    identity-uri: http://identity:8080

    # commerce = order + payment + delivery
    order-uri: http://commerce:8080
    payment-uri: http://commerce:8080
    delivery-uri: http://commerce:8080

    # catalog = restaurant + search + personalization
    restaurant-uri: http://catalog:8080
    search-uri: http://catalog:8080
    personalization-uri: http://catalog:8080

    # engagement = social + growth + referral + survey + notification + realtime
    social-uri: http://engagement:8080
    growth-uri: http://engagement:8080
    referral-uri: http://engagement:8080
    survey-uri: http://engagement:8080
    notification-uri: http://engagement:8080
    realtime-uri: http://engagement:8080

    # admin = admin-analytics + supportticket
    admin-analytics-uri: http://admin:8080
    support-uri: http://admin:8080
  # Strict JSON validation at the edge. Non-positive values fall back to the
  # same production-safe defaults in GatewayValidationProperties.
  gateway:
    validation:
      max-depth: 10
      max-key-count: 1000

  # Edge kill-switch defaults (W0 / gap A10). Same keys as every service's
  # app.feature-flags block; runtime overrides come from the shared Redis
  # hash bhukkad:feature-flag:overrides written by admin-analytics.
  # A route is disabled only when its flag resolves false (fail-open).
  feature-flags:
    flags: {}
    rollout: {}
  sse:
    # Phase 6 consistent-hash SSE routing. Populate with all realtime pod
    # addresses so /api/v1/live/{userId} requests are pinned by userId hash.
    # realtime merged into engagement; list the engagement pod DNS names.
    # Overridable so a non-k8s deployment (local/CI) can point at its own
    # engagement instance instead of inheriting unreachable cluster DNS.
    realtime-instances:
      - ${SSE_REALTIME_INSTANCES:http://engagement.bhukkad.svc.cluster.local:8082}

  rate-limit:
    enabled: true
    fail-open-on-redis-error: true
    buckets:
      order-track:
        limit: 1000
        window-seconds: 60
      kitchen-queue:
        limit: 1000
        window-seconds: 60
      search:
        limit: 1000
        window-seconds: 60
      cart-mutation:
        limit: 1000
        window-seconds: 60
      referral:
        limit: 1000
        window-seconds: 60
      webhook:
        limit: 1000
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0

  # Circuit breaker configuration (local profile: lenient for development)
  resilience4j:
    # Spring Cloud Gateway's CircuitBreaker filter resolves a TimeLimiter for
    # every route. Without any config it falls back to Resilience4j's
    # 1-second default — and with spring.main.lazy-initialization=true the
    # FIRST call on each route pays 1-2.5s of lazy context/handler warmup, so
    # the limiter trips first and the edge answers 503 UPSTREAM_UNAVAILABLE
    # for a healthy upstream. A 20s per-route limit lets the warmup finish;
    # genuine hangs still fail (and the breaker still opens on failures).
    timelimiter:
      configs:
        default:
          timeout-duration: 20s
    circuitbreaker:
      configs:
        default:
          registerHealthIndicator: true
          slidingWindowSize: 10
          minimumNumberOfCalls: 5
          permittedNumberOfCallsInHalfOpenState: 3
          automaticTransitionFromOpenToHalfOpenEnabled: true
          waitDurationInOpenState: 10s
          failureRateThreshold: 80
          slowCallRateThreshold: 90
          slowCallDurationThreshold: 10s
        local:
          registerHealthIndicator: true
          slidingWindowSize: 20
          minimumNumberOfCalls: 10
          permittedNumberOfCallsInHalfOpenState: 5
          automaticTransitionFromOpenToHalfOpenEnabled: true
          waitDurationInOpenState: 5s
          failureRateThreshold: 90
          slowCallRateThreshold: 95
          slowCallDurationThreshold: 30s
      instances:
        catalog:
          baseConfig: local
        engagement:
          baseConfig: local
        order:
          baseConfig: local
        payment:
          baseConfig: local
        delivery:
          baseConfig: local
        notification:
          baseConfig: local
        referral:
          baseConfig: local
        survey:
          baseConfig: local
        social:
          baseConfig: local
        growth:
          baseConfig: local
        realtimeSse:
          baseConfig: local
        realtime:
          baseConfig: local
        identity:
          baseConfig: local
        admin-analytics:
          baseConfig: local
        restaurant:
          baseConfig: local
        search:
          baseConfig: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}
  otel:
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4317}
        protocol: grpc
  # Micrometer OTLP metrics registry (exemplars): HTTP/protobuf endpoint,
  # separate from the trace gRPC endpoint above.
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://tempo:4318/v1/metrics}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 50
        minimum-number-of-calls: 20
        permitted-number-of-calls-in-half-open-state: 10
        # Only TRANSPORT and infrastructure failures may trip the breaker.
        #
        # `WebClientResponseException$ServiceUnavailable` used to be recorded as
        # a failure. But an upstream 503 is frequently an APPLICATION answer --
        # commerce returns 503 UPSTREAM_UNAVAILABLE while pricing a menu item,
        # i.e. a transient business condition. Counting it made one such response
        # push the failure rate over the threshold, open the breaker, and convert
        # every subsequent request into a  503 -- including ones that would
        # have succeeded. That is a self-inflicted outage cascade.
        #
        # A circuit breaker exists to protect against a *down* dependency, not a
        # dependency answering. Down means connect failures / timeouts / 5xx
        #  errors, which is what is recorded below.
        record-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
          - org.springframework.web.reactive.function.client.WebClientResponseException$BadGateway
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      instances:
        identity:
          base-config: default
        order:
          base-config: default
        payment:
          base-config: default
        delivery:
          base-config: default
        restaurant:
          base-config: default
        search:
          base-config: default
        notification:
          base-config: default
        referral:
          base-config: default
        support:
          base-config: default
        growth:
          base-config: default
        personalization:
          base-config: default
        realtime:
          base-config: default
        # SSE streams (/api/v1/live/{kitchen,rider,order}/**). The default
        # Resilience4j time limiter is 1s, but a healthy SSE response produces no
        # terminal signal, so every stream was aborted at one second and surfaced
        # as 503 UPSTREAM_UNAVAILABLE. Widen only this instance — the other
        # realtime routes keep the 1s limiter so a hung dependency fails fast.
        realtimeSse:
          base-config: default
        survey:
          base-config: default
  # Per-instance time limiters (defaults: 1s connect, 1s overall).
  timelimiter:
    instances:
      realtimeSse:
        timeout-duration: 30m
        cancel-running-future: true
aws:
  region: us-east-1
  access-key: test
  secret-key: test
  endpoint: http://floci:4566
  s3Bucket: bhukkad-assets
  dynamodbTablePrefix: bhukkad-
  sqsQueuePrefix: bhukkad-
  snsTopicPrefix: bhukkad-
  kmsKeyAlias: bhukkad-key
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      s3:
        bucket: bhukkad-assets
      dynamodb:
        table-name: bhukkad-events
      sqs:
        queue-name: bhukkad-events
      sns:
        topic-name: bhukkad-events
      secretsmanager:
        prefix: bhukkad//
      kms:
        key-alias: bhukkad-key

# -----------------------------------------------------------------------------
# PROFILE: LOCAL (development)
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: local
  main:
    lazy-initialization: true
    banner-mode: "off"
  data:
    redis:
      ssl:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

# =============================================================================
# PROFILE: PROD (production)
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: false
    banner-mode: "off"
  data:
    redis:
      lettuce:
        pool:
          max-active: 20
          max-idle: 8
          min-idle: 4
          max-wait: 2000
      ssl:
        enabled: true
  cloud:
    gateway:
      httpclient:
        pool:
          type: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

# =============================================================================
# PROFILE: UAT (User Acceptance Testing)
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: uat
  main:
    lazy-initialization: true
    banner-mode: "off"
  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 4
          min-idle: 2
          max-wait: 2000
      ssl:
        enabled: true
  cloud:
    gateway:
      httpclient:
        pool:
          type: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,gateway
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}