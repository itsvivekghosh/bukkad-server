server:
  port: 8080
  netty:
    worker-count: 0  # auto = CPU cores
    connection-timeout: 30s

  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: bhukkad-gateway
  # PERF-0 geometry: gateway is reactive (netty, no Tomcat/DB/Hikari keys apply);
  # it gets the scheduler pool and Redis timeouts that it does support.
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  cloud:
    gateway:
      # Audit batch A (edge hardening): bound upstream latency — without a
      # response timeout a hung service pins gateway connections forever.
      httpclient:
        connect-timeout: 5000
        response-timeout: 8s
        # W-5.4 / gateway pool (explicit budget; previously unconfigured =
        # implicit elastic provider = unbounded upstream connections under
        # fan-out/retry storms, exhaustion traded for invisible fd/port risk).
        # Fixed 500/pod × HPA 3..10 bounds in-flight upstream work
        # (REST + one held connection per live proxied stream); saturation
        # now surfaces as fast, counted acquire timeouts (503) instead of a
        # silently melting node.
        pool:
          type: fixed
          max-connections: 2000
          acquire-timeout: 8000
          max-idle-time: 30000
      # Edge header hardening (DedupeResponseHeader for Access-Control-Allow-*,
      # Proxy-Connection/TE stripping, Set-Cookie HttpOnly+Secure+SameSite=Strict)
      # is implemented via the TransportHeaderHygieneFilter and SecureCookieFilter
      # GlobalFilters — spring.cloud.gateway.default-filters only decorate
      # configuration-defined routes, and this gateway's 36-route strangler table
      # is a programmatic RouteLocator the property would silently bypass.
  # Shared Redis holding runtime feature-flag overrides (edge kill switch).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 256
          min-idle: 8
          max-idle: 32
          max-wait: 5s
      # Optional Redis Sentinel (enable by setting REDIS_SENTINEL_MASTER)
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        nodes: ${REDIS_SENTINEL_NODES:}
        password: ${REDIS_SENTINEL_PASSWORD:}
      # Optional Redis Cluster (enable by setting REDIS_CLUSTER_NODES)
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
      - org.springframework.boot.autoconfigure.transaction.TransactionAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:15}
        minimum-idle: 5
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
  routes:
    restaurant-uri: ${RESTAURANT_SERVICE_URL:http://localhost:8091}
    identity-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    order-uri: ${ORDER_SERVICE_URL:http://localhost:8092}
    payment-uri: ${PAYMENT_SERVICE_URL:http://localhost:8093}
    delivery-uri: ${DELIVERY_SERVICE_URL:http://localhost:8094}
    search-uri: ${SEARCH_SERVICE_URL:http://localhost:8082}
    survey-uri: ${SURVEY_SERVICE_URL:http://localhost:8083}
    referral-uri: ${REFERRAL_SERVICE_URL:http://localhost:8084}
    support-uri: ${SUPPORT_SERVICE_URL:http://localhost:8086}
    notification-uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
    admin-analytics-uri: ${ADMIN_ANALYTICS_SERVICE_URL:http://localhost:8087}
    realtime-uri: ${REALTIME_SERVICE_URL:http://localhost:8077}
    growth-uri: ${GROWTH_SERVICE_URL:http://localhost:8089}
    personalization-uri: ${PERSONALIZATION_SERVICE_URL:http://localhost:8088}
    social-uri: ${SOCIAL_SERVICE_URL:http://localhost:8095}
  # Edge kill-switch defaults (W0 / gap A10). Same keys as every service's
  # app.feature-flags block; runtime overrides come from the shared Redis
  # hash bhukkad:feature-flag:overrides written by admin-analytics.
  # A route is disabled only when its flag resolves false (fail-open).
  feature-flags:
    flags: {}
    rollout: {}
  sse:
    # Phase 6 consistent-hash SSE routing. Populate with all realtime pod
    # addresses so /api/v1/live/{userId} requests are pinned by userId hash.
    realtime-instances:
      - http://realtime-0.realtime.bhukkad.svc.cluster.local:8077
      - http://realtime-1.realtime.bhukkad.svc.cluster.local:8077
      - http://realtime-2.realtime.bhukkad.svc.cluster.local:8077

  rate-limit:
    enabled: true
    fail-open-on-redis-error: true
    buckets:
      order-track:
        limit: 20
        window-seconds: 60
      kitchen-queue:
        limit: 30
        window-seconds: 60
      search:
        limit: 60
        window-seconds: 60
      cart-mutation:
        limit: 30
        window-seconds: 60
      referral:
        limit: 20
        window-seconds: 60
      webhook:
        limit: 120
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    enable:
      reactor.netty: true
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 40
        wait-duration-in-open-state: 30s
        sliding-window-size: 50
        permitted-number-of-calls-in-half-open-state: 10
        record-exceptions:
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException$ServiceUnavailable
          - org.springframework.web.reactive.function.client.WebClientResponseException$GatewayTimeout
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      identity:
        base-config: default
      order:
        base-config: default
      payment:
        base-config: default
      delivery:
        base-config: default
      restaurant:
        base-config: default
      search:
        base-config: default
      notification:
        base-config: default
      referral:
        base-config: default
      support:
        base-config: default
      growth:
        base-config: default
      personalization:
        base-config: default
      realtime:
        base-config: default
      survey:
        base-config: default