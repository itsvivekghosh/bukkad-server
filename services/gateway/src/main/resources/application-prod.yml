spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-0.bhukkad:6379,redis-1.bhukkad:6379,redis-2.bhukkad:6379,redis-3.bhukkad:6379,redis-4.bhukkad:6379,redis-5.bhukkad:6379}
        max-redirects: 3
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 200
          min-idle: 50
          max-idle: 100
          max-wait: 5000ms

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:15}
        minimum-idle: 5
        connection-timeout: 3000
        validation-timeout: 3000
        connection-test-query: SELECT 1
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
  environment: production

  rate-limit:
    fail-open-on-redis-error: false  # CR-09: Fail-closed in prod

  events:
    external:
      enabled: true
      type: kafka
      kafka:
        listener-concurrency: 3
  outbox:
    wake:
      enabled: true
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

management:
  metrics:
    enable:
      lettuce: true