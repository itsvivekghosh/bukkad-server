server:
  port: 8084

spring:
  application:
    name: payment
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/bhukkad_payments}
    username: ${PAYMENT_DB_USERNAME:bhukkad}
    password: ${PAYMENT_DB_PASSWORD:bhukkad_dev}
    hikari:
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-pg

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bhukkad: INFO

app:
  environment: production
  auth:
    jwt:
      # Per-service JWT validation (platform-lib PlatformJwtValidator). Empty
      # secret = auth filter inactive in dev (protected endpoints then 401);
      # set JWT_SECRET (shared HS256 secret) or JWKS_URL (RS256 via Keycloak)
      # to enable.
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:payment-platform-consumer}
        platform-topic: payment.events.v1
        dlq-topic: payment.events.v1.dlt
