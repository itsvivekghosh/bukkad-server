spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/_db
    username: app
    password: app_pass
    hikari:
      maximum-pool-size: 10

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    open-in-view: false
    show-sql: false

logging:
  level:
    com.bhukkad: DEBUG

app:
  environment: development
