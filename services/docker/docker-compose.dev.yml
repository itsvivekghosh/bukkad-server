# Development environment - Full stack with events, debugging, and observability
# Usage: docker-compose -f docker-compose.dev.yml up -d
# Includes: all services + pgbouncer + redpanda + nginx edge proxy + observability

name: bhukkad-dev

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: '8080'
  REDIS_HOST: redis
  SPRING_DATA_REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars!!}
  # RS256 verification. Without this the platform validator falls back to
  # HMAC, every gateway-forwarded request is rejected 401, and the order
  # circuit breaker trips (surfacing as a 503 fallback).
  JWKS_URL: ${JWKS_URL:-http://identity:8080/.well-known/jwks.json}
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-service-secret-min-32-chars!!}
  PGBOUNCER_ENABLED: ${PGBOUNCER_ENABLED:-true}
  PGBOUNCER_HOST: pgbouncer
  PGBOUNCER_PORT: '6432'
  PGBOUNCER_DATABASE: core
  PGBOUNCER_USERNAME: app
  PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
  PGBOUNCER_POOL_MODE: transaction
  TRACING_SAMPLE_PROBABILITY: '0.1'
  EVENTS_EXTERNAL_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
  MALLOC_ARENA_MAX: '2'
  JAVA_OPTS: >-
    -Xms128m -Xmx448m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=48m
    -XX:+UseSerialGC
    -XX:TieredStopAtLevel=1
    -XX:ReservedCodeCacheSize=128m
    -Xss512k
    -XX:MinHeapFreeRatio=10
    -XX:MaxHeapFreeRatio=25
    -XX:ActiveProcessorCount=2
    -XX:MaxRAMPercentage=60
    -XX:+UseStringDeduplication
    -XX:+UseCompressedOops
    -XX:+UseCompressedClassPointers
    -Djava.net.preferIPv4Stack=true
    -Dserver.address=0.0.0.0
    -Dspring.main.lazy-initialization=true
    -Dspring.jmx.enabled=false
    -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
  spring.datasource.hikari.maximum-pool-size: '6'
  SERVER_ADDRESS: 0.0.0.0

x-common-deploy: &common-deploy
  resources:
    limits:
      memory: 512M

x-common-depends: &common-depends
  postgres:
    condition: service_healthy
  pgbouncer:
    condition: service_healthy
    required: false
  redis:
    condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    container_name: bhukkad-postgres
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
    ports:
      - 5432:5432
    volumes:
      - bhukkad-pgdata:/var/lib/postgresql/data
      - ./initdb/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d core"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer:1.22
    container_name: bhukkad-pgbouncer
    environment:
      PG_BOUNCER_DB: core
      PG_BOUNCER_USER: app
      PG_BOUNCER_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
      PG_BOUNCER_ADMIN_USERS: admin,stats_user
      PG_BOUNCER_POOL_MODE: transaction
      PG_BOUNCER_MAX_CLIENT_CONN: 10000
      PG_BOUNCER_DEFAULT_POOL_SIZE: 100
      PG_BOUNCER_MIN_POOL_SIZE: 20
      PG_BOUNCER_RESERVE_POOL_SIZE: 5
      PG_BOUNCER_RESERVE_POOL_TIMEOUT: 5
      PG_BOUNCER_MAX_CONNECTION_LIFETIME: 3600
      PG_BOUNCER_IDLE_TIMEOUT: 600
      PG_BOUNCER_QUERY_TIMEOUT: 30
      PG_BOUNCER_QUERY_WAIT_TIMEOUT: 120
      PG_BOUNCER_STATS_PERIOD: 60
    ports:
      - 6432:6432
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d core -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - 6379:6379
    deploy:
      resources:
        limits:
          memory: 128M

  redpanda:
    image: redpandadata/redpanda:v23.3.13
    container_name: bhukkad-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - 9092:29092
      - 29092:29092
      - 9644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M

  # Identity service
  identity:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      IDENTITY_DB_URL: jdbc:postgresql://pgbouncer:6432/identity
      APP_BOOTSTRAPADMIN_ENABLED: 'true'
      APP_BOOTSTRAPADMIN_EMAIL: admin@bhukkad.dev
      APP_BOOTSTRAPADMIN_PASSWORD: ${APP_BOOTSTRAPADMIN_PASSWORD:-Admin@123456}
      APP_SECURITY_PASSWORD_ENCODER_ALGORITHM: bcrypt
    deploy: *common-deploy
    depends_on: *common-depends
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: identity
    container_name: bhukkad-identity
    image: bhukkad/identity:dev

  # Commerce service (order + payment + delivery)
  commerce:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      COMMERCE_DB_URL: jdbc:postgresql://pgbouncer:6432/commerce
      CATALOG_SERVICE_URL: http://catalog:8080
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
      ADMIN_SERVICE_URL: http://admin:8080
    deploy: *common-deploy
    depends_on: *common-depends
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: commerce
    container_name: bhukkad-commerce
    image: bhukkad/commerce:dev

  # Catalog service
  catalog:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      CATALOG_DB_URL: jdbc:postgresql://pgbouncer:6432/catalog
      COMMERCE_SERVICE_URL: http://commerce:8080
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
      ADMIN_SERVICE_URL: http://admin:8080
    deploy: *common-deploy
    depends_on: *common-depends
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: catalog
    container_name: bhukkad-catalog
    image: bhukkad/catalog:dev

  # Engagement service
  engagement:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      ENGAGEMENT_DB_URL: jdbc:postgresql://pgbouncer:6432/engagement
      COMMERCE_SERVICE_URL: http://commerce:8080
      CATALOG_SERVICE_URL: http://catalog:8080
      ADMIN_SERVICE_URL: http://admin:8080
    deploy: *common-deploy
    depends_on: *common-depends
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: engagement
    container_name: bhukkad-engagement
    image: bhukkad/engagement:dev

  # Admin service
  admin:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      ADMIN_DB_URL: jdbc:postgresql://pgbouncer:6432/admin
      COMMERCE_SERVICE_URL: http://commerce:8080
      CATALOG_SERVICE_URL: http://catalog:8080
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
    deploy: *common-deploy
    depends_on: *common-depends
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: admin
    container_name: bhukkad-admin
    image: bhukkad/admin:dev

  # Gateway
  gateway:
    restart: on-failure
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      IDENTITY_SERVICE_URL: http://identity:8080
      COMMERCE_SERVICE_URL: http://commerce:8080
      CATALOG_SERVICE_URL: http://catalog:8080
      ENGAGEMENT_SERVICE_URL: http://engagement:8080
      ADMIN_SERVICE_URL: http://admin:8080
    deploy: *common-deploy
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
        required: false
      redis:
        condition: service_started
      identity:
        condition: service_started
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        MODULE: gateway
    container_name: bhukkad-gateway
    image: bhukkad/gateway:dev
    ports:
      - 8095:8080

  # Edge proxy (nginx)
  nginx:
    image: nginx:1.27-alpine
    container_name: bhukkad-nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - identity
      - commerce
      - catalog
      - engagement
      - admin
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  bhukkad-pgdata:
    name: bhukkad_pgdata_dev