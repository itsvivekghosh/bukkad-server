# Full local dev stack for the microservices (plan §2.1/§11): one PostgreSQL per
# service, Redpanda (Kafka API) for events, nginx as the edge router.
# Start: docker compose -f services/docker/docker-compose.dev.yml up -d

services:

  redpanda:
    image: redpandadata/redpanda:v23.3.13
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr redpanda:33145
    ports: ["29092:29092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    # 8088 on the host: the monolith already owns 8080 in local dev.
    ports: ["8088:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity
      - restaurant
      - order
      - payment
      - delivery
      - notification
      - admin-analytics
      - search
      - survey
      - referral
      - supportticket

  identity:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: identity}}
    container_name: bhukkad-identity
    image: ghcr.io/bhukkad/identity:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity
      IDENTITY_DB_USERNAME: app
      IDENTITY_DB_PASSWORD: app_pass
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in services/docker/.env}"

  restaurant:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: restaurant}}
    container_name: bhukkad-restaurant
    image: ghcr.io/bhukkad/restaurant:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      RESTAURANT_DB_URL: jdbc:postgresql://postgres:5432/restaurants
      RESTAURANT_DB_USERNAME: app
      RESTAURANT_DB_PASSWORD: app_pass

  order:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: order}}
    container_name: bhukkad-order
    image: ghcr.io/bhukkad/order:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/orders
      ORDER_DB_USERNAME: app
      ORDER_DB_PASSWORD: app_pass

  payment:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: payment}}
    container_name: bhukkad-payment
    image: ghcr.io/bhukkad/payment:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payments
      PAYMENT_DB_USERNAME: app
      PAYMENT_DB_PASSWORD: app_pass

  delivery:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: delivery}}
    container_name: bhukkad-delivery
    image: ghcr.io/bhukkad/delivery:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      DELIVERY_DB_URL: jdbc:postgresql://postgres:5432/delivery
      DELIVERY_DB_USERNAME: app
      DELIVERY_DB_PASSWORD: app_pass

  notification:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: notification}}
    container_name: bhukkad-notification
    image: ghcr.io/bhukkad/notification:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/notification
      NOTIFICATION_DB_USERNAME: app
      NOTIFICATION_DB_PASSWORD: app_pass

  admin-analytics:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: admin-analytics}}
    container_name: bhukkad-admin-analytics
    image: ghcr.io/bhukkad/admin-analytics:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      ADMIN_DB_URL: jdbc:postgresql://postgres:5432/admin
      ADMIN_DB_USERNAME: app
      ADMIN_DB_PASSWORD: app_pass

  # Spring Cloud Gateway: owns the same route table as nginx but adds
  # resilience/fallback behavior for local testing of the gateway deployment.
  gateway:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: gateway}}
    container_name: bhukkad-gateway
    image: ghcr.io/bhukkad/gateway:latest
    ports: ["8095:8080"]
    environment:
      SERVER_PORT: "8080"
      RESTAURANT_SERVICE_URL: http://restaurant:8080
      IDENTITY_SERVICE_URL: http://identity:8080
      ORDER_SERVICE_URL: http://order:8080
      PAYMENT_SERVICE_URL: http://payment:8080
      DELIVERY_SERVICE_URL: http://delivery:8080
      SEARCH_SERVICE_URL: http://search:8080
      SURVEY_SERVICE_URL: http://survey:8080
      REFERRAL_SERVICE_URL: http://referral:8080
      SUPPORT_SERVICE_URL: http://supportticket:8080
    depends_on:
      - identity
      - restaurant
      - order
      - payment
      - delivery
      - search
      - survey
      - referral
      - supportticket

  search:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: search}}
    container_name: bhukkad-search
    image: ghcr.io/bhukkad/search:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      SEARCH_DB_URL: jdbc:postgresql://postgres:5432/search
      SEARCH_DB_USERNAME: app
      SEARCH_DB_PASSWORD: app_pass

  survey:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: survey}}
    container_name: bhukkad-survey
    image: ghcr.io/bhukkad/survey:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      SURVEY_DB_URL: jdbc:postgresql://postgres:5432/survey
      SURVEY_DB_USERNAME: app
      SURVEY_DB_PASSWORD: app_pass
      EVENTS_EXTERNAL_ENABLED: "${EVENTS_EXTERNAL_ENABLED:-true}"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      PLATFORM_EVENTS_TOPIC: bhukkad.platform.events
      SURVEY_CONSUMER_GROUP: survey-platform-consumer
    depends_on: [redpanda]

  referral:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: referral}}
    container_name: bhukkad-referral
    image: ghcr.io/bhukkad/referral:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      REFERRAL_DB_URL: jdbc:postgresql://postgres:5432/referral
      REFERRAL_DB_USERNAME: app
      REFERRAL_DB_PASSWORD: app_pass

  supportticket:
    build: {context: ../../, dockerfile: services/docker/Dockerfile.service, args: {MODULE: supportticket}}
    container_name: bhukkad-supportticket
    image: ghcr.io/bhukkad/supportticket:latest
    environment:
      SERVER_PORT: "8080"
      spring.datasource.hikari.maximum-pool-size: "8"
      SUPPORT_DB_URL: jdbc:postgresql://postgres:5432/support
      SUPPORT_DB_USERNAME: app
      SUPPORT_DB_PASSWORD: app_pass

volumes:
  bhukkad-pgdata:
