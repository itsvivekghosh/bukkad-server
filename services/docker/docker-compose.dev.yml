# Development environment - Full stack with events, debugging, and observability
# Usage: docker-compose -f docker-compose.dev.yml up -d
# Includes: all services + pgbouncer + redpanda + nginx edge proxy + observability

name: bhukkad-dev

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: local
  SERVER_PORT: '8080'
  REDIS_HOST: redis
  SPRING_DATA_REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars!!}
  # RS256 verification. Without this the platform validator falls back to
  # HMAC, every gateway-forwarded request is rejected 401, and the order
  # circuit breaker trips (surfacing as a 503 fallback).
  JWKS_URL: ${JWKS_URL:-http://identity:8080/.well-known/jwks.json}
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET:-dev-service-secret-min-32-chars!!}
  IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity
  CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog
  COMMERCE_DB_URL: jdbc:postgresql://postgres:5432/commerce
  ENGAGEMENT_DB_URL: jdbc:postgresql://postgres:5432/engagement
  ADMIN_DB_URL: jdbc:postgresql://postgres:5432/admin
  APP_DATASOURCE_PGBOUNCER_ENABLED: ${APP_DATASOURCE_PGBOUNCER_ENABLED:-false}
  APP_DATASOURCE_PGBOUNCER_HOST: postgres
  APP_DATASOURCE_PGBOUNCER_PORT: '5432'
  APP_DATASOURCE_PGBOUNCER_DATABASE: core
  APP_DATASOURCE_PGBOUNCER_USERNAME: app
  APP_DATASOURCE_PGBOUNCER_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
  APP_DATASOURCE_PGBOUNCER_POOL_MODE: transaction
  TRACING_SAMPLE_PROBABILITY: '0.1'
  EVENTS_EXTERNAL_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
  IDENTITY_SERVICE_URL: http://identity:8080
  CATALOG_SERVICE_URL: http://catalog:8080
  COMMERCE_SERVICE_URL: http://commerce:8080
  ENGAGEMENT_SERVICE_URL: http://engagement:8080
  ADMIN_SERVICE_URL: http://admin:8080
  GATEWAY_URL: http://gateway:8080
  MALLOC_ARENA_MAX: '2'
  JAVA_OPTS: >-
    -Xms128m -Xmx448m
    -XX:MaxMetaspaceSize=256m
    -XX:MaxDirectMemorySize=48m
    -XX:+UseSerialGC
    -XX:TieredStopAtLevel=1
    -XX:ReservedCodeCacheSize=128m
    -Xss512k
    -XX:MinHeapFreeRatio=10
    -XX:MaxHeapFreeRatio=25
    -XX:ActiveProcessorCount=2
    -XX:MaxRAMPercentage=60
    -XX:+UseStringDeduplication
    -XX:+UseCompressedOops
    -XX:+UseCompressedClassPointers
    -Djava.net.preferIPv4Stack=true
    -Dserver.address=0.0.0.0
    -Dspring.main.lazy-initialization=true
    -Dspring.jmx.enabled=false
    -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
  spring.datasource.hikari.maximum-pool-size: '6'
  SERVER_ADDRESS: 0.0.0.0

x-common-deploy: &common-deploy
  resources:
    limits:
      memory: 1G

x-common-depends: &common-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    container_name: bhukkad-postgres
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pass}
    ports:
      - 5432:5432
    volumes:
      - bhukkad-pgdata:/var/lib/postgresql/data
      - ./initdb/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./initdb/01-postgres-config.sql:/docker-entrypoint-initdb.d/01-postgres-config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d core"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy: *common-deploy

  redis:
    image: redis:7-alpine
    container_name: bhukkad-redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy: *common-deploy

  redpanda:
    image: redpandadata/redpanda:v23.3.13
    container_name: bhukkad-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - '0'
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - 9092:29092
      - 29092:29092
      - 9644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  # Identity service
  identity:
    image: bhukkad/identity:1.0.0
    container_name: bhukkad-identity
    environment:
      <<: *common-env
    ports:
      - 8081:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Commerce service (order + payment + delivery)
  commerce:
    image: bhukkad/commerce:1.0.0
    container_name: bhukkad-commerce
    environment:
      <<: *common-env
    ports:
      - 8091:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Catalog service (restaurant + search + personalization)
  catalog:
    image: bhukkad/catalog:1.0.0
    container_name: bhukkad-catalog
    environment:
      <<: *common-env
    ports:
      - 8082:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Engagement service (social + growth + referral + survey + notification + realtime)
  engagement:
    image: bhukkad/engagement:1.0.0
    container_name: bhukkad-engagement
    environment:
      <<: *common-env
    ports:
      - 8083:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Admin service (admin analytics + support tickets)
  admin:
    image: bhukkad/admin:1.0.0
    container_name: bhukkad-admin
    environment:
      <<: *common-env
    ports:
      - 8087:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Gateway service
  gateway:
    image: bhukkad/gateway:1.0.0
    container_name: bhukkad-gateway
    environment:
      <<: *common-env
    ports:
      - 8095:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_healthy
    deploy: *common-deploy

  # Nginx edge proxy
  nginx:
    image: nginx:alpine
    container_name: bhukkad-nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_started
    deploy: *common-deploy

volumes:
  bhukkad-pgdata:
    driver: local
