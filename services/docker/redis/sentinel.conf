# Redis Sentinel Configuration for Bhukkad HA
# Monitors the master 'bhukkad-master' on redis-1:6379

# Sentinel port
port 26379

# Working directory
dir /data

# Master monitoring configuration
# sentinel monitor <master-name> <ip> <port> <quorum>
# quorum = 2 (need 2 out of 3 sentinels to agree for failover)
sentinel monitor bhukkad-master redis-1 6379 2

# Authentication - password injected at runtime via envsubst from K8s secret
sentinel auth-pass bhukkad-master ${REDIS_PASSWORD}

# Failover timeout (ms) - how long to wait before starting a new failover
sentinel failover-timeout bhukkad-master 180000

# Down-after-milliseconds - time after which master is considered down
sentinel down-after-milliseconds bhukkad-master 5000

# Parallel syncs - number of replicas to reconfigure in parallel during failover
sentinel parallel-syncs bhukkad-master 1

# Sentinel announce IP (for Docker networking)
# sentinel announce-ip <ip>
# sentinel announce-port <port>

# Logging
logfile ""
loglevel notice

# Client reconfiguration script (optional)
# sentinel client-reconfig-script bhukkad-master /scripts/reconfig.sh

# Notification script (optional)
# sentinel notification-script bhukkad-master /scripts/notify.sh