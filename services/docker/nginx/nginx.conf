worker_processes auto;

events { worker_connections 1024; }

http {
    upstream identity { server identity-service:8080; }
    upstream restaurant { server restaurant-service:8080; }
    upstream order { server order-service:8080; }
    upstream payment { server payment-service:8080; }
    upstream delivery { server delivery-service:8080; }
    upstream notification { server notification-service:8080; }
    upstream admin { server admin-analytics-service:8080; }

    server {
        listen 80;
        server_name _;

        # --- identity ---
        location /api/v1/auth/ { proxy_pass http://identity; }
        location /api/v1/tenants { proxy_pass http://identity; }
        location /api/v1/affiliate { proxy_pass http://identity; }
        # Wallet routes to payment, so must come before generic customers/ route
        location ~ ^/api/v1/customers/[0-9]+/wallet { proxy_pass http://payment; }
        location /api/v1/customers/ { proxy_pass http://identity; }

        # --- restaurant ---
        location /api/v1/restaurants { proxy_pass http://restaurant; }
        location /api/v1/search { proxy_pass http://restaurant; }
        location /api/v1/reviews { proxy_pass http://restaurant; }
        location /api/v1/admin/reviews { proxy_pass http://restaurant; }
        location /api/v1/cuisines { proxy_pass http://restaurant; }
        location /api/v1/inventory { proxy_pass http://restaurant; }
        location /api/v1/pricing { proxy_pass http://restaurant; }
        location /api/v1/menu { proxy_pass http://restaurant; }
        location /api/v1/feed { proxy_pass http://restaurant; }

        # --- order ---
        # Order-specific customer routes must come before generic customers/
        location ~ ^/api/v1/customers/[0-9]+/cart { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/reorder { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/group-orders { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/subscriptions { proxy_pass http://order; }
        location /api/v1/orders { proxy_pass http://order; }
        location /api/v1/gift-cards { proxy_pass http://order; }
        location /api/v1/subscriptions { proxy_pass http://order; }

        # --- payment ---
        location /api/v1/payments { proxy_pass http://payment; }
        location /api/v1/dunning { proxy_pass http://payment; }
        location /api/v1/commission { proxy_pass http://payment; }
        location /api/v1/settlement { proxy_pass http://payment; }

        # --- delivery ---
        location /api/v1/deliveries { proxy_pass http://delivery; }
        location /api/v1/zones { proxy_pass http://delivery; }
        location /api/v1/serviceability { proxy_pass http://delivery; }

        # --- notification ---
        location /api/v1/notifications { proxy_pass http://notification; }

        # --- admin ---
        location /api/v1/admin { proxy_pass http://admin; }

        location / {
            return 404;
        }
    }
}