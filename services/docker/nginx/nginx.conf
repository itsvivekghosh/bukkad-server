worker_processes auto;

events { worker_connections 1024; }

http {
    # Upstream names must match the docker-compose service names (this file
    # is mounted into the compose network; the Spring Cloud Gateway is NOT
    # part of the container stack — nginx is the edge router there).
    upstream identity        { server identity:8080; }
    upstream restaurant      { server restaurant:8080; }
    upstream order           { server order:8080; }
    upstream payment         { server payment:8080; }
    upstream delivery        { server delivery:8080; }
    upstream notification    { server notification:8080; }
    upstream admin           { server admin-analytics:8080; }
    upstream search          { server search:8080; }
    upstream survey          { server survey:8080; }
    upstream referral        { server referral:8080; }
    upstream support         { server supportticket:8080; }

    server {
        listen 80;
        server_name _;

        # --- survey (P2) — declared FIRST: /reviews/survey and
        # /restaurants/public/*/survey-ratings are narrower than the
        # restaurant slice's /reviews/** and /restaurants/** predicates.
        location = /api/v1/reviews/survey        { proxy_pass http://survey; }
        location ~ ^/api/v1/restaurants/public/[0-9]+/survey-ratings$ { proxy_pass http://survey; }
        location = /api/v1/home/trending         { proxy_pass http://survey; }

        # --- referral (P2): referral codes + affiliate admin.
        location /api/v1/referrals/     { proxy_pass http://referral; }
        location /api/v1/admin/affiliates { proxy_pass http://referral; }

        # --- support tickets (P2).
        location /api/v1/support/ { proxy_pass http://support; }

        # --- identity ---
        location /api/v1/auth/    { proxy_pass http://identity; }
        location /api/v1/tenants  { proxy_pass http://identity; }
        location /api/v1/affiliate { proxy_pass http://identity; }
        # Wallet routes to payment, so must come before generic customers/ route
        location ~ ^/api/v1/customers/[0-9]+/wallet { proxy_pass http://payment; }
        location /api/v1/customers/  { proxy_pass http://identity; }

        # --- restaurant ---
        # NOTE: /api/v1/search is NOT here — the dedicated search service owns
        # unified search + autocomplete (see below).
        location /api/v1/restaurants/  { proxy_pass http://restaurant; }
        location /api/v1/restaurants   { proxy_pass http://restaurant; }
        location /api/v1/reviews/      { proxy_pass http://restaurant; }
        location /api/v1/admin/reviews { proxy_pass http://restaurant; }
        location /api/v1/cuisines      { proxy_pass http://restaurant; }
        location /api/v1/inventory     { proxy_pass http://restaurant; }
        location /api/v1/pricing       { proxy_pass http://restaurant; }
        location /api/v1/menu          { proxy_pass http://restaurant; }
        location /api/v1/feed          { proxy_pass http://restaurant; }

        # --- search service (P1): unified search + autocomplete.
        location /api/v1/search { proxy_pass http://search; }

        # --- order ---
        # Order-specific customer routes must come before generic customers/
        location ~ ^/api/v1/customers/[0-9]+/cart          { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/reorder       { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/group-orders  { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/subscriptions { proxy_pass http://order; }
        location ~ ^/api/v1/customers/[0-9]+/disputes      { proxy_pass http://order; }
        location /api/v1/orders         { proxy_pass http://order; }
        location /api/v1/cart           { proxy_pass http://order; }
        location /api/v1/coupons        { proxy_pass http://order; }
        location /api/v1/gift-cards     { proxy_pass http://order; }
        location /api/v1/subscriptions  { proxy_pass http://order; }

        # --- payment ---
        # Webhooks: authenticated by the provider's HmacSHA256 signature inside
        # the payment service — no customer auth applies to this subtree.
        location /api/v1/payments/webhooks/ { proxy_pass http://payment; }
        location /api/v1/payments     { proxy_pass http://payment; }
        location /api/v1/dunning      { proxy_pass http://payment; }
        location /api/v1/commission   { proxy_pass http://payment; }
        location /api/v1/settlement   { proxy_pass http://payment; }

        # --- delivery ---
        location /api/v1/deliveries    { proxy_pass http://delivery; }
        location /api/v1/delivery      { proxy_pass http://delivery; }
        location /api/v1/zones         { proxy_pass http://delivery; }
        location /api/v1/serviceability { proxy_pass http://delivery; }

        # --- notification ---
        location /api/v1/notifications { proxy_pass http://notification; }

        # --- admin (fraud, churn, compliance, experiments, analytics) ---
        location /api/v1/admin { proxy_pass http://admin; }

        location / {
            return 404;
        }
    }
}