# Production nginx configuration for Bhukkad
# Terminates TLS, enforces security headers, rate limits, and routes to gateway

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # --- Upstreams ---
    # All API traffic goes through the Spring Cloud Gateway (single entry point)
    upstream gateway {
        server gateway:8080;
        keepalive 256;
    }

    # Rate limiting zones (shared memory, 10MB ~ 160k keys)
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=5000r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_cart:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=api_order:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=api_payment:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=api_webhook:10m rate=1000r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Buffer sizes for proxying
    proxy_buffer_size 8k;
    proxy_buffers 8 8k;
    proxy_busy_buffers_size 16k;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Hide nginx version
    server_tokens off;

    # Access log format with trace ID
    log_format main_with_trace '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'trace_id=$http_x_correlation_id '
                               'rt=$request_time uct=$upstream_connect_time '
                               'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main_with_trace buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml application/atom+xml;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;

        # Allow ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (mounted from /etc/nginx/certs)
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # OCSP stapling resolver
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Client body limits
        client_max_body_size 10M;
        client_body_buffer_size 128k;

        # Global rate limit (burst allows burst of 2x rate)
        limit_req zone=api_global burst=10000 nodelay;
        limit_conn conn_limit 1000;

        # Health check endpoint (no rate limit)
        location = /health {
            access_log off;
            proxy_pass http://gateway/actuator/health/liveness;
        }

        location = /ready {
            access_log off;
            proxy_pass http://gateway/actuator/health/readiness;
        }

        # Auth endpoints - stricter rate limit
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=200 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Cart mutations - medium rate limit
        location /api/v1/cart/ {
            limit_req zone=api_cart burst=1000 nodelay;
            limit_conn conn_limit 200;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Order endpoints - medium rate limit
        location /api/v1/orders/ {
            limit_req zone=api_order burst=500 nodelay;
            limit_conn conn_limit 200;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Payment endpoints - strict rate limit
        location /api/v1/payments/ {
            limit_req zone=api_payment burst=200 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Webhook endpoints - higher rate limit for provider callbacks
        location /api/v1/payments/webhooks/ {
            limit_req zone=api_webhook burst=2000 nodelay;
            limit_conn conn_limit 500;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Search endpoints - moderate rate limit
        location /api/v1/search/ {
            limit_req zone=api_global burst=2000 nodelay;
            limit_conn conn_limit 300;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Live/SSE endpoints - connection limit only, no rate limit
        location /api/v1/live/ {
            limit_conn conn_limit 500;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
            proxy_cache off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # All other API traffic
        location /api/ {
            limit_req zone=api_global burst=5000 nodelay;
            limit_conn conn_limit 500;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }

        # Metrics/monitoring (internal only - restrict in production)
        location /actuator/ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default: 404
        location / {
            return 404;
        }
    }
}