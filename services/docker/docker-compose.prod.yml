# Production environment - Production-ready with proper resources, no debug features
# Usage: docker-compose -f docker-compose.prod.yml up -d
# Requires: External PostgreSQL, Redis, Kafka (managed services)
# Or run with: docker-compose -f docker-compose.prod.yml -f docker-compose.infra.yml up -d

name: bhukkad-prod

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: '8080'
  REDIS_HOST: ${REDIS_HOST:-redis}
  SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_SSL: ${REDIS_SSL:-false}
  JWT_SECRET: ${JWT_SECRET}
  # RS256 verification. Without this the platform validator falls back to
  # HMAC, every gateway-forwarded request is rejected 401, and the order
  # circuit breaker trips (surfacing as a 503 fallback).
  JWKS_URL: ${JWKS_URL:-http://identity:8080/.well-known/jwks.json}
  SERVICE_JWT_SECRET: ${SERVICE_JWT_SECRET}
  TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY:-0.05}
  EVENTS_EXTERNAL_ENABLED: 'true'
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  JAVA_OPTS: >-
    -XX:+UseContainerSupport
    -XX:MaxRAMPercentage=75.0
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+ExitOnOutOfMemoryError
    -XX:+UseStringDeduplication
    -Djava.security.egd=file:/dev/./urandom
    -Dserver.address=0.0.0.0
    -Dspring.jmx.enabled=false
    -Dspring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
  SERVER_ADDRESS: 0.0.0.0

x-common-deploy: &common-deploy
  resources:
    limits:
      memory: 2G
    reservations:
      memory: 1G

x-prod-depends: &prod-depends
  redis-1:
    condition: service_healthy
  redis-sentinel-1:
    condition: service_healthy

x-redis-sentinel-common: &redis-sentinel-common
  image: redis:7-alpine
  restart: always
  init: true
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

x-redis-common: &redis-common
  image: redis:7-alpine
  restart: always
  init: true
  command:
    - redis-server
    - --appendonly
    - 'yes'
    - --maxmemory
    - ${REDIS_MAXMEMORY:-512mb}
    - --maxmemory-policy
    - volatile-lru
    - --requirepass
    - ${REDIS_PASSWORD}
    - --masterauth
    - ${REDIS_PASSWORD}
  volumes:
    - bhukkad-redis-data:/data
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # External infrastructure - uncomment if running locally for prod testing
  postgres:
    image: postgres:16-alpine
    container_name: bhukkad-postgres
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Heavy traffic settings (applied via ALTER SYSTEM in 01-postgres-config.sql)
      # max_connections = 5000, shared_buffers = 2GB, effective_cache_size = 6GB
    volumes:
      - bhukkad-pgdata:/var/lib/postgresql/data
      - ./initdb/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
      - ./initdb/01-postgres-config.sql:/docker-entrypoint-initdb.d/01-postgres-config.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d core"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  pgbouncer:
    image: pgbouncer/pgbouncer:1.22
    container_name: bhukkad-pgbouncer
    environment:
      PG_BOUNCER_DB: core
      PG_BOUNCER_USER: app
      PG_BOUNCER_PASSWORD: ${POSTGRES_PASSWORD}
      PG_BOUNCER_POOL_MODE: transaction
      PG_BOUNCER_MAX_CLIENT_CONN: 10000
      PG_BOUNCER_DEFAULT_POOL_SIZE: 500
      PG_BOUNCER_MIN_POOL_SIZE: 100
      PG_BOUNCER_RESERVE_POOL_SIZE: 50
    ports:
      - 6432:6432
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "core", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis Sentinel HA setup (3 sentinels + 3 redis nodes)
  redis-sentinel-1:
    <<: *redis-sentinel-common
    container_name: bhukkad-redis-sentinel-1
    command:
      - redis-sentinel
      - /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - 26379:26379
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-2:
    <<: *redis-sentinel-common
    container_name: bhukkad-redis-sentinel-2
    command:
      - redis-sentinel
      - /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - 26380:26379
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sentinel-3:
    <<: *redis-sentinel-common
    container_name: bhukkad-redis-sentinel-3
    command:
      - redis-sentinel
      - /etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    ports:
      - 26381:26379
    depends_on:
      - redis-1
      - redis-2
      - redis-3
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-1:
    <<: *redis-common
    container_name: bhukkad-redis-1
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replica-announce-ip
      - redis-1
      - --replica-announce-port
      - "6379"
    ports:
      - 6379:6379
    volumes:
      - bhukkad-redis-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-2:
    <<: *redis-common
    container_name: bhukkad-redis-2
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-1
      - "6379"
      - --replica-announce-ip
      - redis-2
      - --replica-announce-port
      - "6379"
    ports:
      - 6380:6379
    volumes:
      - bhukkad-redis-2-data:/data
    depends_on:
      - redis-1
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-3:
    <<: *redis-common
    container_name: bhukkad-redis-3
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
      - --replicaof
      - redis-1
      - "6379"
      - --replica-announce-ip
      - redis-3
      - --replica-announce-port
      - "6379"
    ports:
      - 6381:6379
    volumes:
      - bhukkad-redis-3-data:/data
    depends_on:
      - redis-1
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity service
  identity:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      IDENTITY_DB_URL: ${IDENTITY_DB_URL}
      # Referral module lives in the engagement service (ADR-005 codegen).
      ENGAGEMENT_SERVICE_URL: ${ENGAGEMENT_SERVICE_URL:-http://engagement:8080}
      APP_BOOTSTRAPADMIN_ENABLED: 'false'
      APP_SECURITY_PASSWORD_ENCODER_ALGORITHM: argon2
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-20}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-10}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/identity:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Commerce service (order + payment + delivery)
  commerce:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      COMMERCE_DB_URL: ${COMMERCE_DB_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog:8080}
      ENGAGEMENT_SERVICE_URL: ${ENGAGEMENT_SERVICE_URL:-http://engagement:8080}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-30}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-15}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/commerce:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Catalog service
  catalog:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      CATALOG_DB_URL: ${CATALOG_DB_URL}
      COMMERCE_SERVICE_URL: ${COMMERCE_SERVICE_URL:-http://commerce:8080}
      ENGAGEMENT_SERVICE_URL: ${ENGAGEMENT_SERVICE_URL:-http://engagement:8080}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-20}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-10}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/catalog:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Engagement service
  engagement:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      ENGAGEMENT_DB_URL: ${ENGAGEMENT_DB_URL}
      COMMERCE_SERVICE_URL: ${COMMERCE_SERVICE_URL:-http://commerce:8080}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog:8080}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-25}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-12}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/engagement:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Admin service
  admin:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      ADMIN_DB_URL: ${ADMIN_DB_URL}
      COMMERCE_SERVICE_URL: ${COMMERCE_SERVICE_URL:-http://commerce:8080}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog:8080}
      ENGAGEMENT_SERVICE_URL: ${ENGAGEMENT_SERVICE_URL:-http://engagement:8080}
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-15}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-8}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/admin:${VERSION:-latest}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Gateway
  gateway:
    restart: always
    init: true
    environment:
      <<: *common-env
      SERVER_PORT: '8080'
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity:8080}
      COMMERCE_SERVICE_URL: ${COMMERCE_SERVICE_URL:-http://commerce:8080}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog:8080}
      ENGAGEMENT_SERVICE_URL: ${ENGAGEMENT_SERVICE_URL:-http://engagement:8080}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:-http://admin:8080}
      SPRING_PROFILES_ACTIVE: prod
      spring.datasource.hikari.maximum-pool-size: ${DB_POOL_SIZE:-10}
      spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN:-5}
    deploy: *common-deploy
    depends_on: *prod-depends
    image: ghcr.io/bhukkad/gateway:${VERSION:-latest}
    ports:
      - 8095:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Edge proxy
  nginx:
    image: nginx:1.27-alpine
    container_name: bhukkad-nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - identity
      - commerce
      - catalog
      - engagement
      - admin
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  bhukkad-redis-1-data:
    driver: local
  bhukkad-redis-2-data:
    driver: local
  bhukkad-redis-3-data:
    driver: local
  bhukkad-pgdata:
    driver: local