version: "3.8"

services:
  postgres:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  identity:
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8081:8080"]
  order:
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8083:8080"]
