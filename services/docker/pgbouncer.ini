# PgBouncer Configuration for 200k+ TPS
# Transaction pooling mode - optimal for high-throughput OLTP workloads

[databases]
; Core database - connects to PostgreSQL
core = host=postgres port=5432 dbname=core user=app password=app_pass

[pgbouncer]
; Database name for admin connections
database = pgbouncer

; Admin users who can connect to pgbouncer database for stats
admin_users = admin, stats_user

; Pool mode: transaction (recommended for 200k+ TPS), session, or statement
pool_mode = transaction

; Maximum client connections PgBouncer will accept
max_client_conn = 10000

; Default pool size per database/user pair
default_pool_size = 500

; Minimum pool size
min_pool_size = 100

; Reserve pool for superuser connections
reserve_pool_size = 10
reserve_pool_timeout = 5

; Connection lifetime settings
max_connection_lifetime = 3600
idle_timeout = 600

; Query timeout (0 = no limit)
query_timeout = 30
query_wait_timeout = 120

; Stats tracking
stats_period = 60

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1

; Network
listen_addr = *
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; TLS (disabled for local dev, enable in production)
; client_tls_sslmode = require
; client_tls_ca_file = /etc/pgbouncer/tls/ca.crt
; client_tls_cert_file = /etc/pgbouncer/tls/server.crt
; client_tls_key_file = /etc/pgbouncer/tls/server.key

; Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10

; Packet buffer sizes
pkt_buf = 4096
listen_backlog = 1024

; Server connection settings
server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_check_delay = 30
server_check_query = SELECT 1
server_fast_close = 1

; Ignore startup parameters that PgBouncer doesn't support
ignore_startup_parameters = extra_float_digits, application_name, options

; Application name tracking
application_name_add_host = 1