spring:
  application:
    name: growth-service
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:growth}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration-pg
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 1000

server:
  port: 8089
  tomcat:
    threads:
      max: 100
    accept-count: 200

app:
  growth:
    loyalty:
      points-per-rupee: 1
      sign-up-bonus: 100
      referral-bonus: 50
      redemption-ratio: 100
      min-redemption-points: 100
      # Abuse ceiling: max points grantable per customer per calendar day
      # across all credit sources; over-cap credits are rejected with 422.
      daily-credit-cap-points: ${LOYALTY_DAILY_CREDIT_CAP:10000}
      # Nightly ledger->balance reconciliation (ShedLock-locked).
      reconciliation-cron: ${LOYALTY_RECONCILIATION_CRON:0 30 3 * * *}
    referral:
      max-referrals-per-user: 10
      referred-user-reward: 100
      referrer-reward: 50
      # Abuse ceilings for POST /referral/apply (atomic Redis limiter).
      apply-per-customer-per-day: ${REFERRAL_APPLY_PER_CUSTOMER_PER_DAY:5}
      apply-per-ip-per-day: ${REFERRAL_APPLY_PER_IP_PER_DAY:20}
    campaign:
      max-discount-percent: 50
      default-priority: 0
  services:
    referral:
      url: ${REFERRAL_SERVICE_URL:http://referral:8084}

  auth:
    jwt:
      # Per-service JWT validation (platform-lib PlatformJwtValidator). Empty
      # secret = auth filter inactive in dev (protected endpoints then 401);
      # set JWT_SECRET (shared HS256 secret) or JWKS_URL (RS256 via Keycloak)
      # to enable. Never commit a default secret.
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState