spring:
  application:
    name: personalization-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:personalization}
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration-pg
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8088

app:
  recommendations:
    max-items: 10
    co-ordered-item-limit: 50
    customer-affinity-limit: 25
    top-restaurants-limit: 3
  auth:
    jwt:
      # Per-service JWT validation (platform-lib PlatformJwtValidator). Empty
      # secret = auth filter inactive in dev (protected endpoints then 401);
      # set JWT_SECRET (shared HS256 secret) or JWKS_URL (RS256 via Keycloak)
      # to enable. Never commit a default secret.
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

