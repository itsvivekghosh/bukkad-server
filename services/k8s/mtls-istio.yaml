# Istio mTLS configuration for the Bhukkad microservices mesh.
# Requires a service mesh (Istio, Linkerd, etc.) with PeerAuthentication
# and DestinationRule CRDs installed. Apply with:
#   kubectl apply -f services/k8s/mtls-istio.yaml
#
# Reference: https://istio.io/latest/docs/concepts/security/#mutual-tls
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: bhukkad-default
  namespace: bhukkad
spec:
  # STRICT mTLS: every service in the namespace rejects plain-text traffic.
  # All inter-service communication must use mutual TLS.
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bhukkad-mtls
  namespace: bhukkad
spec:
  host: "*.bhukkad.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL