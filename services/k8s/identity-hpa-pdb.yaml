# HPA + PDB reference for identity (plan §11/P8).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 80}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: identity}
