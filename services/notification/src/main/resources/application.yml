server:
  port: 8085
  tomcat:
    threads:
      max: 100
    accept-count: 200
spring:
  application: {name: notification}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USERNAME:app}
    password: ${NOTIFICATION_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 1000
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint:

      health:

        probes:

          enabled: true

        group:

          liveness:

            include: livenessState

          readiness:

            include: readinessState
logging: {level: {com.bhukkad: INFO}}

app:
  environment: production
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:notification-platform-consumer}
        platform-topic: notification.events.v1
        dlq-topic: notification.events.v1.dlt
