server:
  port: 8085
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
    accept-count: 200
    max-connections: 4096
    connection-timeout: 10s
    max-swallow-size: 2MB
  max-http-request-header-size: 8KB
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application: {name: notification}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${NOTIFICATION_DB_USERNAME:app}
    password: ${NOTIFICATION_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 256
          min-idle: 8
          max-idle: 32
          max-wait: 5s
      # Optional Redis Sentinel (enable by setting REDIS_SENTINEL_MASTER)
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        nodes: ${REDIS_SENTINEL_NODES:}
        password: ${REDIS_SENTINEL_PASSWORD:}
      # Optional Redis Cluster (enable by setting REDIS_CLUSTER_NODES)
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3
management:
  metrics:
    enable:
      lettuce: true
      reactor.netty: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint:

      health:

        probes:

          enabled: true

        group:

          liveness:

            include: livenessState

          readiness:

            include: readinessState
resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 20
        wait-duration-in-open-state: 20s
        sliding-window-size: 100
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.data.redis.RedisConnectionFailureException
          - java.lang.RuntimeException

logging: {level: {com.bhukkad: INFO}}

app:
  environment: production
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:notification-platform-consumer}
        platform-topic: notification.events.v1
        dlq-topic: notification.events.v1.dlt
        producer:
          acks: all
          retries: 10
          max-in-flight-requests-per-connection: 5
          linger-ms: 5
          batch-size: 16384
          compression-type: lz4
        consumer:
          max-poll-records: 1000
          session-timeout-ms: 30000
          heartbeat-interval-ms: 10000
          auto-offset-reset: earliest
          max-poll-interval-ms: 300000
          concurrency: 3

  rate-limit:
    enabled: true
    fail-open-on-redis-error: true
    buckets:
      order-track:
        limit: 20
        window-seconds: 60
      kitchen-queue:
        limit: 30
        window-seconds: 60
      search:
        limit: 60
        window-seconds: 60
      cart-mutation:
        limit: 30
        window-seconds: 60
      referral:
        limit: 20
        window-seconds: 60
      webhook:
        limit: 120
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0