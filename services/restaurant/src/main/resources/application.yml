server:
  port: 8082

spring:
  application:
    name: restaurant
  datasource:
    url: ${RESTAURANT_DB_URL:jdbc:postgresql://localhost:5432/bhukkad_restaurants}
    username: ${RESTAURANT_DB_USERNAME:bhukkad}
    password: ${RESTAURANT_DB_PASSWORD:bhukkad_dev}
    hikari:
      maximum-pool-size: ${RESTAURANT_DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    # V1 (platform-lib baseline) + V2+ (this service) all live under the same
    # classpath location; Flyway merges them from the common jar and this jar.
    locations: classpath:db/migration-pg
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.bhukkad: INFO

app:
  environment: production
  auth:
    jwt:
      # Per-service JWT validation (platform-lib PlatformJwtValidator). Empty
      # secret = auth filter inactive in dev (protected endpoints then 401);
      # set JWT_SECRET (shared HS256 secret) or JWKS_URL (RS256 via Keycloak)
      # to enable.
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:restaurant-platform-consumer}
        platform-topic: restaurant.events.v1
        dlq-topic: restaurant.events.v1.dlt
