spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/_db
    username: app
    password: app_pass

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.bhukkad: DEBUG

app:
  environment: development
  events:
    external:
      enabled: true
      type: log