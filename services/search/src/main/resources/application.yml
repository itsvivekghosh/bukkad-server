server:
  port: 8082
  tomcat:
    threads:
      max: 100
    accept-count: 200
spring:
  application: {name: search}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/search}
    username: ${SEARCH_DB_USERNAME:app}
    password: ${SEARCH_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint:

      health:

        probes:

          enabled: true

        group:

          liveness:

            include: livenessState

          readiness:

            include: readinessState
logging: {level: {com.bhukkad: INFO}}

app:
  # P3 dead-config sweep (grep-verified, services tree): removed
  # app.environment (zero consumers; every env value is injected via the
  # spring profiles), app.service.search-url and app.service.menu-url
  # (self/menu URLs were never referenced — the only outbound call is the
  # restaurant sync below). Survey's app.service.{order,customer}-url lives
  # in the SURVEY module and is owned by another batch — not touched here.
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  service:
    # Only restaurant-url has a consumer today (SearchSourceClient sync).
    restaurant-url: ${RESTAURANT_SERVICE_URL:http://localhost:8081}
  events:
    external:
      # ADR-002 search sync: when enabled+type=kafka the restaurant outbox
      # stream drives the search projections (SearchSyncEventConsumer). With
      # the gate off the periodic reconciliation sweep is the only sync path.
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:search-sync-consumer}
        platform-topic: ${PLATFORM_EVENTS_TOPIC:search.events.v1}
        dlq-topic: ${PLATFORM_EVENTS_DLQ_TOPIC:search.events.v1.dlt}
  search:
    fuzzy:
      # P-08 open product decision, shipped OFF. When true, /api/v1/search
      # ranks via word_similarity() over the V11 pg_trgm ground work (typo
      # tolerant). The default escaped LIKE path + V9 varchar_pattern_ops
      # prefix indexes stay authoritative until product flips this flag.
      enabled: ${SEARCH_FUZZY_ENABLED:false}
      # word_similarity() cutoff used by the fuzzy queries (pg_trgm default).
      similarity-threshold: ${SEARCH_FUZZY_SIMILARITY_THRESHOLD:0.3}
    sync:
      # Periodic reconciliation sweep (source-of-truth re-read, bounded).
      enabled: ${SEARCH_SYNC_RECONCILIATION_ENABLED:true}
      interval-ms: ${SEARCH_SYNC_SWEEP_INTERVAL_MS:300000}
      restaurants-per-cycle: ${SEARCH_SYNC_RESTAURANTS_PER_CYCLE:20}
