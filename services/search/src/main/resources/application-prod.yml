spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      lettuce:
        pool:
          enabled: true
          max-active: 64
          min-idle: 8
          max-idle: 32
          max-wait: 5s
      # Optional Redis Sentinel (enable by setting REDIS_SENTINEL_MASTER)
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        nodes: ${REDIS_SENTINEL_NODES:}
        password: ${REDIS_SENTINEL_PASSWORD:}
      # Optional Redis Cluster (enable by setting REDIS_CLUSTER_NODES)
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3


  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_SIZE:10}
      metrics-tracker-class: com.zaxxer.hikari.metrics.prometheus.PrometheusMetricsTracker

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:15}
        minimum-idle: 5
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
  environment: production
  search:
    elasticsearch:
      enabled: ${ELASTICSEARCH_ENABLED:true}
      host: ${ELASTICSEARCH_HOST:elasticsearch.bhukkad.svc.cluster.local}
      port: ${ELASTICSEARCH_PORT:9200}
      username: ${ELASTICSEARCH_USERNAME:elastic}
      password: ${ELASTICSEARCH_PASSWORD:}

  events:
    external:
      enabled: true
      type: kafka
      kafka:
        listener-concurrency: 3
  outbox:
    wake:
      enabled: true
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}