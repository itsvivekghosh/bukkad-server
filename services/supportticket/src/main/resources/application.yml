server:
  port: 8086
  tomcat:
    threads:
      max: 100
    accept-count: 200
spring:
  application: {name: supportticket}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${SUPPORT_DB_URL:jdbc:postgresql://localhost:5432/support}
    username: ${SUPPORT_DB_USERNAME:app}
    password: ${SUPPORT_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
management:
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint: {health: {probes: {enabled: true}}}
app:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
    service:
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: order,payment,delivery,growth
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  services:
    payment:
      url: ${PAYMENT_SERVICE_URL:http://payment:8093}
      order:
        url: ${ORDER_SERVICE_URL:http://order:8092}
logging: {level: {com.bhukkad: INFO}}
