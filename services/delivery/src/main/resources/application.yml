server: {port: 8085}
spring:
  application: {name: delivery}
  datasource:
    url: ${DELIVERY_DB_URL:jdbc:postgresql://localhost:5432/bhukkad_delivery}
    username: ${DELIVERY_DB_USERNAME:bhukkad}
    password: ${DELIVERY_DB_PASSWORD:bhukkad_dev}
    hikari: {maximum-pool-size: 20}
  jpa: {hibernate: {ddl-auto: none}, open-in-view: false}
  flyway: {enabled: true, locations: classpath:db/migration-pg, baseline-on-migrate: true}
management:
  endpoints: {web: {exposure: {include: health,info,metrics,prometheus}}}
  endpoint: {health: {probes: {enabled: true}}}
logging: {level: {com.bhukkad: INFO}}

app:
  environment: production
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:delivery-platform-consumer}
        platform-topic: delivery.events.v1
        dlq-topic: delivery.events.v1.dlt
