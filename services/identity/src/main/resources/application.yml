server:
  port: 8081
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 100
    accept-count: 200
    connection-timeout: 10s
    max-swallow-size: 2MB
  max-http-request-header-size: 8KB
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: identity
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:12}
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${IDENTITY_DB_USERNAME:app}
    password: ${IDENTITY_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${IDENTITY_DB_POOL_SIZE:20}
      minimum-idle: 20
      connection-timeout: 3000
      keepalive-time: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        query_plan_cache_size: 200
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-pg
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 64
          min-idle: 8
          max-idle: 32
          max-wait: 5s
      # Optional Redis Sentinel (enable by setting REDIS_SENTINEL_MASTER)
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:}
        nodes: ${REDIS_SENTINEL_NODES:}
        password: ${REDIS_SENTINEL_PASSWORD:}
      # Optional Redis Cluster (enable by setting REDIS_CLUSTER_NODES)
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:}
        max-redirects: 3

app:
  auth:
    jwt:
      # Per-service JWT validation (platform-lib PlatformJwtValidator). Empty
      # secret = auth filter inactive in dev (protected endpoints then 401);
      # set JWT_SECRET (shared HS256 secret) or JWKS_URL (RS256 via Keycloak)
      # to enable. jwks-url defaults to identity's own well-known path so the
      # RS256 cutover works with zero coordination (ADR-004).
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
      # ADR-004 dual-key grace: HS256 legacy tokens stay verifiable until this
      # flag is flipped (default on during the cutover window).
      hmac-grace-enabled: ${JWT_HMAC_GRACE:true}
    # Brute-force lockout on the public credential endpoints (feature #5):
    # per-(email, IP) counters with an exponentially escalating lock window.
    lockout:
      threshold: ${AUTH_LOCKOUT_THRESHOLD:5}
      failure-window-seconds: ${AUTH_LOCKOUT_WINDOW:900}
      base-lock-seconds: ${AUTH_LOCKOUT_BASE:300}
      max-lock-seconds: ${AUTH_LOCKOUT_MAX:3600}
      strikes-ttl-seconds: ${AUTH_LOCKOUT_STRIKES_TTL:86400}
    service:
      # Service-to-service auth (ServiceJwtAuthFilter, platform-lib). Shared
      # mesh secret; internal paths REQUIRE a valid service token when the
      # secret is set. allowed-services is deny-by-default.
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,restaurant,order,payment,delivery,notification,search,admin-analytics,survey,referral,supportticket,realtime,personalization,growth}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  jwt:
    # HMAC secret for the ADR-004 grace window (legacy HS256 verification).
    # New tokens are RS256; production must set the RSA key envs below.
    secret: ${JWT_SECRET:}
    # RS256 signing key (ADR-004): env-provided PKCS#8 PEM first, then a PEM
    # file path (k8s Secret volume), else auto-generated + persisted under
    # key-dir (dev only — prod fails fast without env keys).
    rsa:
      private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      key-dir: ${JWT_RSA_KEY_DIR:}
      key-id: ${JWT_KEY_ID:}
    # Issued claims: iss=bhukkad-identity (JwtService constant),
    # aud defaults to bhukkad-api; override per deployment.
    audience: ${JWT_AUDIENCE:bhukkad-api}
    # Legacy token horizon — kept only for backward compatibility; the bearer
    # path uses access-ttl-minutes below.
    ttl-minutes: ${JWT_TTL_MINUTES:1440}
    # Short-lived access tokens (HS256 JWT). Renewal happens through the
    # rotating, revocable refresh-token store, never by extending this TTL.
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    # Absolute refresh-token session horizon in days; rotation never extends
    # a session past its issue-time + refresh-ttl-days.
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  events:
    external:
      enabled: false
      type: log
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:identity-platform-consumer}
        platform-topic: identity.events.v1
        dlq-topic: identity.events.v1.dlt
        producer:
          acks: all
          retries: 10
          max-in-flight-requests-per-connection: 5
          linger-ms: 5
          batch-size: 16384
          compression-type: lz4
        consumer:
          max-poll-records: 500
          session-timeout-ms: 30000
          heartbeat-interval-ms: 10000
          auto-offset-reset: earliest
          max-poll-interval-ms: 300000

  rate-limit:
    enabled: true
    fail-open-on-redis-error: true
    buckets:
      order-track:
        limit: 20
        window-seconds: 60
      kitchen-queue:
        limit: 30
        window-seconds: 60
      search:
        limit: 60
        window-seconds: 60
      cart-mutation:
        limit: 30
        window-seconds: 60
      referral:
        limit: 20
        window-seconds: 60
      webhook:
        limit: 120
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0
management:
  metrics:
    enable:
      lettuce: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 30
        wait-duration-in-open-state: 20s
        sliding-window-size: 20
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.data.redis.RedisConnectionFailureException
          - java.lang.RuntimeException

logging:
  level:
    com.bhukkad: INFO