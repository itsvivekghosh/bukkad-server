spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-0.bhukkad:6379,redis-1.bhukkad:6379,redis-2.bhukkad:6379,redis-3.bhukkad:6379,redis-4.bhukkad:6379,redis-5.bhukkad:6379}
        max-redirects: 3
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      lettuce:
        pool:
          enabled: true
          max-active: 200
          min-idle: 50
          max-idle: 100
          max-wait: 5000ms

  datasource:
    hikari:
      maximum-pool-size: 200
      minimum-idle: 50
      leak-detection-threshold: 5000
      metrics-tracker-class: com.zaxxer.hikari.metrics.prometheus.PrometheusMetricsTracker
      validation-timeout: 2000
      connection-test-query: SELECT 1

  # ADR-004: disable HMAC grace in prod — RS256-only verification
  auth:
    jwt:
      hmac-grace-enabled: false

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:true}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:100}
        minimum-idle: 20
        connection-timeout: 5000
        validation-timeout: 2000
        connection-test-query: SELECT 1
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
        auto-commit: false
  environment: production
  events:
    external:
      enabled: true
      type: kafka
      kafka:
        listener-concurrency: 3
  outbox:
    wake:
      enabled: true
management:
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}
