server:
  port: 8082
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      virtual: true
    accept-count: 200
    max-connections: 4096
    connection-timeout: 10s
    max-swallow-size: 2MB
  max-http-request-header-size: 8KB
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: engagement
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Startup optimizations
  main:
    lazy-initialization: true
    banner-mode: "off"
    allow-bean-definition-overriding: true
  task:
    scheduling:
      pool:
        size: 8
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 2000
  datasource:
    url: ${ENGAGEMENT_DB_URL:jdbc:postgresql://localhost:5432/engagement}
    username: ${ENGAGEMENT_DB_USERNAME:app}
    password: ${ENGAGEMENT_DB_PASSWORD:app_pass}
    hikari:
      maximum-pool-size: ${ENGAGEMENT_DB_POOL_SIZE:20}
      minimum-idle: 10
      connection-timeout: 5000
      validation-timeout: 2000
      connection-test-query: SELECT 1
      keepalive-time: 300000
      max-lifetime: 1800000
      initialization-fail-timeout: 0
      auto-commit: false
      leak-detection-threshold: 5000
  jpa:
    hibernate:
      ddl-auto: none
    repositories:
      enabled: true
      bootstrap-mode: deferred
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: UTC
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        query_plan_cache_size: 200
        query_plan_cache_parameter_metadata_max_size: 20
        temp:
          use_jdbc_metadata_defaults: false
        globally_quoted_identifiers: false
        id:
          new_generator_mappings: true
        hbm2ddl:
          auto: none
        generate_statistics: false
        cache:
          use_second_level_cache: false
          use_query_cache: false
        connection:
          provider_disables_autocommit: true
        bytecode:
          provider: bytebuddy
          use_reflection_optimizer: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-pg,classpath:db/migration-social
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: true
    clean-disabled: true
    callbacks: com.bhukkad.common.db.MigrationCallbacks
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000
      connect-timeout: 3000
      repositories:
        enabled: true
        bootstrap-mode: deferred
      lettuce:
        pool:
          enabled: true
          # High-throughput service (docs/architecture-audit.md §4.2):
          # max-active 64 / max-idle 24 / min-idle 8 / max-wait 2s to prevent
          # pool exhaustion under concurrent cache + rate-limit traffic.
          max-active: 64
          min-idle: 8
          max-idle: 24
          max-wait: 2000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.jms.JmsAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration
  banner:
    location: classpath:banner.txt
    charset: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health,info
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: false
    enable:
      jvm: false
      process: false
      system: false
  health:
    db:
      enabled: true
    redis:
      enabled: true
    defaults:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://tempo:9411/api/v2/spans}

resilience4j:
  circuitbreaker:
    configs:
      default:
        failure-rate-threshold: 20
        wait-duration-in-open-state: 20s
        sliding-window-size: 100
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.data.redis.RedisConnectionFailureException
          - java.lang.RuntimeException

app:
  datasource:
    read-replica:
      enabled: ${DB_REPLICA_ENABLED:false}
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: ${DB_REPLICA_POOL_SIZE:10}
        minimum-idle: 5
        connection-timeout: 3000
        validation-timeout: 3000
        connection-test-query: SELECT 1
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
        auto-commit: false
  environment: production
  services:
    restaurant:
      url: ${APP_SERVICES_RESTAURANT_URL:${CATALOG_SERVICE_URL:http://localhost:8081}}
    commerce:
      url: ${COMMERCE_SERVICE_URL:http://localhost:8080}
    catalog:
      url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    admin:
      url: ${ADMIN_SERVICE_URL:http://localhost:8083}
    order:
      url: ${COMMERCE_SERVICE_URL:http://commerce:8080}
    referral:
      url: ${APP_SERVICES_REFERRAL_URL:http://localhost:8080}
  live:
    order-base-url: ${COMMERCE_SERVICE_URL:http://commerce:8080}
  survey:
    order-base-url: ${COMMERCE_SERVICE_URL:http://commerce:8080}
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      jwks-url: ${JWKS_URL:http://identity:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:}
      audience: ${JWT_AUDIENCE:}
      hmac-grace-enabled: false
    service:
      jwt-secret: ${SERVICE_JWT_SECRET:}
      allowed-services: ${SERVICE_ALLOWED_SERVICES:gateway,identity,catalog,commerce,engagement,admin}
      enforce-internal-paths: ${SERVICE_AUTH_ENFORCE_INTERNAL:true}
  events:
    external:
      enabled: true
      type: kafka
      kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
        consumer-group: ${KAFKA_CONSUMER_GROUP:engagement-platform-consumer}
        platform-topic: notification.events.v1
        dlq-topic: notification.events.v1.dlt
        producer:
          acks: all
          retries: 10
          max-in-flight-requests-per-connection: 5
          linger-ms: 20
          batch-size: 16384
          compression-type: lz4
        max-poll-records: 200
        session-timeout-ms: 30000
        heartbeat-interval-ms: 10000
        max-poll-interval-ms: 300000
        listener-concurrency: 3
        enable-auto-commit: false
        dlq:
          enabled: true
          max-fetch-records: 100
  rate-limit:
    enabled: true
    fail-open-on-redis-error: false  # CR-09: Fail-closed by default
    buckets:
      search:
        limit: 60
        window-seconds: 60
      referral:
        limit: 20
        window-seconds: 60
      webhook:
        limit: 120
        window-seconds: 60
    tier-multipliers:
      premium: 2.0
      gold: 3.0
      platinum: 4.0
      free: 1.0

  # -----------------------------------------------------------------------------
  # Anti-Fraud Configuration
  # -----------------------------------------------------------------------------
  fraud:
    detection:
      default-risk-threshold: 50.0
      high-risk-threshold: 75.0
      critical-risk-threshold: 90.0
      enable-behavioral-analysis: true
      enable-image-analysis: true
      enable-claim-pattern-analysis: true
      enable-duplicate-detection: true
      same-customer-cooldown-minutes: 60
      same-attachment-cooldown-minutes: 1440
    scoring:
      weight-behavioral: 30.0
      weight-image-metadata: 25.0
      weight-claim-pattern: 30.0
      weight-duplicate-check: 35.0
      weight-timing-anomaly: 20.0
      weight-frequency: 15.0
      normalization-factor: 100.0
    attachments:
      max-file-size-bytes: 10485760
      allowed-mime-types:
        - "image/jpeg"
        - "image/png"
        - "image/webp"
        - "application/pdf"
      max-image-dimension: 4000
      analyze-exif: true
      check-image-integrity: true
    notifications:
      notify-admins: true
      notify-support: true
      auto-escalate-after-minutes: 60

# -----------------------------------------------------------------------------
# PROFILE: LOCAL (development)
# -----------------------------------------------------------------------------
---
spring:
  config:
    activate:
      on-profile: local
  main:
    lazy-initialization: true
    banner-mode: "off"
  flyway:
    validate-on-migrate: false
    baseline-on-migrate: true
    out-of-order: true
  cache:
    type: none
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      auto-commit: false
  data:
    redis:
      ssl:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,configprops
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.bhukkad: DEBUG
    org.springframework.web: DEBUG

# =============================================================================
# PROFILE: PROD (production)
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: false
    banner-mode: "off"
  flyway:
    validate-on-migrate: true
    baseline-on-migrate: true
    out-of-order: false
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 200
      minimum-idle: 50
      leak-detection-threshold: 5000
      connection-timeout: 5000
      validation-timeout: 2000
      auto-commit: false
    read-replica:
      enabled: true
      url: ${DB_REPLICA_URL:}
      username: ${DB_USERNAME:app}
      password: ${DB_PASSWORD:app_pass}
      hikari:
        maximum-pool-size: 100
        minimum-idle: 20
        connection-timeout: 5000
        validation-timeout: 2000
        connection-test-query: SELECT 1
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
        auto-commit: false
  data:
    redis:
      repositories:
        enabled: true
        bootstrap-mode: deferred
      lettuce:
        pool:
          max-active: 200
          min-idle: 50
          max-idle: 100
          max-wait: 5000ms
        shutdown-timeout: 100ms
        timeout: 5000ms
      ssl:
        enabled: true
  cache:
    type: redis
  server:
    tomcat:
      max-threads: 400
      min-spare-threads: 10
      accept-count: 100
      accesslog:
        enabled: true
        directory: logs
        pattern: common
        prefix: access_log
        suffix: .log
  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 1000
    scheduling:
      pool:
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      hikaricp: true
      lettuce: true
      jvm: true
      process: true
      system: true

logging:
  level:
    root: WARN
    com.bhukkad: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"


app:
  mtls:
    enabled: true
    keystore: /etc/tls/keystore.p12
    keystore-password: ${MTLS_KEYSTORE_PASSWORD:}
    truststore: /etc/tls/truststore.p12
    truststore-password: ${MTLS_TRUSTSTORE_PASSWORD:}

# =============================================================================
# PROFILE: UAT (User Acceptance Testing)
# =============================================================================
---
spring:
  config:
    activate:
      on-profile: uat
  main:
    lazy-initialization: true
    banner-mode: "off"
  flyway:
    validate-on-migrate: true
    baseline-on-migrate: true
    out-of-order: true
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      auto-commit: false
  data:
    redis:
      repositories:
        enabled: true
        bootstrap-mode: deferred
      lettuce:
        pool:
          max-active: 10
          max-idle: 4
          min-idle: 2
  cache:
    type: redis
  server:
    tomcat:
      max-threads: 200
      min-spare-threads: 5
  task:
    execution:
      pool:
        core-size: 16
        max-size: 64
        queue-capacity: 2000
    scheduling:
      pool:
        size: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info,beans,configprops
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.bhukkad: DEBUG