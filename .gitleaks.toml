# gitleaks configuration
#
# Baseline rules are used unchanged; this file only carves out narrow,
# auditable exceptions. Every allowlist entry must name the exact path and
# rule it exempts — never a whole directory, never a bare regex that would
# also mask a real credential elsewhere.

title = "bhukkad gitleaks config"

[extend]
# Inherit the upstream default rule set (generic-api-key, jwt, aws, gcp,
# private-key, etc.). Nothing here disables a rule globally.
useDefault = true

[[allowlists]]
description = """
Test-only JWT secret fixture inside a @SpringBootTest(properties=...) block.
CacheOpsControllerIntegrationTest mints legacy HS256 tokens locally, so it
must supply a secret; the value is the literal placeholder
0123456789abcdef0123456789abcdef (sequential hex, not a key). Scoped to that
one file and that one rule so a real credential committed anywhere else,
including in tests, is still caught.
"""
paths = [
  '''services/admin/src/test/java/com/bhukkad/admin/admin/CacheOpsControllerIntegrationTest\.java''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]
# defaultRuleMatch: AND semantics — the path AND the regex must both match,
# so a different secret in the same file is still reported.
defaultRuleMatch = "AND"