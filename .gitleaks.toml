# gitleaks configuration
#
# Baseline rules are used unchanged; this file only carves out narrow,
# auditable exceptions. Every allowlist entry must name the exact literal and
# the narrowest path scope that covers it — never a whole directory of real
# source, and never a loose regex that would also mask a genuine credential.

title = "bhukkad gitleaks config"

[extend]
# Inherit the upstream default rule set (generic-api-key, jwt, aws, gcp,
# private-key, etc.). Nothing here disables a rule globally.
useDefault = true

[[allowlists]]
description = """
Shared HS256 test-fixture key.

`0123456789abcdef0123456789abcdef` is the repo-wide unit-test signing key:
it appears in ~15 *Test.java files across every service (each mints local
HS256 tokens to exercise the auth filter) and in platform-lib's
SecretValidationConfig as a guard value. It is sequential hex repeated twice,
not a key — the validator itself requires >= 32 bytes and this is exactly
that.

Scoped to src/test/ only, AND-matched against this one literal. A real
credential committed to main source is still reported, and so is any other
hardcoded value in a test.
"""
paths = [
  '''src/test/''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]
defaultRuleMatch = "AND"